<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Octopus · 新建作战舱 v2 — 选个目录，点开始</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   新建作战舱 · v2（2026-11-15）
   用户对这一版的判断：
   「太复杂了，我要简约的。初始化其实是正儿八经通过 chat 来询问我的，
    所以我甚至可以什么都不选，然后进去让它再进行初始化。
    直接新建 → 点开始 → 我真正确认之后，就真的会创建一个会话，
    不像新建任务必须说完话才行。」

   所以 v2 只剩三件事：
   1. 一个目录（唯一必填）—— 一个目录 = 一个舱
   2. 一个可留空的舱名（默认取目录名）
   3. 一个「开始创建」—— 点下去就真的建舱 + 起会话

   其余全部后置：仓库、需求、要做什么，进去由汐音在对话里一个个问。
   汐音只留一张小像 + 一句引导 + 一句结果，不做侧栏、不做对话面板。
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --ink:#EDF0F7; --dim:#8790A6; --faint:#5C6479;
  --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.16);
  --bg0:#05060A; --paper:rgba(17,21,30,.72);
  --a:#4FD1D9; --b:#A78BFA; --c:#FFC857;
  --green:#7EE787; --amber:#FFC857; --red:#FF5C5C;
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-mono:'SF Mono','JetBrains Mono',Menlo,Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--ink);font-family:var(--font-ui);font-size:13.5px;line-height:1.6;
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--a) 30%,transparent)}
.dim{color:var(--dim)}
.mono{font-family:var(--font-mono)}
kbd{border:1px solid var(--bd);border-radius:4px;padding:0 4px;font-size:9.5px;color:var(--dim);
  font-family:var(--font-mono);background:rgba(255,255,255,.03)}

/* ───────── 背景：与 cockpit-v13 同源，压到最安静 ───────── */
.app{position:relative;height:100vh;display:flex;flex-direction:column;isolation:isolate;overflow:hidden}
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(100% 70% at 50% -14%, color-mix(in srgb,var(--b) 11%,transparent), transparent 62%),
    radial-gradient(80% 60% at 108% 106%, color-mix(in srgb,var(--a) 8%,transparent), transparent 62%),
    var(--bg0)}
.bg .grid{position:absolute;left:-40%;right:-40%;bottom:-46%;height:112%;
  background-image:
    linear-gradient(color-mix(in srgb,var(--a) 12%,transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb,var(--a) 12%,transparent) 1px, transparent 1px);
  background-size:64px 64px;transform:perspective(700px) rotateX(66deg);transform-origin:50% 0;
  mask-image:radial-gradient(ellipse at 50% 0%, #000 0%, rgba(0,0,0,.4) 46%, transparent 76%);opacity:.22}
@keyframes scan{0%{transform:translateY(-200px)}100%{transform:translateY(110vh)}}
.bg .scan{position:absolute;left:0;right:0;height:170px;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--a) 5%,transparent) 48%,transparent);
  animation:scan 15s linear infinite}

/* ───────── 返回 ───────── */
.back{position:absolute;top:18px;left:20px;z-index:5;display:inline-flex;align-items:center;gap:6px;
  color:var(--dim);font-size:12.5px;transition:color .16s}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px}

/* ───────── 一列：顶部锚定，勾选可选项时只往下长 ───────── */
.stage{position:relative;z-index:2;flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;
  overflow-y:auto;padding:clamp(48px,26vh,250px) 20px 34px}
.col{width:min(536px,100%)}

/* 汐音：小像 + 两句 */
.her{display:flex;align-items:center;gap:15px;margin:0 4px 18px}
.her .face{position:relative;flex:none;width:84px;height:84px;border-radius:22px;overflow:hidden;
  border:1px solid var(--bd2);background:#0C0F16;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.8), 0 0 0 1px color-mix(in srgb,var(--b) 10%,transparent) inset}
.her .face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 6%;
  transform:scale(1.24);transform-origin:50% 14%;transition:opacity .25s}
.her .face::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,transparent 58%,rgba(5,6,10,.62))}
.her .who{position:absolute;left:8px;bottom:5px;z-index:2;font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:.06em;color:color-mix(in srgb,var(--ink) 82%,transparent)}
.her .face .dot{position:absolute;right:7px;top:7px;z-index:2;width:6px;height:6px;border-radius:50%;
  background:var(--green);box-shadow:0 0 8px var(--green)}
.her .say{min-height:64px;display:flex;flex-direction:column;justify-content:center}
.her .hi{font-size:14.5px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.her .sub{margin-top:3px;font-size:12px;color:var(--dim);line-height:1.55}

/* 卡片 */
.card{position:relative;border:1px solid var(--bd2);border-radius:16px;background:var(--paper);
  backdrop-filter:blur(14px);padding:4px 0 0;min-height:318px;display:flex;flex-direction:column;
  box-shadow:0 24px 60px -30px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.04) inset}
.draft{display:flex;flex-direction:column;flex:1;min-height:0}
.fieldrow{display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--bd);transition:background .16s}
.fieldrow:last-of-type{border-bottom:0}

/* 目录 —— 唯一的主角 */
.dirrow{height:58px;cursor:pointer;border-radius:15px 15px 0 0}
.dirrow:hover{background:rgba(255,255,255,.025)}
.dirrow .ico{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;
  border:1px dashed var(--bd2);color:var(--faint);transition:.18s}
.dirrow.on .ico{border-style:solid;border-color:color-mix(in srgb,var(--c) 45%,transparent);
  color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.dirrow .ico svg{width:13px;height:13px}
.dirrow .val{flex:1;min-width:0;font-size:13px;color:var(--faint)}
.dirrow .val.filled{font-family:var(--font-mono);font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dirrow .pick{flex:none;font-size:11.5px;color:var(--dim);border:1px solid var(--bd);border-radius:999px;
  padding:3px 10px;transition:.16s}
.dirrow:hover .pick{color:var(--ink);border-color:var(--bd2)}
.dirrow.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 舱名 */
.namerow{height:46px}
.namerow .lbl{flex:none;width:44px;font-size:11.5px;color:var(--dim)}
.namerow input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13px;color:var(--ink);
  padding:6px 0;font-family:var(--font-ui)}
.namerow input::placeholder{color:var(--faint)}
.namerow .auto{flex:none;font-size:10.5px;font-family:var(--font-mono);color:var(--faint)}

/* 可选项：两条，收起时不占地方 */
.opt{display:flex;align-items:center;gap:9px;height:40px;padding:0 18px;cursor:pointer;border-top:1px solid var(--bd);
  transition:background .16s}
.opt:hover{background:rgba(255,255,255,.02)}
.opt .box{flex:none;width:13px;height:13px;border-radius:4px;border:1px solid var(--bd2);position:relative;transition:.16s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt input:checked + .box{background:color-mix(in srgb,var(--a) 22%,transparent);border-color:color-mix(in srgb,var(--a) 62%,transparent)}
.opt input:checked + .box::after{content:'';position:absolute;left:3.5px;top:1px;width:4px;height:7px;
  border:1.5px solid var(--a);border-top:0;border-left:0;transform:rotate(42deg)}
.opt .olbl{font-size:12px;color:color-mix(in srgb,var(--ink) 82%,transparent)}
.opt .otip{margin-left:auto;font-size:10.5px;color:var(--faint)}
.reveal{display:none;padding:0 18px 12px}
.reveal.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;
  border:1px solid var(--bd);font-family:var(--font-mono);font-size:11px;color:var(--dim);transition:.14s}
.chip:hover{color:var(--ink);border-color:var(--bd2)}
.chip.on{color:var(--bg0);background:var(--c);border-color:var(--c);font-weight:700}
.reqbox{width:100%;min-height:52px;resize:vertical;border-radius:10px;border:1px solid var(--bd);
  background:rgba(0,0,0,.22);padding:8px 10px;font-size:12px;line-height:1.6;outline:0;color:var(--ink)}
.reqbox:focus{border-color:color-mix(in srgb,var(--a) 40%,transparent)}
.reqbox::placeholder{color:var(--faint)}

/* 底栏：左返回，右闸门 */
.acts{display:flex;align-items:center;gap:12px;margin-top:auto;padding:14px 18px;border-top:1px solid var(--bd)}
.acts .hintline{flex:1;min-width:0;font-size:10.5px;color:var(--faint);line-height:1.45}
.go{flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:10px;
  font-size:12.5px;font-weight:700;color:#07100F;
  background:linear-gradient(100deg,var(--a),color-mix(in srgb,var(--b) 62%,var(--a)));
  box-shadow:0 8px 24px -12px color-mix(in srgb,var(--a) 70%,transparent), 0 1px 0 rgba(255,255,255,.22) inset;
  transition:transform .14s, filter .14s, opacity .14s}
.go:hover{filter:brightness(1.07)}
.go:active{transform:translateY(1px)}
.go[disabled]{opacity:.55;cursor:progress;filter:grayscale(.15)}
.go kbd{background:rgba(0,0,0,.16);border-color:rgba(0,0,0,.18);color:rgba(7,16,15,.72)}
.go .spin{width:12px;height:12px;border-radius:50%;border:1.6px solid rgba(7,16,15,.28);
  border-top-color:rgba(7,16,15,.9);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.back2{font-size:11.5px;color:var(--dim);transition:color .16s}
.back2:hover{color:var(--ink)}

/* 冲突提示：只出现，不撑开 */
.note{display:none;align-items:center;gap:7px;margin:-2px 18px 8px;padding:7px 10px;border-radius:8px;
  font-size:11.5px;color:var(--amber);background:color-mix(in srgb,var(--amber) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--amber) 26%,transparent)}
.note.on{display:flex}
.note b{color:var(--ink);font-weight:700}

/* 完成态：占同一块地方，不跳 */
.done{display:none;flex-direction:column;flex:1;min-height:0;padding:20px 18px 0}
.done.on{display:flex}
.done .drow{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}
.done .ok{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green);font-size:12px;
  border:1px solid color-mix(in srgb,var(--green) 40%,transparent)}
.done .dsub{margin-top:9px;font-size:12.5px;color:var(--dim);line-height:1.7}
.done .dsub code{font-family:var(--font-mono);font-size:11.5px;color:color-mix(in srgb,var(--a) 88%,white);
  background:color-mix(in srgb,var(--a) 10%,transparent);padding:1px 5px;border-radius:4px}
/* 进去之后她会问的三句 —— 把"初始化在对话里"这件事说实 */
.done .asks{margin-top:14px;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);
  background:rgba(0,0,0,.16)}
.done .asks .ah{font-size:10.5px;letter-spacing:.06em;color:var(--faint)}
.done .asks ul{margin:7px 0 0;padding:0;list-style:none}
.done .asks li{position:relative;padding-left:13px;font-size:12px;color:color-mix(in srgb,var(--ink) 76%,transparent);
  line-height:1.85}
.done .asks li::before{content:'';position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;
  background:color-mix(in srgb,var(--a) 70%,transparent)}
.done .acts{margin-top:auto;border-top:0;padding-left:0;padding-right:0}
.done .go{padding:0 15px}
.card.is-done .draft{display:none}

/* 页脚一行 */
.foot{margin:14px 6px 0;font-size:11px;color:var(--faint);text-align:center;line-height:1.6}
.foot b{color:var(--dim);font-weight:600}

/* 演示用：淡到几乎看不见 */
.demo{position:fixed;right:14px;bottom:12px;z-index:6;display:flex;gap:10px;font-family:var(--font-mono);
  font-size:10px;color:var(--faint);opacity:.5;transition:opacity .16s}
.demo:hover{opacity:1}
.demo button{font-size:10px;color:var(--faint)}
.demo button:hover{color:var(--dim);text-decoration:underline}

/* 目录小抽屉 */
.pop{position:absolute;z-index:20;left:14px;right:14px;top:56px;border:1px solid var(--bd2);border-radius:12px;
  background:#0B0E15;box-shadow:0 26px 60px -20px rgba(0,0,0,.9);padding:6px;display:none}
.pop.on{display:block}
.pop .pi{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:7px;
  font-family:var(--font-mono);font-size:11.5px;color:var(--dim);text-align:left}
.pop .pi:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.pop .pi .tag{flex:none;font-family:var(--font-ui);font-size:9.5px;color:var(--faint);
  border:1px solid var(--bd);border-radius:4px;padding:0 4px}
.pop .pi .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .sep{height:1px;background:var(--bd);margin:5px 4px}
.pop .manual{display:flex;gap:6px;padding:3px 4px 2px}
.pop .manual input{flex:1;min-width:0;height:30px;border-radius:7px;border:1px solid var(--bd);
  background:rgba(0,0,0,.25);padding:0 9px;font-family:var(--font-mono);font-size:11.5px;outline:0}
.pop .manual input:focus{border-color:color-mix(in srgb,var(--a) 42%,transparent)}
.pop .manual button{height:30px;padding:0 10px;border-radius:7px;font-size:11px;font-weight:700;
  color:var(--bg0);background:var(--a)}

@media (max-width:620px){
  .stage{padding-top:48px;padding-left:14px;padding-right:14px}
  .her{flex-direction:row;gap:12px;margin-bottom:14px}
  .her .face{width:64px;height:64px;border-radius:18px}
  .her .say{min-height:0}
  .her .hi{font-size:13.5px}
  .her .sub{font-size:11.5px}
  .card{min-height:0}
  .done{min-height:0}
  .acts{flex-wrap:wrap;gap:10px}
  .acts .hintline{flex-basis:100%;order:-1}
  .acts .go{width:100%;justify-content:center;height:40px}
}
@media (prefers-reduced-motion:reduce){
  .bg .scan{animation:none;opacity:.4}
  .dirrow.shake{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="bg"><div class="grid"></div><div class="scan"></div></div>

  <button class="back" id="backBtn" aria-label="返回对话">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    对话
  </button>

  <main class="stage">
    <div class="col">
      <!-- 汐音：一张小像，两句话。她在这里＝这是开舱，不是开任务。 -->
      <div class="her">
        <div class="face">
          <img id="faceImg" src="./crew/xiyin-happy.png" alt="汐音" />
          <span class="dot"></span>
          <span class="who">汐音</span>
        </div>
        <div class="say">
          <div class="hi" id="sayHi">选个目录，我们就有舱了。</div>
          <div class="sub" id="saySub">目录是唯一必填 —— 其余都能进去再聊。</div>
        </div>
      </div>

      <div class="card" id="card">
        <!-- 草稿态 -->
        <div class="draft" id="draft">
          <div class="fieldrow dirrow" id="dirRow" role="button" tabindex="0" aria-label="选择舱目录">
            <span class="ico">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5A2 2 0 015 5.5h4l2 2.5h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            </span>
            <span class="val" id="dirVal">选择目录…</span>
            <span class="pick">选择</span>
          </div>

          <div class="pop" id="pop">
            <div id="popList"></div>
            <div class="sep"></div>
            <div class="manual">
              <input id="popInput" placeholder="~/Projects/… 手填路径" />
              <button id="popOk">用这个</button>
            </div>
          </div>

          <label class="fieldrow namerow">
            <span class="lbl">舱名</span>
            <input id="fName" maxlength="40" placeholder="留空就用目录名" />
            <span class="auto" id="autoName"></span>
          </label>

          <label class="opt">
            <input type="checkbox" id="optRepo" />
            <span class="box"></span>
            <span class="olbl">绑仓库</span>
            <span class="otip">进去再绑也行</span>
          </label>
          <div class="reveal" id="repoRev">
            <div class="chips" id="repoChips"></div>
          </div>

          <label class="opt">
            <input type="checkbox" id="optReq" />
            <span class="box"></span>
            <span class="olbl">先写一句需求</span>
            <span class="otip">落 .cabin/requirements.md</span>
          </label>
          <div class="reveal" id="reqRev">
            <textarea class="reqbox" id="fReq" placeholder="这个舱长期要做什么？一句话就够。"></textarea>
          </div>

          <div class="note" id="note">
            <span>这个目录已经是 <b id="noteName">账本舱</b> 了 —— 不新建，直接接进去。</span>
          </div>

          <div class="acts">
            <span class="hintline">点开始就真的建舱、起会话。<br>初始化在对话里，不用先想清楚。</span>
            <button class="go" id="goBtn">
              <span id="goText">开始创建</span>
              <kbd>⌘⏎</kbd>
            </button>
          </div>
        </div>

        <!-- 完成态 -->
        <div class="done" id="done">
          <div class="drow"><span class="ok">✓</span><span id="doneName">舱</span>
            <span class="dim" style="font-weight:400;font-size:12px" id="doneTag">已创建</span></div>
          <div class="dsub" id="doneSub"></div>
          <div class="asks">
            <div class="ah">进去之后她会问</div>
            <ul>
              <li>这个舱长期要做什么</li>
              <li>绑哪些仓库（不绑也行）</li>
              <li>先从哪一件事开始</li>
            </ul>
          </div>
          <div class="acts">
            <span class="hintline" id="doneHint"></span>
            <button class="go" id="enterBtn">进入作战舱 →</button>
          </div>
        </div>
      </div>

      <p class="foot"><b>一个目录 = 一个舱。</b>初始化不在这里 —— 进去之后，汐音会问你。</p>
    </div>
  </main>

  <div class="demo" aria-label="演示状态">
    <button data-demo="empty">空</button>
    <button data-demo="half">半填</button>
    <button data-demo="conflict">冲突</button>
  </div>
</div>

<script>
/* ═══════════════ 数据 ═══════════════ */
const REMEMBERED = [
  { path: '~/Projects/ai/XzhiF/open-octopus', tag: '上次' },
  { path: '~/Projects/ai/XzhiF/ledger',       tag: '常用' },
  { path: '~/Projects/ai/XzhiF/aurora',       tag: '常用' },
  { path: '~/Documents/lab/notes',            tag: '' },
]
/* 演示：这些目录已经是舱了 → 走 attach */
const EXISTING = {
  '~/Projects/ai/XzhiF/ledger': '账本舱',
  '~/Projects/ai/XzhiF/open-octopus': '八爪舱',
}
const REPOS = ['workspace', 'ledger', 'engine', 'web-app', 'docs']

/* 表情按画面取（docs/cabin-design/crew 这套的图名与内容对不上，见 14 号文档 §10） */
const FACE = {
  idle:  './crew/xiyin-happy.png',
  ask:   './crew/xiyin-idle.png',
  think: './crew/xiyin-wink.png',
  done:  './crew/xiyin-working.png',
}

/* ═══════════════ 状态：只是一张草稿，什么都没落库 ═══════════════ */
const state = {
  dir: null, name: '', repos: [], req: '',
  busy: false, done: false, conflict: null, attach: false,
}

const $ = (id) => document.getElementById(id)
const el = {
  dirRow: $('dirRow'), dirVal: $('dirVal'), fName: $('fName'), autoName: $('autoName'),
  optRepo: $('optRepo'), repoRev: $('repoRev'), repoChips: $('repoChips'),
  optReq: $('optReq'), reqRev: $('reqRev'), fReq: $('fReq'),
  pop: $('pop'), popList: $('popList'), popInput: $('popInput'),
  note: $('note'), noteName: $('noteName'),
  goBtn: $('goBtn'), goText: $('goText'),
  card: $('card'), draft: $('draft'), done: $('done'),
  doneName: $('doneName'), doneTag: $('doneTag'), doneSub: $('doneSub'), doneHint: $('doneHint'),
  faceImg: $('faceImg'), sayHi: $('sayHi'), saySub: $('saySub'),
}

function face(kind) {
  el.faceImg.src = FACE[kind]
}
function say(hi, sub, kind) {
  el.sayHi.textContent = hi
  el.saySub.textContent = sub || ''
  if (kind) face(kind)
}
const base = (p) => (p || '').split('/').filter(Boolean).pop() || ''

/* ═══════════════ 渲染 ═══════════════ */
function render() {
  el.dirVal.textContent = state.dir || '选择目录…'
  el.dirVal.classList.toggle('filled', !!state.dir)
  el.dirRow.classList.toggle('on', !!state.dir)

  // 舱名：留空时把目录名灰在旁边，明确"不填也行"
  el.autoName.textContent = state.dir && !state.name.trim() ? base(state.dir) : ''

  // 冲突：不遮不挡，只在目录下面亮一行，按钮改字
  el.conflict = state.dir ? (EXISTING[state.dir] || null) : null
  el.note.classList.toggle('on', !!el.conflict)
  if (el.conflict) el.noteName.textContent = el.conflict

  const attach = !!el.conflict
  el.goText.textContent = state.busy ? '正在落舱…' : attach ? `接进「${el.conflict}」` : '开始创建'
  el.goBtn.disabled = state.busy

  if (state.dir && !el.pop.classList.contains('hold')) {
    // 有目录就不是"待选"的语气了
    if (!state.busy && !state.done) say(
      attach ? `这个目录我认识 —— 已经是「${el.conflict}」了。`
             : `「${state.name.trim() || base(state.dir)}」。`,
      attach ? '不用再建一个，直接接进去。'
             : '点开始，我就把舱建起来，然后在里面等你。',
      'ask',
    )
  }
}

function renderChips() {
  el.repoChips.innerHTML = ''
  for (const r of REPOS) {
    const b = document.createElement('button')
    b.className = 'chip' + (state.repos.includes(r) ? ' on' : '')
    b.textContent = r
    b.onclick = () => {
      state.repos = state.repos.includes(r) ? state.repos.filter((x) => x !== r) : [...state.repos, r]
      renderChips()
    }
    el.repoChips.appendChild(b)
  }
}

function renderPop() {
  el.popList.innerHTML = ''
  for (const d of REMEMBERED) {
    const b = document.createElement('button')
    b.className = 'pi'
    b.innerHTML = `<span class="p">${d.path}</span>${d.tag ? `<span class="tag">${d.tag}</span>` : ''}`
    b.onclick = () => { pickDir(d.path); closePop() }
    el.popList.appendChild(b)
  }
}

function openPop() {
  el.pop.classList.add('on', 'hold')
  renderPop()
  setTimeout(() => $('popInput').focus(), 30)
}
function closePop() {
  el.pop.classList.remove('on', 'hold')
}
function pickDir(p) {
  state.dir = p
  closePop()
  render()
}

/* ═══════════════ 真实创建：唯一闸门 ═══════════════ */
function startCreate() {
  if (state.busy || state.done) return
  if (!state.dir) {
    el.dirRow.classList.remove('shake')
    void el.dirRow.offsetWidth
    el.dirRow.classList.add('shake')
    say('得先有个目录。', '一个目录就是一个舱 —— 选一个就好。', 'ask')
    openPop()
    return
  }
  state.busy = true; state.attach = !!EXISTING[state.dir]
  el.goBtn.disabled = true
  el.goText.textContent = state.attach ? '正在接入…' : '正在落舱…'
  say(state.attach ? '接进去了，别急。' : '正在落舱……',
      state.attach ? '不新建，用你原来的舱。' : '写 .cabin/ · 接注册表 · 起一条会话。', 'think')

  // 原型模拟三步；真实实现 = createCabin → initCabin（冲突则 attachCabin）→ onCreated
  setTimeout(() => {
    state.busy = false; state.done = true
    const name = state.name.trim() || base(state.dir)
    el.draft.style.display = 'none'
    el.card.classList.add('is-done')
    el.done.classList.add('on')
    el.doneName.textContent = name
    el.doneTag.textContent = state.attach ? `已接入「${EXISTING[state.dir]}」` : '已创建'
    el.doneSub.innerHTML = state.attach
      ? `目录 <code>${state.dir}</code><br>不新建第二个舱，历史与作业都在。`
      : `目录 <code>${state.dir}</code><br>会话已开 —— 第一句由她来问。`
    el.doneHint.textContent = '会话已经开着 —— 她先开口。'
    say(state.attach ? '回来了。' : '舱建好了。',
        state.attach ? '你的东西都还在，接着说吧。'
                     : '第一句我来问：这个舱你打算长期拿它做什么？', 'done')
  }, 1100)
}

/* ═══════════════ 演示 ═══════════════ */
function reset() {
  Object.assign(state, { dir: null, name: '', repos: [], req: '', busy: false, done: false, attach: false })
  el.fName.value = ''; el.fReq.value = ''
  el.optRepo.checked = false; el.optReq.checked = false
  el.repoRev.classList.remove('on'); el.reqRev.classList.remove('on')
  el.card.classList.remove('is-done'); el.done.classList.remove('on'); el.draft.style.display = ''
  el.goBtn.disabled = false
  closePop(); renderChips(); render()
  say('选个目录，我们就有舱了。', '目录是唯一必填 —— 其余都能进去再聊。', 'idle')
}

function setDemo(kind) {
  reset()
  if (kind === 'half') {
    state.dir = '~/Projects/ai/XzhiF/aurora'
    state.name = '极光舱'
    el.fName.value = '极光舱'
    el.optRepo.checked = true; el.repoRev.classList.add('on')
    state.repos = ['workspace', 'web-app']; renderChips()
    render()
  } else if (kind === 'conflict') {
    state.dir = '~/Projects/ai/XzhiF/ledger'
    state.name = '账本舱'
    el.fName.value = '账本舱'
    render()
  }
}

/* ═══════════════ 绑定 ═══════════════ */
el.dirRow.onclick = () => { if (!state.done) openPop() }
el.dirRow.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPop() } }
document.addEventListener('click', (e) => {
  if (!el.pop.classList.contains('on')) return
  if (!el.pop.contains(e.target) && !el.dirRow.contains(e.target)) closePop()
})
$('popOk').onclick = () => {
  const v = $('popInput').value.trim()
  if (v) pickDir(v)
}
$('popInput').onkeydown = (e) => { if (e.key === 'Enter') $('popOk').click() }

el.fName.oninput = () => { state.name = el.fName.value; render() }
el.optRepo.onchange = () => el.repoRev.classList.toggle('on', el.optRepo.checked)
el.optReq.onchange = () => el.reqRev.classList.toggle('on', el.optReq.checked)
el.fReq.oninput = () => { state.req = el.fReq.value }

el.goBtn.onclick = (e) => { e.stopPropagation(); startCreate() }
$('enterBtn').onclick = (e) => {
  e.stopPropagation()
  say('走吧。', '门开着。', 'done')
}
$('backBtn').onclick = () => state.done
  ? say('舱已经建好了。', '回去找它就行 —— 门一直开着。', 'done')
  : say('草稿还在。', '不过真的什么都没建 —— 随时回来。', 'idle')

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); startCreate() }
  if (e.key === 'Escape') closePop()
})

document.querySelectorAll('[data-demo]').forEach((b) => {
  b.onclick = () => setDemo(b.dataset.demo)
})

/* ═══════════════ 启动 ═══════════════ */
renderPop(); renderChips(); render()
</script>
</body>
</html>
