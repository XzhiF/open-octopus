<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Octopus · 工作台 — ledger</title>
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root{
  --ink:#EDF0F7; --dim:#8790A6; --faint:#5C6479;
  --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.15);
  --bg0:#05060A; --bg1:#0A0D14;
  --a:#4FD1D9; --b:#A78BFA; --c:#FFC857;
  --green:#7EE787; --amber:#FFC857; --red:#FF5C5C; --cyan:#4FD1D9; --violet:#A78BFA; --pink:#FF855C;
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-mono:'SF Mono','JetBrains Mono',Menlo,Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:
    radial-gradient(90% 60% at 50% -20%, color-mix(in srgb,var(--b) 10%,transparent), transparent 60%),
    radial-gradient(70% 50% at 100% 110%, color-mix(in srgb,var(--a) 7%,transparent), transparent 60%),
    var(--bg0);
  color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.55;overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#343B4A;border-radius:4px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--font-mono)}
.dim{color:var(--dim)}
.faint{color:var(--faint)}
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── top ── */
.top{flex:none;height:50px;display:flex;align-items:center;gap:12px;padding:0 18px;
  border-bottom:1px solid var(--bd);background:rgba(8,10,16,.72);backdrop-filter:blur(12px);z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--a)}
.brand .hex{width:20px;height:20px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--a) 50%,transparent);
  border-radius:6px;font-size:11px;box-shadow:0 0 12px color-mix(in srgb,var(--a) 25%,transparent)}
.brand b{font-size:11px;letter-spacing:.08em;color:var(--ink)}
.cwd{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim);font-family:var(--font-mono)}
.cwd i{font-style:normal;color:var(--faint);font-size:9px;letter-spacing:.1em}
.top .tstats{display:flex;align-items:center;gap:14px;font-size:9.5px;letter-spacing:.08em;color:var(--faint);margin-left:8px}
.top .tstats b{color:var(--ink);font-size:11px;font-family:var(--font-mono)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.ghost{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;
  border:1px solid var(--bd);color:var(--dim);font-size:11px;transition:.14s;background:rgba(255,255,255,.02);white-space:nowrap}
.ghost:hover{color:var(--ink);border-color:var(--bd2);background:rgba(255,255,255,.05)}
.ghost.pri{color:#05070B;background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,#fff));
  border-color:transparent;font-weight:800;box-shadow:0 0 18px color-mix(in srgb,var(--a) 25%,transparent)}
.ghost.pri:hover{filter:brightness(1.08)}

/* ── body ── */
.body{flex:1;min-height:0;display:flex}
.rail{flex:none;width:288px;border-right:1px solid var(--bd);display:flex;flex-direction:column;
  overflow:auto;padding:12px 10px 14px;background:rgba(9,11,17,.45)}
.rsec{flex:none;margin-bottom:14px}
.rsec.grow{flex:1;min-height:0;display:flex;flex-direction:column}
.rhead{display:flex;align-items:center;gap:7px;padding:2px 6px 7px;font-size:9px;letter-spacing:.16em;color:var(--faint);font-weight:700}
.rhead .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--bd2),transparent)}
.rhead .n{color:var(--dim);font-family:var(--font-mono);letter-spacing:0}
.rlist{display:flex;flex-direction:column;gap:6px}

/* attention card */
.attn{position:relative;text-align:left;border:1px solid var(--bd);border-left:2px solid var(--accent,var(--a));
  border-radius:10px;padding:8px 10px 9px;background:rgba(255,255,255,.02);transition:.15s;width:100%}
.attn:hover{background:color-mix(in srgb,var(--accent) 6%,transparent);border-color:color-mix(in srgb,var(--accent) 38%,transparent);
  transform:translateX(2px)}
.attn .ak{display:block;font-size:8px;letter-spacing:.14em;font-weight:800;color:var(--accent)}
.attn .at{display:block;font-size:11.5px;font-weight:750;color:var(--ink);margin-top:2px;line-height:1.35}
.attn .as{display:block;font-size:9.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* filters + tasks */
.fchips{display:flex;gap:5px;padding:0 4px 8px}
.fchip{height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--bd);color:var(--faint);
  font-size:9.5px;transition:.13s}
.fchip:hover{color:var(--ink);border-color:var(--bd2)}
.fchip.on{color:var(--a);border-color:color-mix(in srgb,var(--a) 45%,transparent);
  background:color-mix(in srgb,var(--a) 8%,transparent)}
.tlist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}
.trow{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;
  border:1px solid transparent;transition:.13s}
.trow:hover{background:rgba(255,255,255,.035);border-color:var(--bd)}
.trow.on{background:color-mix(in srgb,var(--a) 7%,transparent);border-color:color-mix(in srgb,var(--a) 30%,transparent)}
.trow .tk{flex:none;margin-top:1px;font-size:8px;padding:1px 5px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.tk.dev{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 10%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent)}
.tk.art{color:var(--amber);background:color-mix(in srgb,var(--amber) 9%,transparent);border:1px solid color-mix(in srgb,var(--amber) 28%,transparent)}
.trow .tb{flex:1;min-width:0}
.trow .tb b{display:block;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tb span{display:block;font-size:9px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .st{flex:none;font-size:8px;padding:1px 6px;border-radius:999px;border:1px solid var(--bd);color:var(--dim);margin-top:1px}
.st.wait{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 38%,transparent)}
.st.run{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 38%,transparent)}
.st.fail{color:var(--red);border-color:color-mix(in srgb,var(--red) 38%,transparent)}
.st.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 38%,transparent)}

/* sessions */
.srow{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:6px 7px;border-radius:8px;transition:.13s}
.srow:hover{background:rgba(255,255,255,.035)}
.srow.on{background:color-mix(in srgb,var(--a) 7%,transparent)}
.srow .av{width:22px;height:22px;border-radius:6px;overflow:hidden;flex:none;background:#0c0e15;border:1px solid var(--bd)}
.srow .av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.srow .sm{flex:1;min-width:0}
.srow .sm b{display:block;font-size:10.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sm span{display:block;font-size:8.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sd{width:5px;height:5px;border-radius:50%;flex:none;background:var(--dim)}
.srow .sd.run{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.srow .sd.wait{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.srow .sd.fail{background:var(--red);box-shadow:0 0 6px var(--red)}

/* ── main ── */
.main{flex:1;min-width:0;min-height:0;overflow:auto;padding:16px 20px 20px}
.taskhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.taskhead .k{font-size:8.5px;padding:2px 7px;border-radius:5px;letter-spacing:.04em;margin-top:3px}
.taskhead h1{font-size:19px;line-height:1.25;margin:0;letter-spacing:.01em;font-weight:800}
.taskhead .status{font-size:9px;padding:2px 8px;border-radius:999px;border:1px solid var(--bd);color:var(--dim);margin-top:2px}
.taskhead .meta{display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--faint);
  font-family:var(--font-mono);margin-top:4px;width:100%}
.taskhead .meta .sep{width:2px;height:2px;border-radius:50%;background:var(--faint)}
.taskhead .right{margin-left:auto;display:flex;align-items:center;gap:7px}
.mini{height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--bd);color:var(--dim);font-size:10px;transition:.13s;white-space:nowrap}
.mini:hover{color:var(--ink);border-color:var(--bd2);background:rgba(255,255,255,.05)}

.lenses{display:flex;align-items:center;gap:4px;padding:10px 0 12px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.lens{height:27px;padding:0 11px;border-radius:7px;color:var(--dim);font-size:10.5px;transition:.13s}
.lens:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.lens.on{color:var(--a);background:color-mix(in srgb,var(--a) 9%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 32%,transparent)}
.lenses .hint{margin-left:auto;font-size:9px;color:var(--faint)}

/* panes */
.pgrid{display:grid;gap:12px}
.pgrid.c2{grid-template-columns:1fr 1fr}
.pgrid.c12{grid-template-columns:1.08fr .92fr}
.pgrid.c21{grid-template-columns:.92fr 1.08fr}
.pgrid.c3{grid-template-columns:1fr 1fr 1fr}
.pgrid.trace{grid-template-columns:1.1fr .9fr;grid-template-rows:minmax(0,.86fr) minmax(0,1.14fr);
  height:calc(100vh - 300px);min-height:380px}
.pgrid.trace .p1{grid-column:1;grid-row:1}
.pgrid.trace .p2{grid-column:2;grid-row:1/3}
.pgrid.trace .p3{grid-column:1;grid-row:2}
.pane{border:1px solid var(--bd);border-radius:11px;background:rgba(14,18,26,.55);overflow:hidden;
  display:flex;flex-direction:column;min-width:0;min-height:0}
.pane-h{flex:none;display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--bd);
  font-size:9px;letter-spacing:.13em;color:var(--faint)}
.pane-h b{font-size:11px;letter-spacing:.02em;color:var(--ink);font-weight:700}
.pane-h .tag{margin-left:auto;font-size:8px;padding:1px 6px;border-radius:999px;border:1px solid var(--bd);color:var(--dim)}
.pane-h .tag.g{color:var(--green);border-color:color-mix(in srgb,var(--green) 38%,transparent)}
.pane-h .tag.r{color:var(--red);border-color:color-mix(in srgb,var(--red) 38%,transparent)}
.pane-h .tag.c{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 38%,transparent)}
.pane-b{padding:10px 12px;overflow:auto;min-height:0}
.pane-b.tight{padding:7px 9px}
.pane-b.flush{padding:7px;display:flex;overflow:hidden}
.pane-b.flush .stream{flex:1;height:auto}

/* task overview */
.summary{font-size:12px;line-height:1.7;color:var(--dim)}
.summary b{color:var(--ink);font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.kv .cell{border:1px solid var(--bd);border-radius:7px;padding:6px 8px;background:rgba(255,255,255,.02);min-width:0}
.kv .l{font-size:8px;letter-spacing:.1em;color:var(--faint)}
.kv .v{font-size:10.5px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv .v.g{color:var(--green)}.kv .v.c{color:var(--cyan)}.kv .v.m{color:var(--amber)}

.phases{position:relative}
.phases::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:1px;background:linear-gradient(180deg,var(--bd2),transparent)}
.phase{display:flex;gap:8px;padding:4px 1px 8px;position:relative;align-items:flex-start}
.ph-d{width:17px;height:17px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:8px;
  border:1px solid var(--bd);color:var(--faint);background:var(--bg1);position:relative;z-index:1;margin-top:1px}
.phase.done .ph-d{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.phase.now .ph-d{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent);animation:pulse 1.8s infinite}
.phase.warn .ph-d{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.phase.fail .ph-d{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.phase .pb{flex:1;min-width:0}
.phase .pb b{display:block;font-size:10.5px;color:var(--ink)}
.phase.wait .pb b{color:var(--dim)}
.phase .pb span{display:block;font-size:9px;color:var(--dim);line-height:1.4;margin-top:1px}
.phase .pw{font-size:8.5px;color:var(--faint);flex:none;margin-left:6px}

.chk{display:flex;gap:8px;padding:6px 2px;border-bottom:1px dashed rgba(255,255,255,.06);font-size:10.5px;line-height:1.45}
.chk:last-child{border-bottom:0}
.chk .box{width:14px;height:14px;border-radius:4px;flex:none;display:grid;place-items:center;font-size:8px;margin-top:1px}
.chk.ok .box{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 45%,transparent)}
.chk.warn .box{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent)}
.chk.no .box{background:rgba(255,255,255,.04);color:var(--faint);border:1px solid var(--bd)}
.chk .ct{flex:1;min-width:0;color:var(--ink)}
.chk .ct small{display:block;color:var(--dim);font-size:9px;margin-top:1px}
.chk.warn .ct{color:#FFE1A3}

.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:7px;
  border:1px solid var(--bd);font-size:10px;font-weight:600;color:var(--dim);transition:.13s}
.btn:hover{color:var(--ink);border-color:var(--bd2);background:rgba(255,255,255,.05)}
.btn.pri{color:var(--a);border-color:color-mix(in srgb,var(--a) 40%,transparent);background:color-mix(in srgb,var(--a) 9%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 42%,transparent)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 36%,transparent)}
.btn.pri::after{content:"推荐";font-size:7px;letter-spacing:.06em;color:var(--a);
  border:1px solid color-mix(in srgb,var(--a) 40%,transparent);border-radius:999px;padding:0 4px}

/* run */
.stream{font-family:var(--font-mono);font-size:9.5px;line-height:1.6;background:rgba(0,0,0,.26);
  border:1px solid var(--bd);border-radius:8px;padding:7px 9px;overflow:auto;height:100%;min-height:120px}
.sl{display:flex;gap:6px;white-space:pre-wrap;color:var(--dim);align-items:flex-start}
.sl .st{color:var(--faint);flex:none;font-size:8px;padding-top:1px}
.sl .tag{flex:none;font-size:7.5px;padding:0 4px;border-radius:3px;line-height:13px;height:13px;
  border:1px solid var(--bd);color:var(--faint);margin-top:1px}
.sl .tag.tool{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 38%,transparent)}
.sl .tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 38%,transparent)}
.sl .tag.err{color:var(--red);border-color:color-mix(in srgb,var(--red) 38%,transparent)}
.sl .tag.think{color:var(--b);border-color:color-mix(in srgb,var(--b) 38%,transparent)}
.sl.ok{color:#9EE6A4}.sl.err{color:#FFA1A1}
.sl .cr{display:inline-block;width:5px;height:10px;background:var(--a);animation:blink 1s steps(1) infinite;margin-top:3px}
@keyframes blink{50%{opacity:0}}
.nodes{display:flex;flex-direction:column;gap:2px}
.nnode{display:flex;align-items:flex-start;gap:7px;padding:5px 5px;border-radius:6px;text-align:left;width:100%;transition:.13s}
.nnode:hover{background:rgba(255,255,255,.04)}
.nnode.sel{background:color-mix(in srgb,var(--a) 7%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 26%,transparent)}
.nnode .ni{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:7px;flex:none;margin-top:1px;
  border:1px solid var(--bd);color:var(--faint)}
.nnode.done .ni{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.nnode.run .ni{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 50%,transparent);animation:pulse 1.8s infinite}
.nnode.fail .ni{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.nnode .nb{flex:1;min-width:0}
.nnode .nb b{display:block;font-size:10px;color:var(--ink)}
.nnode .nb span{display:block;font-size:8.5px;color:var(--faint);line-height:1.4}
.nnode .nt{font-size:8.5px;color:var(--faint);flex:none;margin-top:1px}
.runhead{display:flex;align-items:center;gap:7px;padding:0 3px 7px;margin-bottom:5px;font-size:8.5px;color:var(--faint);
  border-bottom:1px dashed rgba(255,255,255,.07)}
.runhead b{color:var(--ink);font-size:10.5px}
.runhead .rp{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.runhead .rp i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}

/* changes */
.file{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:10px;border:1px solid transparent;
  width:100%;text-align:left;transition:.12s}
.file:hover{background:rgba(255,255,255,.04);border-color:var(--bd)}
.file.on{border-color:color-mix(in srgb,var(--a) 40%,transparent);background:color-mix(in srgb,var(--a) 7%,transparent)}
.file .st2{font-size:8px;width:12px;text-align:center;flex:none;font-weight:800;color:var(--amber)}
.file .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-family:var(--font-mono)}
.file .add{color:var(--green);font-size:9px;flex:none}
.file .del{color:var(--red);font-size:9px;flex:none}
.diff{border:1px solid var(--bd);border-radius:8px;overflow:hidden;font-size:9.5px;line-height:1.6;background:rgba(0,0,0,.22)}
.diff .dh{display:flex;gap:8px;padding:5px 8px;border-bottom:1px solid var(--bd);color:var(--faint);font-size:8.5px}
.diff .dl{display:flex;gap:8px;padding:0 8px;white-space:pre;overflow-x:auto}
.diff .dl .n{width:18px;text-align:right;color:var(--faint);flex:none}
.diff .dl.add{background:rgba(126,231,135,.07);color:#B8F5BE}
.diff .dl.del{background:rgba(255,92,92,.07);color:#FFB3B3}
.diff .dl.ctx{color:var(--dim)}
.cmt{display:flex;align-items:center;gap:7px;padding:4px 3px;border-bottom:1px dashed rgba(255,255,255,.06);font-size:9.5px}
.cmt:last-child{border:0}
.cmt .sha{color:var(--a);font-family:var(--font-mono);font-size:8.5px;flex:none}
.cmt .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cmt .tm{color:var(--faint);font-size:8.5px;flex:none}

/* art */
.artstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.artcard{position:relative;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:#0b0e15;transition:.15s;text-align:left}
.artcard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--a) 45%,transparent)}
.artcard.on{border-color:color-mix(in srgb,var(--a) 65%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 30%,transparent),0 0 18px color-mix(in srgb,var(--a) 10%,transparent)}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

const taskById = (id) => TASKS.find((t) => t.id === id)
const sessionById = (id) => SESSIONS.find((s) => s.id === id)
const taskLensKey = (t) => state.taskId === t.id ? state.lens : ''

/* hash 互跳：index-v2.html#task=m2&lens=changes */
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1))
  if (h.get('task') && taskById(h.get('task'))) state.taskId = h.get('task')
  if (h.get('lens')) state.lens = h.get('lens')
  if (h.get('view') === 'trace') state.view = 'trace'
  if (h.get('session') && sessionById(h.get('session'))) { state.view = 'session'; state.sessionId = h.get('session') }
}
function toCockpit() {
  if (state.view === 'trace') { location.href = 'cockpit-v7.html#view=trace'; return }
  if (state.view === 'session') { location.href = 'cockpit-v7.html#session=' + state.sessionId; return }
  const t = taskById(state.taskId) || TASKS[0]
  location.href = `cockpit-v7.html#task=${t.id}&lens=${state.lens}`
}
function lensesOf(t) {
  if (t.kind === 'art') return [['overview', '概览'], ['versions', '版本'], ['materials', '素材'], ['deliver', '交付']]
  if (t.mode === 'direct') return [['overview', '概览'], ['session', '会话'], ['changes', '变更'], ['trace', 'Trace']]
  return [['overview', '概览'], ['run', '运行'], ['changes', '变更'], ['trace', 'Trace']]
}
function defaultLens(t) { return 'overview' }
function setTask(id, lens) {
  state.view = 'task'; state.taskId = id; state.lens = lens || defaultLens(taskById(id))
  state.checkFile = null
  render()
}
function openSession(id) { state.view = 'session'; state.sessionId = id; render() }
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show')
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2600)
}
function ticker(msg) {
  $('#tickText').textContent = msg
}

  $('#taskN').textContent = String(TASKS.filter((t) => state.kind === 'all' || t.kind === state.kind).length)
  $('#sessN').textContent = String(SESSIONS.length)
  $('#attnList').innerHTML = ATTENTION.map((a) => `
    <button class="attn" data-attn="${a.id}" style="--accent:${a.color}">
      <span class="ak">${esc(a.k)}</span>
      <span class="at">${esc(a.t)}</span>
      <span class="as">${esc(a.s)}</span>
    </button>`).join('')
  $('#taskList').innerHTML = TASKS
    .filter((t) => state.kind === 'all' || t.kind === state.kind)
    .map((t) => `
      <button class="trow ${state.view === 'task' && state.taskId === t.id ? 'on' : ''}" data-task="${t.id}">
        <span class="tk ${t.kind}">${t.kind === 'art' ? '绘画' : '开发'}</span>
        <span class="tb"><b>${esc(t.code)} · ${esc(t.title)}</b>
          <span>${t.kind === 'dev' ? (t.mode === 'workflow' ? '工作流 · ' + esc(t.workflow) : '直做 · 不挂流') : t.versions.length + ' 版' + (t.versions.some((v) => v.sel) ? ' · 已选 v' + t.versions.find((v) => v.sel).v : '')} · ${t.updated}</span></span>
        <span class="st ${t.tone}">${esc(t.status)}</span>
      </button>`).join('') || '<div class="empty">这个分类下没有任务。</div>'
  $('#sessList').innerHTML = SESSIONS.map((s) => {
    const t = s.taskId ? taskById(s.taskId) : null
    return `<button class="srow ${state.view === 'session' && state.sessionId === s.id ? 'on' : ''}" data-session="${s.id}">
      <span class="av"><img src="${avatarOf(s)}" alt="" /></span>
      <span class="sm"><b>${esc(s.name)}</b><span>${esc(t ? t.code + ' · ' + t.title : '主会话')} · ${esc(s.doing)}</span></span>
      <span class="sd ${s.status}"></span>
    </button>`
  }).join('')
}

/* ═══════════════════════ 主区：任务 ═══════════════════════ */
function taskHead(t) {
  const kind = t.kind === 'art' ? '绘画' : '开发'
  const sub = t.kind === 'art' ? '迭代' : (t.mode === 'workflow' ? '工作流 · ' + t.workflow : '直做 · 不挂流')
  return `<div class="taskhead">
    <span class="k ${t.kind === 'art' ? 'tk art' : 'tk dev'}">${kind} · ${esc(sub)}</span>
    <h1>${esc(t.code)} · ${esc(t.title)}</h1>
    <span class="status st ${t.tone}">${esc(t.status)}</span>
    <span class="right">
      <button class="mini" data-act="open-session">会话 ${t.session ? '· ' + esc(sessionById(t.session).name) : ''}</button>
    </span>
    <div class="meta"><span>${esc(CABIN.cwd)}</span><span class="sep"></span><span>${esc(t.kind === 'art' ? 'output/art/' + t.id + '/' : t.branch)}</span>
      <span class="sep"></span><span>¥${t.cost.toFixed(2)}</span><span class="sep"></span><span>${t.updated} 前</span>
      ${t.kind === 'dev' ? `<span class="sep"></span><span>${t.pct}%</span>` : ''}</div>
  </div>`
}

function renderTask(t) {
  const lenses = lensesOf(t)
  const lens = lenses.some(([k]) => k === state.lens) ? state.lens : 'overview'
  state.lens = lens
  return `<div class="taskview">
    ${taskHead(t)}
    <div class="lenses">
      ${lenses.map(([k, label]) => `<button class="lens ${k === lens ? 'on' : ''}" data-lens="${k}">${label}</button>`).join('')}
      <span class="hint">${t.kind === 'art' ? '选稿 / 修图都直接说' : '运行、变更、Trace 都是这个任务的镜头'}</span>
    </div>
    <div id="lensBody">${lensBody(t, lens)}</div>
  </div>`
}

function lensBody(t, lens) {
  if (t.kind === 'art') {
    if (lens === 'versions') return artVersions(t)
    if (lens === 'materials') return artMaterials(t)
    if (lens === 'deliver') return artDeliver(t)
    return artOverview(t)
  }
  if (lens === 'run') return devRun(t)
  if (lens === 'session') return devSession(t)
  if (lens === 'changes') return devChanges(t)
  if (lens === 'trace') return devTrace(t)
  return devOverview(t)
}

/* ── dev run ── */
function devRun(t) {
  if (!t.run) return `<div class="empty">这个任务不挂工作流（直做），去「会话」看执行现场。</div>`
  const r = t.run
  const sel = r.nodes.find((n) => n.key === state.node) || r.nodes.find((n) => n.s === 'run') || r.nodes.find((n) => n.s === 'fail') || r.nodes[0]
  state.node = sel.key
  const done = r.nodes.filter((n) => n.s === 'done').length
  return `<div class="pgrid c21">
    <div class="pane">
      <div class="pane-h"><b>节点</b><span class="tag c">${done}/${r.nodes.length}</span></div>
      <div class="pane-b tight">
        <div class="runhead"><b>${esc(r.wf)}</b><span class="rp"><i style="width:${Math.round(done / r.nodes.length * 100)}%"></i></span><span>${esc(r.elapsed)}</span></div>
        <div class="nodes">${r.nodes.map((n) => `<button class="nnode ${n.s} ${n.key === sel.key ? 'sel' : ''}" data-node="${n.key}">
          <span class="ni">${n.s === 'done' ? '✓' : n.s === 'run' ? '●' : n.s === 'fail' ? '✕' : '○'}</span>
          <span class="nb"><b>${esc(n.label)}</b><span>${esc(n.note)}</span></span><span class="nt">${esc(n.d)}</span></button>`).join('')}</div>
        <div class="acts"><button class="btn pri" data-act="rerun-node">重跑本节点</button><button class="btn danger" data-act="abort">中止</button></div>
      </div>
    </div>
    <div class="pane">
      <div class="pane-h"><b>实时流 · ${esc(sel.label)}</b><span class="tag c">${sel.s === 'run' ? 'LIVE' : sel.s.toUpperCase()}</span></div>
      <div class="pane-b flush"><div class="stream">${(sel.log || []).map((l, i) => `<div class="sl ${l[1] === 'err' ? 'err' : l[1] === 'ok' ? 'ok' : ''}"><span class="st">${String(9 + Math.floor((31 + i * 2) / 60)).padStart(2, '0')}:${String((31 + i * 2) % 60).padStart(2, '0')}</span><span class="tag ${l[1]}">${esc(l[0])}</span><span>${esc(l[2])}</span></div>`).join('')}<div class="sl"><span class="st">›</span><span class="cr"></span></div></div></div>
    </div>
  </div>`
}

      <span class="status">${sel === 'root' ? '全舱路径' : '只看 ' + esc((TRACE.nodes.find((n) => n.id === sel) || {}).name || '')}</span>
      <span class="right"><button class="mini" data-act="home">← 回任务</button></span>
      <div class="meta"><span>${esc(CABIN.cwd)}</span><span class="sep"></span><span>汐音 → Agent → 工作流</span><span class="sep"></span><span>¥${USAGE.total.toFixed(2)} 本舱</span></div>
    </div>
    <div class="pgrid trace" style="margin-top:14px">
      <div class="pane p1">
        <div class="pane-h"><b>座舱拓扑</b><span class="tag">点击节点过滤</span></div>
        <div class="pane-b" style="padding:4px 6px">${dagHTML(sel)}</div>
      </div>
      <div class="pane p2">
        <div class="pane-h"><b>交互流</b><span class="tag">${evs.length} EVENTS</span></div>
        <div class="pane-b tight">${traceLogHTML(sel)}</div>
      </div>
      <div class="pane p3">
        <div class="pane-h"><b>消耗 · 按主体</b><span class="tag">¥${USAGE.total.toFixed(2)}</span></div>
        <div class="pane-b tight">${usageHTML(sel)}</div>
      </div>
    </div>
  </div>`
}

/* ═══════════════════════ 渲染 ═══════════════════════ */
function render() {
  renderRail()
  const main = $('#main')
  if (state.view === 'trace') { main.innerHTML = renderTraceView(); return }
  if (state.view === 'session') {
    const s = sessionById(state.sessionId) || SESSIONS[0]
    main.innerHTML = renderSession(s)
    main.scrollTop = main.scrollHeight
    return
  }
  const t = taskById(state.taskId) || TASKS[0]
  main.innerHTML = renderTask(t)
  main.scrollTop = 0
}

/* ═══════════════════════ Trace 渲染（与工作舱共用口径） ═══════════════════════ */
function dagHTML(selId) {
  const map = {}
  TRACE.nodes.forEach((n) => { map[n.id] = n })
  const related = new Set(['root'])
  if (selId === 'root') TRACE.nodes.forEach((n) => related.add(n.id))
  else {
    related.add(selId)
    TRACE.edges.forEach((e) => { if (e.a === selId) related.add(e.b); if (e.b === selId) related.add(e.a) })
  }
  const edges = TRACE.edges.map((e) => {
    const a = map[e.a], b = map[e.b]
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2
    const on = selId !== 'root' && (e.a === selId || e.b === selId)
    const dim = selId !== 'root' && !on
    const cls = `edge ${e.kind}${on ? ' on' : ''}${dim ? ' dim' : ''}`
    const d = `M ${x1} ${y1} C ${x1 + 58} ${y1}, ${x2 - 58} ${y2}, ${x2} ${y2}`
    const marker = e.kind === 'dispatch' ? 'ar-d' : 'ar-r'
    return `<path class="${cls}" d="${d}" marker-end="url(#${marker})"><title>${esc(a.name)} → ${esc(b.name)}</title></path>`
  }).join('')
  const nodes = TRACE.nodes.map((n) => {
    const on = selId !== 'root' && n.id === selId
    const dim = selId !== 'root' && !related.has(n.id)
    const cy = n.y + n.h / 2
    const right = n.kind === 'wf'
      ? `<text class="cost" x="${n.x + n.w - 9}" y="${cy + 3}" text-anchor="end">${n.state === 'run' ? '运行中' : n.state === 'fail' ? '阻塞' : '等你'}</text>`
      : `<text class="cost" x="${n.x + n.w - 9}" y="${n.y + 14}" text-anchor="end">¥${n.cost.toFixed(2)}</text>
         <text class="sub" x="${n.x + n.w - 9}" y="${n.y + 26}" text-anchor="end">${esc(n.tok)}</text>`
    return `<g class="node ${n.kind}${on ? ' on' : ''}${dim ? ' dim' : ''}" data-trace="${n.id}" style="cursor:pointer">
      <title>${esc(n.name)} · ${esc(n.sub)}</title>
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8"/>
      <circle class="sdot ${n.state}" cx="${n.x + 10}" cy="${cy}" r="2.4"/>
      <text class="nm" x="${n.x + 18}" y="${n.y + 14}">${esc(n.name)}</text>
      <text class="sub" x="${n.x + 10}" y="${n.y + 26}">${esc(n.sub)}</text>${right}</g>`
  }).join('')
  return `<svg class="dag" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ar-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--violet)"/></marker>
      <marker id="ar-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--cyan)"/></marker>
    </defs>
    ${edges}${nodes}
    <g class="legend">
      <path class="lg" d="M44 22 L64 22" stroke="var(--violet)"/><text x="70" y="25">派发</text>
      <path class="lg" d="M112 22 L132 22" stroke="var(--cyan)" stroke-dasharray="4 4"/><text x="138" y="25">执行</text>
      <text x="192" y="25" class="hint">回执 / 工具在交互流 · 点节点过滤</text>
      <text x="816" y="25" class="hint" text-anchor="end">${selId === 'root' ? '全舱路径' : '只看 ' + esc(map[selId] ? map[selId].name : '')}</text>
    </g>
  </svg>`
}

function traceLogHTML(selId) {
  const node = TRACE.nodes.find((n) => n.id === selId)
  const evs = selId === 'root' ? TRACE_EVENTS : TRACE_EVENTS.filter((e) => e.nodes.includes(selId))
  const filter = selId === 'root' ? '' : `<div class="tfilter">只看 <b>${esc(node.name)}</b><button class="ulink" data-trace="root">全部 ✕</button></div>`
  return filter + (evs.map((e) => {
    const k = TRACE_KIND[e.k] || { label: e.k, cls: '' }
    return `<div class="tev ${k.cls}"><div class="th"><span class="tt">${esc(e.t)}</span><span class="tk2 ${k.cls}">${k.label}</span>
      <span class="tr"><b>${esc(e.from)}</b><i>→</i><b>${esc(e.to)}</b></span></div><div class="ts">${esc(e.s)}</div></div>`
  }).join('') || '<div class="empty">这条链路上还没有消息。</div>')
}

function usageHTML(selId) {
  const node = TRACE.nodes.find((n) => n.id === selId)
  const isEntity = USAGE.rows.some((r) => r.id === selId)
  const head = selId === 'root'
    ? '<div class="usel">全舱 · 7 个主体<span style="margin-left:auto">本窗口 18m</span></div>'
    : `<div class="usel">只看 <b>${esc(node.name)}</b><span>${isEntity ? '¥' + node.cost.toFixed(2) + ' · ' + esc(node.tok) + ' tok' : '成本计入执行它的 Agent'}</span><button class="ulink" data-trace="root">全部 ✕</button></div>`
  const max = Math.max(...USAGE.rows.map((r) => r.cost))
  const rows = USAGE.rows.map((r) => `<div class="urow ${r.id === selId ? 'on' : ''}">
    <span class="un">${esc(r.name)}</span><span class="ub"><i style="width:${Math.round(r.cost / max * 100)}%;background:${r.color}"></i></span>
    <span class="uc">¥${r.cost.toFixed(2)}</span><span class="ut">${esc(r.tok)}</span></div>`).join('')
  const models = USAGE.models.map((m) => `<i style="width:${m.pct}%;background:${m.color}"></i>`).join('')
  const legend = USAGE.models.map((m) => `<span class="l"><i style="background:${m.color}"></i>${esc(m.name)} ${m.pct}%</span>`).join('')
  return `${head}
    <div class="kv">
      <div class="cell"><div class="l">本舱累计</div><div class="v m">¥${USAGE.total.toFixed(2)}</div></div>
      <div class="cell"><div class="l">本窗口 18m</div><div class="v c">¥${USAGE.window.toFixed(2)}</div></div>
      <div class="cell"><div class="l">LLM CALLS</div><div class="v">${USAGE.calls}</div></div>
      <div class="cell"><div class="l">TOKENS IN / OUT</div><div class="v" style="font-size:9px">${USAGE.tokIn} / ${USAGE.tokOut}</div></div>
    </div>
    <div class="uspark">${USAGE.ticks.map((v) => `<i style="height:${Math.round(v / Math.max(...USAGE.ticks) * 100)}%"></i>`).join('')}</div>
    <div class="usl"><span>成本趋势</span><span>近 24m</span></div>
    ${rows}
    <div class="ubar">${models}</div>
    <div class="ulegend">${legend}</div>
    <div class="unote">防双算：chat 行 execution_id IS NULL；子代理 token 走 subagent_runs 单列；成本查询时派生，不与 llm_calls 盲加。</div>`
}

/* ═══════════════════════ 动作 ═══════════════════════ */
function applyAct(act) {
  const t = taskById(state.taskId)
  if (act === 'accept' && t && t.id === 'm2') {
    t.status = '已验收'; t.tone = 'done'; t.summary = '你已通过验收；分身正在归档沉淀，PR 转 ready。'
    t.phases[3] = { t: '验收', s: 'done', d: 'AC 1–4 · 你已通过', when: '刚刚' }
    t.phases[4] = { t: '交付', s: 'now', d: '已转 ready · 等你合并', when: '刚刚' }
    ATTENTION.splice(0, ATTENTION.length, ...ATTENTION.filter((a) => a.taskId !== 'm2'))
    ticker('好，M2 按通过处理。我让 ledger-2 归档沉淀，PR 转 ready。')
    toast('M2 已验收 · PR 转 ready')
  } else if (act === 'reject' && t && t.id === 'm2') {
    t.status = '返工中'; t.tone = 'wait'; t.summary = '已退回：AC-4（大额差异人工复核）补进下一轮，改完再叫你。'
    t.phases[3] = { t: '验收', s: 'warn', d: '已退回 · AC-4 进下一轮', when: '刚刚' }
    ATTENTION.splice(0, ATTENTION.length, ...ATTENTION.filter((a) => a.taskId !== 'm2'))
    ticker('明白，退回改。AC-4 进下一轮，改完再叫你。')
    toast('M2 已退回 · AC-4 进下一轮')
  } else if (act === 'deliver' && t && t.id === 'm2') {
    t.status = '已交付'; t.tone = 'run'; t.summary = 'PR #483 已开成 draft，带上验收单和证据；合并前不动主线。'
    t.phases[4] = { t: '交付', s: 'done', d: 'PR #483 · draft', when: '刚刚' }
    ticker('PR #483 开成 draft，带验收单和证据；你合并前我不动主线。')
    toast('PR #483 · draft')
  } else if (act === 'rerun' && t && t.id === 'm1') {
    t.status = '重跑中'; t.tone = 'run'; t.summary = '已让 gateway-2 拉最新主线重跑；红了再升级给你。'
    t.run.nodes[2] = { ...t.run.nodes[2], s: 'run', note: 'rebase 后重跑中', d: '0m' }
    ATTENTION.splice(0, ATTENTION.length, ...ATTENTION.filter((a) => a.taskId !== 'm1'))
    ticker('好，让 gateway-2 拉最新主线重跑，红了再升级。')
    toast('M1 已重跑')
  } else if (act === 'rollback' && t && t.id === 'm1') {
    t.status = '已回滚'; t.tone = 'done'; t.summary = '已回滚到上一个绿提交，链路恢复；根因我接着查。'
    t.run.nodes[2] = { ...t.run.nodes[2], s: 'wait', note: '已回滚 · 链路恢复', d: '—' }
    ATTENTION.splice(0, ATTENTION.length, ...ATTENTION.filter((a) => a.taskId !== 'm1'))
    ticker('收到，回滚到上一个绿提交；根因我接着查。')
    toast('M1 已回滚')
  } else if (act === 'pause' && t) {
    t.status = '已暂停'; t.tone = 'wait'
    ticker('好，先暂停；上下文和产物都留着。')
    toast('已暂停')
  } else if (act === 'art-pick' && t && t.kind === 'art') {
    t.status = '已选稿'; t.tone = 'done'; t.summary = '已选版；art-1 正在修手部并出 2K 成片。'
    ATTENTION.splice(0, ATTENTION.length, ...ATTENTION.filter((a) => a.taskId !== t.id))
    ticker('收到，就按这版出片；我让 art-1 把手部修完再导出。')
    toast('已选稿 · 出片中')
  } else if (act === 'art-retouch' && t) {
    ticker('好，让 art-1 只修手部，构图不动；修完给你对比。')
    toast('已让 art-1 修手部')
  } else if (act === 'art-export' && t) {
    ticker('成片导出到 ' + t.deliver.folder + '，格式 ' + t.deliver.format + '。')
    toast('已导出 ' + t.deliver.folder)
  } else if (act === 'rerun-node') {
    ticker('好，从当前节点重跑，前序产物保留。')
    toast('已重跑本节点')
  } else if (act === 'abort') {
    ticker('好，先停住，现场保留。')
    toast('已中止')
  }
  render()
}

/* ═══════════════════════ 命令 ═══════════════════════ */
function interpret(text) {
  const v = text.toLowerCase()
  if (/进.*(舱|工作舱)|沉浸/.test(v)) return { act: 'cockpit' }
  if (/回.*(任务|工作台)/.test(v)) return { act: 'home' }
  if (/(trace|链路|交互|日志)/.test(v)) {
    if (state.view === 'task' && taskById(state.taskId).kind === 'dev') return { act: 'lens', lens: 'trace' }
    return { act: 'trace' }
  }
  if (/(通过|验收|可以|收下)/.test(v) && ATTENTION.some((a) => a.taskId === 'm2')) return { act: 'accept' }
  if (/(退回|重做|不行|补一下)/.test(v) && ATTENTION.some((a) => a.taskId === 'm2')) return { act: 'reject' }
  if (/(rebase|再跑|重跑)/.test(v) && ATTENTION.some((a) => a.taskId === 'm1')) return { act: 'rerun' }
  if (/回滚/.test(v) && ATTENTION.some((a) => a.taskId === 'm1')) return { act: 'rollback' }
  const idHit = TASKS.find((t) => v.includes(t.id) || v.includes(t.code.toLowerCase()) || v.includes(t.title))
  const versionHit = v.match(/第\s*([1-9])\s*版/)
  if (versionHit) {
    const t = idHit && idHit.kind === 'art' ? idHit : TASKS.find((x) => x.kind === 'art' && x.id === state.taskId)
    if (t) return { act: 'pick-version', taskId: t.id, v: Number(versionHit[1]) }
  }
  if (idHit) {
    let lens = 'overview'
    if (/版本|选稿/.test(v)) lens = idHit.kind === 'art' ? 'versions' : 'overview'
    else if (/运行|跑到哪/.test(v)) lens = idHit.mode === 'direct' ? 'session' : 'run'
    else if (/变更|diff|文件/.test(v)) lens = 'changes'
    else if (/trace|链路/.test(v)) lens = 'trace'
    else if (/交付/.test(v)) lens = idHit.kind === 'art' ? 'deliver' : 'changes'
    else if (/会话/.test(v)) { const s = SESSIONS.find((x) => x.taskId === idHit.id); if (s) return { act: 'session', id: s.id } }
    return { act: 'task', id: idHit.id, lens }
  }
  if (/(版本|选稿)/.test(v)) {
    const t = taskById(state.taskId)
    if (t && t.kind === 'art') return { act: 'lens', lens: 'versions' }
  }
  if (/(画|插画|图标|海报)/.test(v)) return { act: 'say', msg: '明白，这是绘画任务。我先记下 prompt 和尺寸，出 2 版草图给你挑。' }
  if (/(做|开发|实现|修|任务)/.test(v)) return { act: 'say', msg: '明白，我拆成开发任务；有工作流就走流，没有就直接派分身干。' }
  return { act: 'say', msg: '收到。要我看哪一单，直接说「看 M2」「看 A1 版本」就行。' }
}

function runCommand() {
  const input = $('#cmdInput')
  const v = input.value.trim()
  if (!v) { input.focus(); return }
  input.value = ''
  if (state.view === 'session') {
    const s = sessionById(state.sessionId)
    s.log.push({ from: '指挥官', t: v })
    s.log.push({ from: s.name, t: '收到，我按这个处理；有结果第一时间回你。' })
    render()
    ticker(`${s.name}：收到，我按这个处理。`)
    return
  }
  const hit = interpret(v)
  if (state.view === 'session' && hit.act === 'home') { state.view = 'task'; render(); return }
  if (hit.act === 'cockpit') { toCockpit(); return }
  if (hit.act === 'home') { state.view = 'task'; render(); return }
  if (hit.act === 'trace') { state.view = 'trace'; state.traceSel = 'root'; render(); ticker('好，全舱链路摊开了。'); return }
  if (hit.act === 'task') { setTask(hit.id, hit.lens); ticker(`好，看 ${taskById(hit.id).code} · ${taskById(hit.id).title}。`); return }
  if (hit.act === 'session') { openSession(hit.id); return }
  if (hit.act === 'lens') { state.lens = hit.lens; render(); ticker('好，镜头切过去了。'); return }
  if (hit.act === 'pick-version') {
    state.taskId = hit.taskId; state.view = 'task'; state.lens = 'versions'
    const t = taskById(hit.taskId); const ver = t.versions.find((x) => x.v === hit.v)
    if (ver) { t.versions.forEach((x) => { x.sel = x === ver }); t.status = '已选稿'; t.tone = 'done' }
    ticker(`好，就选第 ${hit.v} 版；我让 art-1 修完手部再出片。`)
    render(); return
  }
  if (hit.act === 'say') { ticker('汐音：' + hit.msg); toast(hit.msg); return }
  applyAct(hit.act)
}

/* ═══════════════════════ 事件 ═══════════════════════ */
document.addEventListener('click', (e) => {
  const attn = e.target.closest('[data-attn]')
  if (attn) {
    const a = ATTENTION.find((x) => x.id === attn.dataset.attn)
    if (a) { setTask(a.taskId, a.lens); ticker(`汐音：${a.t}，我把要看的摊开了。`) }
    return
  }
  const task = e.target.closest('[data-task]')
  if (task) { setTask(task.dataset.task, task.dataset.lens || undefined); return }
  const sess = e.target.closest('[data-session]')
  if (sess) { openSession(sess.dataset.session); return }
  const kind = e.target.closest('[data-kind]')
  if (kind) {
    state.kind = kind.dataset.kind
    document.querySelectorAll('#kindChips .fchip').forEach((b) => b.classList.toggle('on', b === kind))
    renderRail(); return
  }
  const lens = e.target.closest('[data-lens]')
  if (lens) { state.lens = lens.dataset.lens; state.view = 'task'; render(); return }
  const file = e.target.closest('[data-file]')
  if (file) { state.checkFile = file.dataset.file; render(); return }
  const ver = e.target.closest('[data-version]')
  if (ver) {
    const t = taskById(state.taskId)
    if (t && t.kind === 'art') { t.versions.forEach((x) => { x.sel = x.v === Number(ver.dataset.version) }); render(); }
    return
  }
  const tr = e.target.closest('[data-trace]')
  if (tr) { state.traceSel = tr.dataset.trace; state.view = 'trace'; render(); return }
  const cockpit = e.target.closest('[data-cockpit]')
  if (cockpit) { toCockpit(); return }
  const node = e.target.closest('[data-node]')
  if (node) { state.node = node.dataset.node; render(); return }
  const act = e.target.closest('[data-act]')
  if (!act) return
  const a = act.dataset.act
  if (a === 'open-session') {
    const t = taskById(state.taskId)
    if (t && t.session) openSession(t.session)
    return
  }
  if (a === 'home') { state.view = 'task'; render(); return }
  applyAct(a)
})

$('#btnSend').addEventListener('click', runCommand)
$('#cmdInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runCommand() } })
document.querySelectorAll('#quickChips .qchip').forEach((b) => b.addEventListener('click', () => { $('#cmdInput').value = b.dataset.cmd; runCommand() }))
$('#btnCockpit').addEventListener('click', toCockpit)
$('#btnTrace').addEventListener('click', () => {
  if (state.view === 'trace') { state.view = 'task'; render(); return }
  state.view = 'trace'; state.traceSel = 'root'; render(); ticker('好，全舱链路摊开了。')
})
$('#btnNew').addEventListener('click', () => { $('#cmdInput').focus(); ticker('说说要做什么——绘画还是开发，我负责拆和派。'); toast('说一句就行：画一张… / 做个…') })
document.addEventListener('keydown', (e) => {
  if (e.key === 'k' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#cmdInput').focus() }
  if (e.key === 'Escape') { state.view = 'task'; render() }
})

/* ═══════════════════════ boot ═══════════════════════ */
readHash()
if (state.view === 'task' && !lensesOf(taskById(state.taskId)).some(([k]) => k === state.lens)) state.lens = 'overview'
render()
$('#cwdPath').textContent = CABIN.cwd
setTimeout(() => ticker('M2 等你验收；A1 出了 4 版，也等你选稿。'), 800)
</script>
