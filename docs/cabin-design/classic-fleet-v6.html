<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Octopus · 作战舱 · 编队 v6 —— 编队看任务/会话 · inbox 独立悬浮 · 待你定挂件不变</title>
<style>
/* ── 净黑终端 TUI · pop 色板（verbatim classic-v5） ── */
:root{
  --pop-bg:#0A0A0C; --pop-paper:#1C1C22; --pop-ink:#F5F5F2; --pop-dim:#9698A3; --pop-bd:#32323B;
  --pop-pink:#FF855C; --pop-pink-soft:#2A1B19;
  --pop-yellow:#FFC857; --pop-yellow-soft:#231E17;
  --pop-purple:#D2A8FF; --pop-purple-soft:#221E29;
  --pop-violet:#A78BFA; --pop-violet-soft:#201C2D;
  --pop-green:#7EE787; --pop-green-soft:#18211A;
  --pop-amber:#FFC857; --pop-amber-soft:#231E17;
  --pop-cyan:#4FD1D9; --pop-cyan-soft:#151F21;
  --pop-red:#FF5C5C;
  --pop-navy:#4C79BF; --pop-navy-soft:#181F2D;
  --pop-idle:#131318; --pop-inset:#020202;
  --pop-bdw:1.5px;
  --shadow-pop-lg:0 10px 32px rgba(0,0,0,.5);
  --font-mono:'SF Mono','JetBrains Mono',Menlo,Consolas,ui-monospace,monospace;
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --w8:rgba(255,255,255,.08); --w6:rgba(255,255,255,.06); --w7:rgba(255,255,255,.07); --w10:rgba(255,255,255,.10); --w12:rgba(255,255,255,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--pop-bg);color:var(--pop-ink);font-family:var(--font-mono);font-size:12.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
::selection{background:var(--pop-pink-soft)}
:focus-visible{outline:2px solid rgba(255,200,87,.55);outline-offset:2px;border-radius:6px}
html,html *{scrollbar-width:thin;scrollbar-color:#46464E transparent}
html::-webkit-scrollbar,html *::-webkit-scrollbar{width:9px;height:9px}
html::-webkit-scrollbar-track{background:transparent}
html::-webkit-scrollbar-thumb{background:#46464E;border-radius:5px;border:2px solid transparent;background-clip:content-box}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── shell ── */
.shell{display:flex;flex-direction:column;height:100vh}
.hdr{height:32px;flex:none;display:flex;align-items:center;gap:4px;border-bottom:var(--pop-bdw) solid var(--pop-bd);background:var(--pop-paper);padding:0 6px;z-index:50}
.hdr-brand{display:flex;align-items:center;gap:7px;padding:0 8px;font-weight:700;font-size:12px;color:var(--pop-ink)}
.hdr-brand .mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--pop-pink),var(--pop-violet));display:grid;place-items:center;font-size:11px}
.hdr-brand .ver{font-family:var(--font-mono);font-size:9px;font-weight:500;color:var(--pop-dim);border:1px solid var(--w10);border-radius:999px;padding:1px 7px;margin-left:2px}
.hdr-btn{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:7px;color:var(--pop-dim);font-size:11px}
.hdr-btn:hover{background:var(--w7);color:var(--pop-ink)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.run-agents{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:7px;font-size:10.5px;color:var(--pop-green)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:9px}
.eq i{width:2px;height:8px;background:currentColor;border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.body{display:flex;flex:1;min-height:0}

/* ── sidebar ── */
.sidebar{width:236px;flex:none;display:flex;flex-direction:column;background:var(--pop-idle);border-right:1px solid var(--w6);min-height:0}
.sb-top{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px}
.sb-new{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:28px;border-radius:8px;background:rgba(255,255,255,.09);font-size:12px;font-weight:500;color:var(--pop-ink)}
.sb-new:hover{background:rgba(255,255,255,.14)}
.sb-ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--pop-dim)}
.sb-ico:hover{background:var(--w6);color:var(--pop-ink)}
.sb-search{padding:0 10px 8px;position:relative}
.sb-search input{width:100%;height:30px;border-radius:8px;border:1px solid var(--w8);background:rgba(255,255,255,.04);padding:0 10px 0 30px;font-size:12.5px;color:var(--pop-ink);outline:none;font-family:var(--font-ui)}
.sb-search .si{position:absolute;left:20px;top:8px;color:rgba(150,152,163,.7);font-size:12px}
.sb-list{flex:1;overflow-y:auto;min-height:0;padding:0 10px 16px}
.sec-label{display:flex;align-items:center;height:28px;padding:12px 8px 0;font-size:11px;color:rgba(150,152,163,.8)}
.sec-label span{margin-left:6px;font-size:10.5px;color:rgba(150,152,163,.45)}
.srow{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;border-radius:7px;padding:4px 8px;text-align:left;font-size:13px;color:rgba(245,245,242,.8);font-family:var(--font-ui);margin-bottom:1px}
.srow:hover{background:rgba(255,255,255,.035);color:var(--pop-ink)}
.srow.active{background:var(--w7);color:var(--pop-ink)}
.srow .k{width:16px;flex:none;text-align:center;color:rgba(150,152,163,.7);font-size:11px}
.srow .mid{flex:1;min-width:0}
.srow .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sub{display:block;font-size:9.5px;font-family:var(--font-mono);color:rgba(150,152,163,.6);margin-top:1px}
.srow .sub.amber{color:var(--pop-amber)}
.srow .sub.violet{color:var(--pop-violet)}
.srow .sub.red{color:var(--pop-red)}
.srow .sub.green{color:var(--pop-green)}
.srow .sub.dim2{color:rgba(150,152,163,.55)}
.srow .dt{flex:none;font-size:10.5px;color:rgba(150,152,163,.5)}
.sdot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--pop-dim)}
.sdot.amber{background:var(--pop-amber);box-shadow:0 0 6px rgba(255,200,87,.5)}
.sdot.green{background:var(--pop-green)}
.sdot.violet{background:var(--pop-violet)}
.sdot.red{background:var(--pop-red)}
.sdot.gray{background:rgba(150,152,163,.45)}
.sdot.done{background:var(--pop-green)}
.srow .sub.done{color:rgba(126,231,135,.8)}

/* ── chat ── */
.chat{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:
  radial-gradient(720px 320px at 78% 0%, rgba(167,139,250,.06), transparent 70%),
  radial-gradient(560px 280px at 40% 100%, rgba(79,209,217,.04), transparent 70%),
  var(--pop-bg)}
.thread{flex:1;min-height:0;display:flex;flex-direction:column}
.transcript{flex:1;overflow-y:auto;min-height:0}
.tui-col{max-width:860px;margin:0 auto;padding:18px 24px 8px;display:flex;flex-direction:column;gap:12px;font-size:12.5px;line-height:1.65}
.tmsg{display:flex;gap:10px;align-items:flex-start}
.tmsg .who{width:56px;flex:none;text-align:right;font-family:var(--font-mono);font-size:9.5px;color:var(--pop-dim);margin-top:3px}
.tmsg.xy .who{color:var(--pop-violet)}
.tmsg.author .who{color:var(--pop-purple)}
.tmsg.me .who{color:var(--pop-green)}
.tmsg .bub{border:1px solid var(--w7);background:rgba(255,255,255,.03);border-radius:10px;padding:7px 11px;max-width:76%;font-family:var(--font-ui);color:rgba(245,245,242,.9)}
.tmsg.me .bub{background:rgba(255,255,255,.06)}
.tmsg .bub b{color:var(--pop-violet);font-weight:600}
.tmsg .bub .role{display:inline-block;font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.05em;border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:13px;margin-right:6px;color:var(--pop-purple)}

/* ── 待你定挂件（原样保留：贴 composer 上沿，同宽同起止） ── */
.composer-wrap{width:calc(100% - 48px);max-width:860px;margin:0 auto 14px;flex:none}
.askdock{position:relative;border:1px solid var(--pop-bd);border-bottom:0;border-radius:9px 9px 0 0;background:rgba(28,28,34,.95);padding:4px 10px 6px;margin-bottom:-1px;font-size:11px;font-family:var(--font-ui)}
.askdock-line{display:flex;align-items:center;gap:8px;min-width:0}
.askdock .g{width:6px;height:6px;border-radius:50%;background:var(--pop-amber);flex:none}
.askdock .cnt{flex:none;font-family:var(--font-mono);font-size:10px;font-weight:700;line-height:1;color:var(--pop-amber)}
.askdock .h{flex:none;font-family:var(--font-mono);font-size:10px;font-weight:700;line-height:1;color:var(--pop-amber)}
.askdock .t{flex:none;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--pop-ink)}
.askdock .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--pop-dim)}
.askdock .go{flex:none;font-size:10px;font-weight:700;color:var(--pop-cyan)}
.askdock .more{flex:none;border:1px solid rgba(255,200,87,.3);border-radius:999px;background:none;padding:2px 7px;font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:var(--pop-amber)}
.askdock .more:hover{background:var(--pop-amber-soft)}
.askdock-list{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid rgba(50,50,59,.6);padding-bottom:4px;margin-bottom:4px}
.askdock-row{display:flex;align-items:center;gap:8px;width:100%;padding:4px 6px;border-radius:5px;border:0;background:none;text-align:left;font-size:11.5px;color:var(--pop-dim)}
.askdock-row:hover{background:rgba(255,255,255,.05)}
.askdock-row.on{background:rgba(255,200,87,.15);box-shadow:inset 2px 0 0 var(--pop-amber)}
.askdock-row .h{flex:none;width:24px;font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--pop-amber)}
.askdock-row .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.askdock-row .st{flex:none;font-size:9.5px;font-weight:700;color:var(--pop-dim)}
.askdock-row.on .st{color:var(--pop-cyan)}
.input-block{display:flex;align-items:flex-end;gap:8px;border:1.5px solid var(--pop-bd);border-radius:10px;background:rgba(28,28,34,.95);padding:8px 8px 8px 12px}
.input-block textarea{flex:1;min-height:24px;max-height:120px;border:0;background:none;outline:none;resize:none;font-size:12.5px;color:var(--pop-ink);font-family:var(--font-ui);line-height:1.5;padding:2px 0}
.input-block textarea::placeholder{color:rgba(150,152,163,.6)}
.send{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(255,200,87,.16);color:var(--pop-amber);border:1px solid rgba(255,200,87,.35);flex:none;font-size:14px}

/* ── inbox：编队上方独立悬浮；点开在图标左边出列表 ── */
.inboxwrap{position:absolute;top:52px;right:84px;width:192px;z-index:26}
.inboxchip{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border-radius:12px;border:1px solid rgba(255,200,87,.32);background:color-mix(in srgb,var(--pop-paper) 84%,transparent);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:left;transition:background .15s,border-color .15s}
.inboxchip:hover{background:rgba(255,200,87,.09)}
.inboxchip.on{background:rgba(255,200,87,.14);border-color:rgba(255,200,87,.6);box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 0 1px rgba(255,200,87,.18) inset}
.inboxchip .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;background:rgba(255,200,87,.14);color:var(--pop-amber);font-size:12px}
.inboxchip .mid{flex:1;min-width:0}
.inboxchip .t{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--pop-ink);letter-spacing:.02em}
.inboxchip .dot{width:5px;height:5px;border-radius:50%;background:var(--pop-amber);box-shadow:0 0 6px var(--pop-amber);animation:pulse 1.6s infinite}
.inboxchip .brk{display:flex;align-items:center;gap:4px;margin-top:2px;font-family:var(--font-mono);font-size:8.5px;white-space:nowrap;overflow:hidden}
.inboxchip .bq{display:inline-flex;align-items:center;gap:3px;color:rgba(245,245,242,.75)}
.inboxchip .bq i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.inboxchip .bq.ask{color:var(--pop-amber)}
.inboxchip .bq.review{color:var(--pop-violet)}
.inboxchip .bq.blocked{color:var(--pop-red)}
.inboxchip .bq.off{opacity:.38}
.inboxchip .bq.none{color:rgba(150,152,163,.6)}
.inboxchip .n{flex:none;min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;font-weight:800;color:var(--pop-bg);background:var(--pop-amber)}
.inboxchip.zero{border-color:var(--w10)}
.inboxchip.zero .ic{background:var(--w8);color:var(--pop-dim)}
.inboxchip.zero .n{background:var(--w10);color:var(--pop-dim)}
.inboxchip.zero .brk{color:rgba(150,152,163,.55)}
.inboxchip.zero .dot{display:none}
/* 左侧悬浮列表（不跟窗口抢位；和 chip 用箭头连着） */
.inboxpop{position:absolute;top:0;right:200px;width:380px;max-height:70vh;display:none;flex-direction:column;border:1px solid var(--w12);border-radius:12px;background:rgba(24,24,30,.985);backdrop-filter:blur(14px);box-shadow:0 18px 48px rgba(0,0,0,.55);overflow:hidden;z-index:1}
.inboxpop.on{display:flex;animation:popIn .14s ease}
@keyframes popIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.inboxpop::after{content:"";position:absolute;right:-5px;top:20px;width:9px;height:9px;background:rgba(24,24,30,.985);border-right:1px solid var(--w12);border-top:1px solid var(--w12);transform:rotate(45deg)}
.ip-h{display:flex;align-items:center;gap:7px;flex:none;padding:9px 11px 8px;border-bottom:1px solid var(--w6)}
.ip-h .t{font-family:var(--font-mono);font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--pop-amber)}
.ip-h b{font-family:var(--font-mono);font-size:10px;color:var(--pop-ink)}
.ip-h .brk{flex:1;min-width:0;text-align:right;font-family:var(--font-mono);font-size:8.5px;color:rgba(150,152,163,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip-body{overflow-y:auto;padding:5px 6px 7px}
.ip-group{display:flex;align-items:center;justify-content:space-between;padding:5px 6px 3px;font-family:var(--font-mono);font-size:8.5px;font-weight:800;letter-spacing:.12em;color:var(--pop-dim)}
.ip-group b{font-size:8.5px;font-weight:800;color:rgba(150,152,163,.55)}
.ip-group.ask{color:var(--pop-amber)}
.ip-group.review{color:var(--pop-violet)}
.ip-group.blocked{color:var(--pop-red)}
.ip-row{display:flex;flex-direction:column;gap:2px;width:100%;padding:6px 7px;border-radius:7px;text-align:left}
.ip-row:hover{background:rgba(255,255,255,.05)}
.ip-row .r1{display:flex;align-items:center;gap:6px;min-width:0}
.ip-type{flex:none;font-family:var(--font-mono);font-size:8px;font-weight:800;letter-spacing:.04em;border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:13px}
.ip-type.ask{color:var(--pop-amber)}
.ip-type.start{color:var(--pop-cyan)}
.ip-type.review{color:var(--pop-violet)}
.ip-type.blocked{color:var(--pop-red)}
.ip-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600;font-family:var(--font-ui);color:rgba(245,245,242,.92)}
.ip-go{flex:none;font-family:var(--font-ui);font-size:9.5px;font-weight:700;color:var(--pop-cyan)}
.ip-q{padding-left:2px;font-size:10.5px;line-height:1.45;color:var(--pop-dim);font-family:var(--font-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ip-foot{flex:none;padding:6px 11px 7px;border-top:1px solid var(--w6);font-family:var(--font-mono);font-size:8.5px;color:rgba(150,152,163,.55)}
.ip-empty{display:flex;flex-direction:column;align-items:center;gap:5px;padding:26px 0 22px;font-family:var(--font-ui);font-size:11px;color:rgba(150,152,163,.7)}
.ip-empty b{font-size:18px;line-height:1;color:var(--pop-green);font-weight:700}

/* ── 编队（inbox 下方）：只放任务 / 会话 ── */
.fleet{position:absolute;top:112px;right:84px;z-index:24;width:192px;max-height:calc(100% - 252px);display:flex;flex-direction:column;border:1px solid var(--w10);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--pop-paper) 82%,transparent);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.32)}
.fleet-h{display:flex;align-items:center;justify-content:space-between;flex:none;padding:8px 10px 7px;border-bottom:1px solid var(--w6);font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--pop-dim)}
.fleet-h .lh{display:flex;align-items:center;gap:5px}
.fleet-h .live{width:5px;height:5px;border-radius:50%;background:var(--pop-green);box-shadow:0 0 6px var(--pop-green);animation:pulse 1.6s infinite}
.fleet-h b{font-family:var(--font-mono);font-size:10px;color:var(--pop-ink)}
.fleet-list{overflow-y:auto;padding:4px}
.fgh{display:flex;align-items:center;justify-content:space-between;padding:5px 7px 3px;font-family:var(--font-mono);font-size:8.5px;font-weight:800;letter-spacing:.12em;color:rgba(150,152,163,.7)}
.fgh b{font-size:8.5px;font-weight:800;color:rgba(150,152,163,.55)}
.fgh:first-child{padding-top:2px}
.frow{display:grid;grid-template-columns:16px minmax(0,1fr);gap:2px 7px;align-items:center;width:100%;padding:6px 7px;border-radius:8px;text-align:left;color:var(--pop-dim);transition:background .15s,box-shadow .15s}
.frow:hover{background:var(--w6);box-shadow:inset 2px 0 0 rgba(79,209,217,.55)}
.frow.session:hover{box-shadow:inset 2px 0 0 rgba(167,139,250,.55)}
.frow .k{grid-row:1 / span 2;display:grid;place-items:center;line-height:1;font-size:13px;color:var(--pop-cyan)}
.frow.session .k{color:var(--pop-violet)}
.frow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;line-height:1.3;color:rgba(245,245,242,.92);font-family:var(--font-ui)}
.frow .s{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9px;color:var(--pop-dim)}
.frow .d{width:5px;height:5px;border-radius:50%;flex:none;background:var(--pop-dim)}
.frow.wait .d{background:var(--pop-amber);animation:pulse 1.5s infinite}
.frow.review .d{background:var(--pop-violet)}
.frow.stopped .d{background:rgba(150,152,163,.5)}
.frow.run .d{background:var(--pop-green);box-shadow:0 0 6px var(--pop-green)}
.frow.done .d{background:var(--pop-green)}
.frow.wait .s{color:var(--pop-amber)}
.frow.review .s{color:var(--pop-violet)}
.frow.stopped .s{color:rgba(150,152,163,.6)}
.frow.run .s{color:var(--pop-green)}
.frow.done .s{color:rgba(126,231,135,.85)}
.frow .bar{grid-column:1 / -1;height:2px;margin-top:3px;border-radius:1px;background:var(--w8);overflow:hidden}
.frow .bar i{display:block;height:100%;background:currentColor;opacity:.6}
.frow.wait .bar i{background:var(--pop-amber)}
.frow.review .bar i{background:var(--pop-violet)}
.frow.stopped .bar i{background:rgba(150,152,163,.55)}
.frow.run .bar i{background:var(--pop-green)}
.frow.done .bar i{background:var(--pop-green);opacity:.45}
.fleet-foot{flex:none;padding:6px 10px;border-top:1px solid var(--w6);font-size:9px;font-family:var(--font-mono);color:rgba(150,152,163,.55);line-height:1.5}

const $ = (s, r=document) => r.querySelector(s);

const taskOf = (id) => TASKS.find((t) => t.id === id);
const sessOf = (id) => SESSIONS.find((s) => s.id === id);
const askOf = (id) => ASKS.find((a) => a.id === id);
const openAsks = () => ASKS.filter((a) => !a.answered);

function todoList() {
  const out = [];
  for (const a of openAsks()) out.push({ id:a.id, type:'ask', taskId:a.taskId, title:a.question });
  if (!START.done) out.push({ id:START.id, type:'start', taskId:START.taskId, title:START.detail });
  if (!REVIEW.done) out.push({ id:REVIEW.id, type:'review', taskId:REVIEW.taskId, title:REVIEW.title });
  if (!BLOCKED.done) out.push({ id:BLOCKED.id, type:'blocked', taskId:BLOCKED.taskId, title:BLOCKED.title });
  return out;
}
function todoCounts() {
  const list = todoList();
  return {
    total:list.length,
    ask:list.filter((t) => t.type === 'ask' || t.type === 'start').length,
    review:list.filter((t) => t.type === 'review').length,
    blocked:list.filter((t) => t.type === 'blocked').length,
  };
}
function statusText(s) { return TSTATUS[s] || s; }
function taskStatusFull(t) {
  if (t.enqueued) return '待触发';
  if (t.start) return '待放行';
  if (t.status === 'run' || t.status === 'wait' || t.status === 'stopped') return statusText(t.status) + ' · ' + t.pct + '%';
  return statusText(t.status);
}
function toneOf(t) {
  if (t.status === 'wait') return 'wait';
  if (t.status === 'review') return 'review';
  if (t.status === 'stopped') return 'stopped';
  if (t.status === 'done') return 'done';
  return 'run';
}
const STATUS_ORDER = { wait:0, review:1, run:2, done:3, stopped:4 };
const sortedTasks = () => [...TASKS].sort((a, b) => (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9));

  state.win = null;
  state.fromInbox = false;

  el.innerHTML = '';

/* 待办窗处理完：如果这条是从 inbox 里点进来的，自动回到 inbox 列表，接着处理下一条 */
function completeTodoWindow(kind, id, ms) {
  setTimeout(() => {
    if (state.win?.kind === kind && state.win.id === id) {
      const back = state.fromInbox;
      closeWin();
      if (back && todoCounts().total > 0) {
        state.inboxOpen = true;
        renderInbox();
      }
    }
  }, ms);
}
function renderWin() {
  const el = $('#win');
  if (!state.win) { closeWin(); return; }
  const { kind, id } = state.win;
  if (kind === 'ask') renderAsk(el, askOf(id));
  else if (kind === 'start') renderStart(el);
  else if (kind === 'instr') renderInstr(el, id === REVIEW.id ? REVIEW : BLOCKED);
  else if (kind === 'task') renderTaskDetail(el, taskOf(id));
  else if (kind === 'sess') renderSessDetail(el, sessOf(id));
  el.classList.add('on');
  placeWin(el);
}
function placeWin(el) {
  const chat = $('#chat').getBoundingClientRect();
  const rail = $('#inboxwrap').getBoundingClientRect();
  const width = el.offsetWidth || 520;
  let left = rail.width ? rail.left - chat.left - width - 10 : chat.width - width - 84;
  el.style.left = Math.max(12, left) + 'px';
  el.style.top = '56px';
  // 宽度按 kind 定（CSS 兜底）
  el.style.width = width + 'px';
}

function renderTaskDetail(el, t) {
  if (!t) { closeWin(); return; }
  el.style.width = '470px';
  const tone = toneOf(t);
  el.classList.remove('is-done');
  el.innerHTML = `
    <div class="win-h">
      <button class="win-x" data-close-win>✕</button>
      <span class="win-glyph task">⌂</span>
      <span class="win-t">${fmt(t.name)}</span>
      <span class="win-tag ${tone}">${taskStatusFull(t)}</span>
      <span class="win-ctx">任务详情</span>
    </div>
    <div class="win-b">
      <div class="caprow"><span>${fmt(t.repo)}</span><span>·</span><span>${t.phase}</span><span>·</span><span>⏱ ${t.clock}</span><span>·</span><span>¥${t.cost}</span></div>
      <div class="bar4 ${tone}"><i style="width:${t.pct}%"></i></div>
      <div class="goal"><b>目标</b>${fmt(t.goal)}</div>
      <div class="sec">这个任务的编队</div>
      <div class="crewlist">${t.crew.map((m) => {
        const role = ROLES[m.role];
        const st = m.status === 'run' ? '运行中' : m.status === 'review' ? '等你验收' : m.status === 'wait' ? '待你定' : '已中止';
        return `<div class="crewmem">
          <span class="role" style="color:${role.color}">${role.label}</span>
          <span class="nm">${fmt(m.name)}</span>
          <span class="st"><i class="d ${m.status}"></i>${st}</span>
        </div>`;
      }).join('')}</div>
      <div class="sec">最近回报 <span class="cap">只读</span></div>
      <div class="tl">${t.events.map(([dt, ac, tx, tone2]) => `
        <div class="tlev ${tone2}">
          <span class="dt">${dt}</span>
          <span class="ac" style="color:${ac === '汐音' ? 'var(--pop-violet)' : ac === '外部' ? 'var(--pop-amber)' : 'var(--pop-cyan)'}">${fmt(ac)}</span>
          <span class="tx">${fmt(tx)}</span>
        </div>`).join('')}</div>
      <div class="note">详情只读：这里看它是什么、谁在干、做到哪。要给它指示，去编队上方的 inbox；要进对话，用下方按钮。</div>
    </div>
    <div class="win-foot">
      <span class="cap">点行 = 详情</span><span class="sp"></span>
      <button class="pri" data-enter-task="${t.id}">进入任务线程 →</button>
      <button data-close-win>关闭</button>
    </div>`;
}
function renderSessDetail(el, s) {
  if (!s) { closeWin(); return; }
  el.style.width = '470px';
  el.classList.remove('is-done');
  el.innerHTML = `
    <div class="win-h">
      <button class="win-x" data-close-win>✕</button>
      <span class="win-glyph sess">◈</span>
      <span class="win-t">${fmt(s.name)}</span>
      <span class="win-tag sess">${s.status === 'active' ? '进行中' : '已中止'}</span>
      <span class="win-ctx">会话详情</span>
    </div>
    <div class="win-b">
      <div class="meta-grid">
        <span class="l">舱</span><span class="v">${fmt(s.cabin)}</span>
        <span class="l">模型</span><span class="v">${fmt(s.model)}</span>
        <span class="l">消息</span><span class="v">${s.messages} 条</span>
        <span class="l">开始</span><span class="v">${fmt(s.started)}</span>
        <span class="l">最近</span><span class="v">${fmt(s.last)}</span>
      </div>
      <div class="sec">最近两条 <span class="cap">只读</span></div>
      <div class="snip">${s.excerpt.map(([who, text]) => `<div class="m"><span>${fmt(who)}</span><div>${fmt(text)}</div></div>`).join('')}</div>
      <div class="note">详情只读：这里只回答「这个会话是什么」。要接着聊，用下方按钮打开会话。</div>
    </div>
    <div class="win-foot">
      <span class="cap">点行 = 详情</span><span class="sp"></span>
      <button class="pri" data-open-session="${s.id}">打开会话 →</button>
      <button data-close-win>关闭</button>
    </div>`;
}

/* ───────────── 处理 ───────────── */
function answerAsk(askId, label) {
  const ask = askOf(askId);
  if (!ask || ask.answered) return;
  ask.answered = label;
  const t = taskOf(ask.taskId);
  // t1 没有别的待办 → 转运行中；t3 还有验收 → 保持等你验收
  const others = todoList().filter((x) => x.taskId === ask.taskId);
  if (!others.length) t.status = 'run';
  toast('已答 · ' + label + ' · 从「要我处理」消项');
  renderAll();
  completeTodoWindow('ask', askId, 1500);
}
function submitFree(ask) {
  const input = $('.freeinput');
  const val = input?.value.trim();
  if (!val) { input?.focus(); return; }
  answerAsk(ask.id, val);
}
function markInstr(item, label) {
  if (!item || item.done) return;
  item.done = true;
  item.answered = label;
  const t = taskOf(item.taskId);
  if (item.type === 'review') t.status = 'done';
  else t.status = 'run';
  toast('已给指示 · 从「要我处理」消项');
  renderAll();
  completeTodoWindow('instr', item.id, 1400);
}
function submitInstr(item) {
  const input = $('.freeinput');
  const val = input?.value.trim();
  if (!val) { input?.focus(); return; }
  markInstr(item, val);
}
/* 放行：选完直接执行，不跳任务线程 */
function executeStart() {
  if (START.done) return;
  START.done = true;
  const opt = START.options.find((o) => o.id === START.choice) || START.options[0];
  START.answered = opt.label;
  const t = taskOf(START.taskId);
  t.start = false;
  if (START.choice === 'enqueue') { t.enqueued = true; t.phase = 'P1 · 待触发'; }
  else { t.status = 'run'; t.pct = 8; }
  toast('已放行 · ' + opt.label + ' · 从「要我处理」消项');
  renderAll();
  completeTodoWindow('start', START.id, 1500);
}
function ignoreAsk(id) {
  const ask = askOf(id);
  if (!ask) return;
  ask.answered = '已忽略 · 按现状继续';
  const t = taskOf(ask.taskId);
  const others = todoList().filter((x) => x.taskId === ask.taskId);
  if (!others.length) t.status = 'run';
  const back = state.fromInbox;
  closeWin();
  renderAll();
  toast('已忽略这条 · 按现状继续');
  if (back && todoCounts().total > 0) { state.inboxOpen = true; renderInbox(); }
}

/* ───────────── 总渲染 ───────────── */
function renderAll() {
  renderSidebar();
  renderInbox();
  renderFleet();
  renderDock();
  if (state.win) renderWin(); else closeWin();
}

/* ───────────── 接线 ───────────── */
document.addEventListener('click', (e) => {
  const chip = e.target.closest('[data-toggle-inbox]');
  if (chip) {
    state.inboxOpen = !state.inboxOpen;
    if (state.inboxOpen) closeWin();
    renderInbox();
    return;
  }

  const todo = e.target.closest('[data-todo]');
  if (todo) {
    const item = todoList().find((x) => x.id === todo.dataset.todo);
    if (!item) return;
    state.fromInbox = true;
    if (item.type === 'ask') openWin('ask', item.id);
    else if (item.type === 'start') openWin('start', item.id);
    else openWin('instr', item.id);
    return;
  }

  const askBtn = e.target.closest('[data-open-ask]');
  if (askBtn) { state.fromInbox = false; openWin('ask', askBtn.dataset.openAsk); return; }

  const opt = e.target.closest('[data-opt]');
  if (opt) {
    const ask = state.win?.kind === 'ask' ? askOf(state.win.id) : null;
    if (ask) { ask.selected = Number(opt.dataset.opt); renderWin(); }
    return;
  }
  if (e.target.closest('[data-submit]')) {
    const ask = state.win?.kind === 'ask' ? askOf(state.win.id) : null;
    if (ask && ask.selected !== null) answerAsk(ask.id, ask.options[ask.selected].label);
    return;
  }
  if (e.target.closest('[data-submit-free]')) {
    const ask = state.win?.kind === 'ask' ? askOf(state.win.id) : null;
    if (ask) submitFree(ask);
    return;
  }
  if (e.target.closest('[data-instr-send]')) {
    const item = state.win?.kind === 'instr' ? (state.win.id === REVIEW.id ? REVIEW : BLOCKED) : null;
    if (item) submitInstr(item);
    return;
  }
  const startOpt = e.target.closest('[data-start-opt]');
  if (startOpt) {
    if (state.win?.kind === 'start' && !START.done) {
      START.choice = startOpt.dataset.startOpt;
      renderWin();
    }
    return;
  }
  if (e.target.closest('[data-start-exec]')) {
    if (state.win?.kind === 'start') executeStart();
    return;
  }
  const fill = e.target.closest('[data-fill]');
  if (fill) { const i = $('.freeinput'); if (i) { i.value = fill.dataset.fill; i.focus(); } return; }
  const ign = e.target.closest('[data-ignore]');
  if (ign) { ignoreAsk(ign.dataset.ignore); return; }

  if (e.target.closest('[data-close-win]')) { closeWin(); return; }
  const more = e.target.closest('[data-dock-more]');
  if (more) { state.dockOpen = !state.dockOpen; renderDock(); return; }

  const taskBtn = e.target.closest('[data-task-detail]');
  if (taskBtn) { state.fromInbox = false; openWin('task', taskBtn.dataset.taskDetail); return; }
  const sessBtn = e.target.closest('[data-session-detail]');
  if (sessBtn) { state.fromInbox = false; openWin('sess', sessBtn.dataset.sessionDetail); return; }
  const enter = e.target.closest('[data-enter-task]');
  if (enter) { closeWin(); toast('进入任务线程「' + taskOf(enter.dataset.enterTask).name + '」（原型）'); return; }
  const openSess = e.target.closest('[data-open-session]');
  if (openSess) { closeWin(); toast('打开会话「' + sessOf(openSess.dataset.openSession).name + '」（原型）'); return; }

  // 点空白：收起 inbox 左侧列表（窗口各自有 ✕ / Esc）
  if (state.inboxOpen) {
    if (!e.target.closest('#inboxwrap')) {
      state.inboxOpen = false;
      renderInbox();
    }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') {
    if (state.inboxOpen) { state.inboxOpen = false; renderInbox(); }
    else if (state.win) closeWin();
  }
});

window.addEventListener('resize', () => { if (state.win) placeWin($('#win')); });

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

renderAll();
</script>
</body>
</html>
