<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Octopus · 新建作战舱 v4 — 说一句，她给舱取名</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   新建作战舱 · v4（2026-11-15）
   用户对这一版的要求：
   「首先跟创建任务一样，有一个标准的输入框，也是在中间的。要做的事只有两件：
    选择目录 / 创建工作空间，以及绑定项目（目录原来就有的话，绑定项目会回显；
    绑定项目是关联关系，支持跨多 org）。中间的大输入框是必须说出需求的 —— 舱不用自己
    起名字，说完需求、说完初始化意见之后，它才真正建立它的名字。
    汐音也要像新建任务那样的意外效果，而不是小小一片，太小气了。」

   → 一屏三样东西：**她的登场 / 居中的大输入框 / 输入框里的两颗控件**。
     不填名字；名字由她从你说的话里取，取完给你看，你点头才建。
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --bg:#0A0A0C; --idle:#131318; --paper:#1C1C22; --inset:#020202;
  --ink:#F5F5F2; --dim:#9698A3; --faint:#6B6D78;
  --bd:#32323B; --bd2:#454550; --yellow:#FFC857; --cyan:#4FD1D9; --green:#7EE787;
  --violet:#A78BFA; --amber:#FFC857; --red:#FF5C5C;
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-mono:'SF Mono','JetBrains Mono',Menlo,Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.55;
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--cyan) 30%,transparent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3A3A44;border-radius:4px;border:2px solid transparent;background-clip:content-box}
.mono{font-family:var(--font-mono)}
kbd{border:1px solid var(--bd);border-radius:4px;padding:0 4px;font-size:9.5px;color:var(--dim);
  font-family:var(--font-mono);background:rgba(255,255,255,.04)}

/* ═════════ 壳 ═════════ */
.app{display:flex;height:100vh;overflow:hidden}
.side{flex:none;width:256px;display:flex;flex-direction:column;min-height:0;background:var(--idle);
  border-right:1px solid var(--bd)}
.side-top{flex:none;height:44px;display:flex;align-items:center;gap:6px;padding:0 12px}
.brand{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700}
.brand .mark{width:15px;height:15px;border-radius:5px;
  background:conic-gradient(from 210deg,var(--cyan),var(--yellow),var(--cyan));opacity:.9}
.spacer{flex:1}
.iconbtn{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;color:var(--dim);
  transition:background .14s,color .14s}
.iconbtn:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.iconbtn svg{width:13px;height:13px}
.newchat{flex:none;margin:0 12px 8px;height:28px;display:flex;align-items:center;justify-content:center;gap:6px;
  border-radius:8px;background:rgba(255,255,255,.09);font-size:12px;font-weight:500;position:relative}
.newchat:hover{background:rgba(255,255,255,.14)}
.newchat svg{width:13px;height:13px}
.newchat .chev{position:absolute;right:8px;width:12px;height:12px;color:var(--dim)}
.side-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 10px 16px}
.sec{margin-top:10px}
.seclab{display:flex;align-items:center;gap:5px;height:22px;padding:0 8px;color:var(--faint);
  font-size:10.5px;font-weight:600;letter-spacing:.04em}
.seclab b{font-weight:600;color:var(--dim)}
.seclab .acts{margin-left:auto;display:flex;gap:2px}
.row{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border-radius:7px;
  font-size:12.5px;color:var(--dim);transition:background .12s,color .12s}
.row:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.row .ico{flex:none;width:13px;height:13px;color:color-mix(in srgb,var(--yellow) 80%,transparent)}
.row .dot{flex:none;width:6px;height:6px;border-radius:50%}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .st{flex:none;font-size:9.5px;color:var(--faint)}
.row.draftrow{background:rgba(255,255,255,.07);color:var(--ink)}
.row.draftrow[aria-current="page"]{box-shadow:inset 2px 0 0 var(--cyan)}
.ping{position:relative;flex:none;display:flex;width:6px;height:6px}
.ping i{position:absolute;inset:0;border-radius:50%;background:color-mix(in srgb,var(--cyan) 70%,transparent);
  animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
.ping b{position:relative;width:6px;height:6px;border-radius:50%;background:var(--cyan)}
@keyframes ping{0%{transform:scale(1);opacity:.8}75%,100%{transform:scale(2.4);opacity:0}}
.row .rowx{flex:none;display:grid;place-items:center;width:16px;height:16px;border-radius:4px;
  color:var(--faint);opacity:0;transition:.12s}
.row.draftrow:hover .rowx{opacity:1}
.row .rowx:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.row.cabinrow[aria-current="page"]{background:rgba(255,255,255,.07);color:var(--ink)}

/* ── 右页 ── */
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.phead{flex:none;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-bottom:1px solid var(--bd)}
.tab{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 8px 0 10px;border-radius:8px;
  border:1px solid var(--bd);background:rgba(255,255,255,.05);font-size:12px;font-weight:600}
.tab .tico{width:12px;height:12px;color:var(--yellow)}
.tab .chip{font-size:9.5px;font-weight:600;color:var(--cyan);
  background:color-mix(in srgb,var(--cyan) 12%,transparent);border-radius:4px;padding:1px 5px}
.tab .tx{display:grid;place-items:center;width:18px;height:18px;margin-left:2px;border-radius:4px;color:var(--faint)}
.tab .tx:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.crumb{font-size:10.5px;color:var(--faint);font-family:var(--font-mono)}
.crumb b{color:var(--dim);font-weight:500}

.pbody{flex:1;min-height:0;overflow-y:auto;position:relative;
  background:
    radial-gradient(60% 44% at 50% 0%, rgba(167,139,250,.10), transparent 70%),
    radial-gradient(46% 34% at 50% 100%, rgba(79,209,217,.06), transparent 70%),
    var(--bg)}

/* ═════════ 舞台：立绘 + 一句 + 大输入框 ═════════ */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;padding:22px 24px 30px}
.crew{position:relative;flex:none;width:286px;height:330px;margin-bottom:6px}
.crew::before{content:'';position:absolute;left:50%;top:46%;width:420px;height:420px;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side, rgba(167,139,250,.20), rgba(79,209,217,.07) 58%, transparent 78%);
  filter:blur(18px)}
.crew .aura{position:absolute;left:50%;bottom:-26px;width:360px;height:250px;transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(167,139,250,.30), rgba(79,209,217,.10) 55%, transparent 76%);
  filter:blur(14px);pointer-events:none}
.crew img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 6%;
  mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(ellipse 60% 66% at 50% 42%, #000 50%, rgba(0,0,0,.72) 72%, transparent 90%);
  mask-image:radial-gradient(ellipse 60% 66% at 50% 42%, #000 50%, rgba(0,0,0,.72) 72%, transparent 90%)}
.crew .ring{position:absolute;left:50%;top:52%;width:300px;height:300px;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(167,139,250,.35);opacity:0;pointer-events:none}
.stage.intro .crew img{animation:crewIn .75s cubic-bezier(.16,.84,.3,1) both}
.stage.intro .crew .ring{animation:ringOut 1.35s cubic-bezier(.2,.6,.2,1) .12s}
.stage.intro .crew .aura{animation:auraIn 1.1s ease-out both}
@keyframes crewIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ringOut{0%{opacity:.55;transform:translate(-50%,-50%) scale(.72)}
  70%{opacity:.12}100%{opacity:0;transform:translate(-50%,-50%) scale(1.28)}}
@keyframes auraIn{from{opacity:0}to{opacity:1}}
.crew.nudge img{animation:nudge .5s ease}
@keyframes nudge{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

.sparks{position:absolute;inset:0;pointer-events:none;overflow:visible}
.spark{position:absolute;font-size:11px;color:#D8C7FF;opacity:0;text-shadow:0 0 10px rgba(167,139,250,.8);
  animation:sparkUp 1.5s ease-out forwards}
@keyframes sparkUp{0%{opacity:0;transform:translate(0,0) scale(.6)}
  22%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.05)}}

.bubble{max-width:560px;margin-top:4px;text-align:center;font-size:15.5px;font-weight:700;
  letter-spacing:.005em;min-height:24px}
.bubble.typing::after{content:'';display:inline-block;width:1.5px;height:14px;margin-left:2px;
  vertical-align:-2px;background:var(--violet);animation:caret .9s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
.subline{margin-top:7px;text-align:center;font-size:11.5px;color:var(--dim);max-width:520px;line-height:1.7}

/* 大输入框（跟新建任务一个量级：居中、max-w 760、第二行挂控件） */
.composer{position:relative;width:min(760px,100%);margin-top:20px;border:1.5px solid var(--bd2);
  border-radius:14px;background:rgba(28,28,34,.92);box-shadow:0 20px 48px -26px rgba(0,0,0,.95);
  transition:border-color .18s,box-shadow .18s}
.composer:focus-within{border-color:color-mix(in srgb,var(--violet) 46%,var(--bd2));
  box-shadow:0 22px 54px -26px rgba(0,0,0,.95), 0 0 0 3px color-mix(in srgb,var(--violet) 10%,transparent)}
.composer textarea{display:block;width:100%;min-height:74px;max-height:220px;resize:none;border:0;background:none;
  outline:0;padding:14px 15px 4px;font-size:13.5px;line-height:1.7}
.composer textarea::placeholder{color:var(--faint)}
.composer .crow{display:flex;align-items:center;gap:7px;padding:6px 10px 9px;flex-wrap:wrap}
.attach{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 10px;border-radius:8px;
  border:1px solid var(--bd);background:rgba(255,255,255,.03);font-size:11.5px;color:var(--dim);
  transition:.14s;max-width:260px}
.attach:hover{color:var(--ink);border-color:var(--bd2);background:rgba(255,255,255,.06)}
.attach.on{color:var(--ink);border-color:color-mix(in srgb,var(--yellow) 38%,var(--bd));background:color-mix(in srgb,var(--yellow) 8%,transparent)}
.attach svg{width:12px;height:12px;flex:none}
.attach .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach .n{font-family:var(--font-mono);font-size:10px;color:var(--faint)}
.grow{flex:1}
.hintk{font-size:10px;color:var(--faint);font-family:var(--font-mono)}
.send{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:8px;
  border:1.5px solid var(--bd);background:var(--ink);color:#0A0A0C;font-size:12px;font-weight:800;
  transition:background .14s,opacity .14s,transform .1s}
.send:hover{background:#fff}
.send:active{transform:translateY(1px)}
.send[disabled]{opacity:.4;cursor:not-allowed}
.send kbd{background:rgba(0,0,0,.1);border-color:rgba(0,0,0,.14);color:rgba(10,10,12,.6)}
.foot2{margin:12px 0 0;font-size:10.5px;color:var(--faint);text-align:center}

/* 下拉（挂在输入框上方，跟 composer 的 ＋ 面板同一位置习惯） */
.pop{position:absolute;bottom:calc(100% + 8px);left:0;width:min(392px,100%);z-index:30;
  border:1px solid var(--bd2);border-radius:12px;background:#14141A;
  box-shadow:0 26px 60px -18px rgba(0,0,0,.95);padding:6px;display:none}
.pop.on{display:block}
.pop .ph{display:flex;align-items:center;gap:6px;padding:5px 8px 6px;font-size:10.5px;color:var(--faint)}
.pop .ph .x{margin-left:auto;color:var(--faint);font-size:11px;padding:0 3px}
.pop .it{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border-radius:7px;
  font-size:12px;color:var(--dim)}
.pop .it:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.pop .it .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:11.5px}
.pop .it .tag{flex:none;font-size:9.5px;color:var(--faint);border:1px solid var(--bd);border-radius:4px;padding:0 4px}
.pop .it .ck{margin-left:auto;width:13px;height:13px;border-radius:4px;border:1px solid var(--bd2);position:relative}
.pop .it.on{color:var(--ink)}
.pop .it.on .ck{background:color-mix(in srgb,var(--cyan) 20%,transparent);border-color:color-mix(in srgb,var(--cyan) 62%,transparent)}
.pop .it.on .ck::after{content:'';position:absolute;left:3.5px;top:1px;width:4px;height:7px;
  border:1.5px solid var(--cyan);border-top:0;border-left:0;transform:rotate(42deg)}
.pop .org{padding:7px 8px 3px;font-size:9.5px;letter-spacing:.06em;color:var(--faint);display:flex;gap:6px;align-items:center}
.pop .org .n{color:var(--faint);opacity:.7;font-family:var(--font-mono)}
.pop .list{max-height:248px;overflow-y:auto;overscroll-behavior:contain}
.pop .search{display:flex;align-items:center;gap:6px;margin:2px 4px 4px;padding:0 7px;height:30px;
  border-radius:8px;border:1px solid var(--bd);background:rgba(0,0,0,.32)}
.pop .search:focus-within{border-color:color-mix(in srgb,var(--cyan) 40%,transparent)}
.pop .search svg{width:12px;height:12px;flex:none;color:var(--faint)}
.pop .search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:11.5px}
.pop .search input::placeholder{color:var(--faint)}
.pop .search .clr{flex:none;font-size:10px;color:var(--faint);padding:0 2px}
.pop .search .clr:hover{color:var(--ink)}
.pop .selbar{display:none;flex-wrap:wrap;gap:4px;padding:2px 4px 6px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.pop .selbar.on{display:flex}
.pop .selbar .sc{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 5px 0 7px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--cyan) 32%,var(--bd));background:color-mix(in srgb,var(--cyan) 10%,transparent);
  font-family:var(--font-mono);font-size:10px;color:var(--ink)}
.pop .selbar .sc b{font-weight:400;color:var(--faint);font-size:9px}
.pop .selbar .sc span{cursor:pointer;color:var(--faint)}
.pop .selbar .sc span:hover{color:var(--ink)}
.pop .none{padding:10px 8px;font-size:11px;color:var(--faint)}
/* 目录选择窗：跟系统目录选择同构 —— 上级 / 当前路径 / 根 / 列表 / 选当前 */
.dlg-back{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:24px;
  background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.dlg-back.on{display:grid}
.dlg{width:min(520px,100%);max-height:min(620px,86vh);display:flex;flex-direction:column;
  border:1px solid var(--bd2);border-radius:14px;background:#14141A;box-shadow:0 32px 80px -24px rgba(0,0,0,.95)}
.dlg-h{display:flex;align-items:center;height:44px;padding:0 14px;border-bottom:1px solid var(--bd);
  font-size:12.5px;font-weight:700}
.dlg-x{margin-left:auto;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:var(--faint);font-size:11px}
.dlg-x:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.dlg-path{display:flex;align-items:center;gap:7px;padding:10px 14px 6px}
.dlg-path .up{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:6px;
  border:1px solid var(--bd);color:var(--dim);font-size:12px}
.dlg-path .up:hover{color:var(--ink);border-color:var(--bd2)}
.dlg-path .up[disabled]{opacity:.35;cursor:default}
.dlg-path .pth{flex:1;min-width:0;font-size:11.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-roots{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 8px}
.dlg-roots .rt{height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--bd);font-size:10.5px;color:var(--dim)}
.dlg-roots .rt:hover{color:var(--ink);border-color:var(--bd2)}
.dlg-roots .rt.on{color:var(--bg);background:var(--ink);border-color:var(--ink);font-weight:700}
.dlg-list{flex:1;min-height:120px;overflow-y:auto;margin:0 8px;border:1px solid var(--bd);border-radius:9px;background:rgba(0,0,0,.22)}
.dlg-list .de{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;font-size:12px;color:var(--dim)}
.dlg-list .de:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.dlg-list .de .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-list .de .tag{flex:none;font-size:9.5px;color:var(--yellow);border:1px solid color-mix(in srgb,var(--yellow) 34%,transparent);
  border-radius:4px;padding:0 4px}
.dlg-list .de .go{flex:none;font-size:11px;color:var(--faint)}
.dlg-list .empty{padding:12px 10px;font-size:11px;color:var(--faint)}
.dlg-note{display:none;padding:9px 14px 0;font-size:11px;line-height:1.6;color:var(--amber)}
.dlg-note.on{display:block}
.dlg-f{display:flex;align-items:center;gap:8px;padding:12px 14px 14px}
.dlg-f .ghost{margin-left:auto}

/* 同一目录已有舱：直接在输入框里拦住 */
.conflict{display:none;align-items:flex-start;gap:7px;margin:0 10px 6px;padding:8px 10px;border-radius:8px;
  font-size:11.5px;line-height:1.6;color:var(--amber);
  border:1px solid color-mix(in srgb,var(--amber) 26%,transparent);
  background:color-mix(in srgb,var(--amber) 8%,transparent)}
.conflict.on{display:flex}
.conflict b{color:var(--ink);font-weight:700}

.pop .it mark{background:color-mix(in srgb,var(--yellow) 26%,transparent);color:var(--yellow);border-radius:2px;padding:0 1px}
.pop .sep{height:1px;background:var(--bd);margin:5px 4px}
.pop .manual{display:flex;gap:6px;padding:3px 4px 2px}
.pop .manual input{flex:1;min-width:0;height:28px;border-radius:7px;border:1px solid var(--bd);
  background:rgba(0,0,0,.32);padding:0 8px;font-family:var(--font-mono);font-size:11px;outline:0}
.pop .manual input:focus{border-color:color-mix(in srgb,var(--cyan) 40%,transparent)}
.pop .manual button{height:28px;padding:0 10px;border-radius:7px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.1);color:var(--ink)}
.pop .echo{padding:5px 8px;color:var(--cyan);font-size:10.5px}
.pop .note{padding:6px 8px;color:var(--faint);font-size:10.5px;line-height:1.6}

/* ═════════ 她的提案：名字 + 初始化意见 ═════════ */
.propose{width:min(620px,100%);margin-top:18px;border:1px solid var(--bd2);border-radius:14px;
  background:rgba(28,28,34,.92);padding:14px 15px}
.propose .you{display:flex;gap:8px;font-size:12px;color:var(--dim);line-height:1.7}
.propose .you .q{flex:none;color:var(--faint);font-size:10.5px;padding-top:2px;font-family:var(--font-mono)}
.propose .you .t{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;
  max-height:66px;overflow:hidden}
.propose .hr{height:1px;background:var(--bd);margin:12px 0}
.nameblock{display:flex;align-items:center;gap:9px}
.nameblock .lab{flex:none;font-size:10.5px;color:var(--faint);width:52px}
.nameblock input{flex:none;width:180px;height:34px;padding:0 10px;border-radius:9px;
  border:1.5px solid color-mix(in srgb,var(--yellow) 40%,var(--bd));
  background:color-mix(in srgb,var(--yellow) 7%,transparent);
  font-size:15px;font-weight:800;outline:0;letter-spacing:.01em}
.nameblock input:focus{border-color:var(--yellow)}
.nameblock input:disabled{border-color:var(--bd);background:rgba(255,255,255,.03);color:var(--ink);opacity:.85;cursor:default}
.nameblock .why{flex:1;min-width:0;font-size:10.5px;color:var(--faint);line-height:1.5}

.init{margin-top:12px;display:grid;grid-template-columns:52px 1fr;gap:7px 9px;font-size:11.5px;align-items:start}
.init .k{color:var(--faint);font-size:10.5px;padding-top:2px}
.init .v{color:var(--dim);min-width:0;line-height:1.6}
.init .v b{color:var(--ink);font-weight:600}
.init .v .chips{display:flex;flex-wrap:wrap;gap:5px}
.init .v .chip{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--bd);border-radius:999px;
  padding:1px 7px;color:var(--dim)}
.propose .acts{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
.propose .acts .said{flex:1;min-width:0;font-size:10.5px;color:var(--faint);line-height:1.5}
.ghost{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--bd);
  font-size:11.5px;color:var(--dim);background:rgba(255,255,255,.03)}
.ghost:hover{color:var(--ink);background:rgba(255,255,255,.07)}

/* 完成 */
.donepanel{width:min(620px,100%);margin-top:18px;border:1px solid color-mix(in srgb,var(--green) 26%,var(--bd2));
  border-radius:14px;background:rgba(28,28,34,.92);padding:14px 15px}
.donepanel .dh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.donepanel .ok{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;font-size:11px;
  color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--green) 38%,transparent)}
.donepanel .dh .tag{margin-left:auto;font-size:10px;color:var(--faint);font-weight:400}
.donepanel .dsub{margin-top:8px;font-size:11.5px;color:var(--dim);line-height:1.75}
.donepanel .dsub code{font-family:var(--font-mono);font-size:10.5px;color:color-mix(in srgb,var(--cyan) 85%,white);
  background:color-mix(in srgb,var(--cyan) 10%,transparent);padding:1px 4px;border-radius:4px}
.donepanel .acts{display:flex;align-items:center;gap:9px;margin-top:13px;padding-top:12px;border-top:1px solid var(--bd)}
.donepanel .acts .said{flex:1;font-size:10.5px;color:var(--faint)}

/* 舱内 */
.cabin{width:min(620px,100%);margin-top:16px}
.cabin-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.cabin-head .cn{font-size:14px;font-weight:800}
.cabin-head .chip{font-size:9.5px;padding:1px 6px;border-radius:4px;color:var(--green);
  background:color-mix(in srgb,var(--green) 12%,transparent)}
.chat{display:flex;flex-direction:column;gap:11px}
.msg{display:flex;gap:8px;max-width:88%}
.msg .av{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:8px;
  border:1px solid rgba(167,139,250,.35);background:rgba(167,139,250,.14);color:#C9B4FF;
  font-family:var(--font-mono);font-size:11px;line-height:1}
.msg .bub{padding:9px 11px;border-radius:11px;border:1px solid var(--bd);background:var(--paper);
  font-size:12.5px;line-height:1.7}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:rgba(255,255,255,.09)}
.cabin .composer{margin-top:14px;width:100%}

/* 空态 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:60px 20px;text-align:center}
.empty .eico{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;border:1px solid var(--bd);
  background:rgba(255,255,255,.03);color:var(--dim);margin-bottom:14px}
.empty h2{margin:0;font-size:14px}
.empty p{margin:6px 0 16px;font-size:11.5px;color:var(--dim)}
.empty .btns{display:flex;gap:8px}

.view{display:none}
.view.on{display:block}
.view.hero.on{display:flex;min-height:100%;flex-direction:column}
.pbody.scroll{overflow-y:auto}

@media (max-width:900px){ .side{width:216px} .crumb{display:none} .crew{width:240px;height:280px} }
@media (max-width:640px){
  .side{display:none}
  .stage{padding:16px 14px 24px}
  .crew{width:196px;height:230px}
  .composer .crow{row-gap:6px}
  .hintk{display:none}
  .propose,.donepanel{width:100%}
}
@media (prefers-reduced-motion:reduce){
  .ping i{animation:none;opacity:.35}
  .crew img,.crew .ring,.crew .aura,.spark,.crew.nudge img{animation:none!important}
  .bubble.typing::after{animation:none;opacity:.6}
}
</style>
</head>
<body>
<div class="app">
  <!-- ═════════ 左栏 ═════════ -->

比如：做一个电商后台，长期维护订单、库存和结算对账"></textarea>

<script>
/* ═════════ 数据 ═════════ */
const REMEMBERED = [
  { path: '~/Projects/ai/XzhiF/open-octopus', tag: '上次' },
  { path: '~/Projects/ai/XzhiF/ledger',       tag: '常用' },
  { path: '~/Projects/ai/XzhiF/aurora',       tag: '常用' },
  { path: '~/Documents/lab/notes',            tag: '' },
]
/* 目录 → 已绑项目（真实实现来自 workspace 的 project 关联） */
const ECHO = {
  '~/Projects/ai/XzhiF/open-octopus': ['XzhiF/web-app', 'XzhiF/engine', 'acme/billing'],
  '~/Projects/ai/XzhiF/ledger':       ['XzhiF/ledger', 'XzhiF/engine'],
  '~/Projects/ai/XzhiF/aurora':       ['XzhiF/web-app'],
}
/* 已经是舱的目录：一个目录只能有一个舱 → 选中要拦住，只允许打开已有舱 */
const EXISTING = {
  '~/Projects/ai/XzhiF/open-octopus': '八爪舱',
  '~/Projects/ai/XzhiF/ledger': '账本舱',
}
const PROJECTS = [
  { org: 'XzhiF', name: 'ledger' },
  { org: 'XzhiF', name: 'engine' },
  { org: 'XzhiF', name: 'web-app' },
  { org: 'XzhiF', name: 'docs' },
  { org: 'XzhiF', name: 'design-system' },
  { org: 'XzhiF', name: 'cli' },
  { org: 'XzhiF', name: 'core-pack' },
  { org: 'acme',  name: 'billing' },
  { org: 'acme',  name: 'gateway' },
  { org: 'acme',  name: 'inventory' },
  { org: 'acme',  name: 'identity' },
  { org: 'lab',   name: 'scratch' },
  { org: 'lab',   name: 'prototypes' },
  { org: 'lab',   name: 'benchmarks' },
]
const FACE = {
  greet: './crew/xiyin-thinking.png',
  listen: './crew/xiyin-happy.png',
  think: './crew/xiyin-alert.png',
  done: './crew/xiyin-working.png',
}
const GREET = '开个新舱。说说它要做什么。'

const state = {
  phase: 'compose',          // compose | propose | creating | done | cabin | empty
  dir: null, projects: [], req: '',
  proposed: '', why: '', busy: false, pQuery: '', autoDir: '', browsePath: '~',
  lastCabin: '八爪舱', lastStatus: '就绪',
}

const $ = (id) => document.getElementById(id)
const base = (p) => (p || '').split('/').filter(Boolean).pop() || ''
/** 不选目录时舱自己建一个工作空间：~/.octopus/workspaces/<slug>-MMDD-HHmmss-xxxxxx
 *  与任务目录（task-…）同族；中文名没法做 slug，就用 cabin- 前缀。 */
function makeAutoDir(name) {
  const d = new Date()
  const p = (n) => String(n).padStart(2, '0')
  const stamp = `${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`
  const slug = /^[a-z0-9][a-z0-9-_]*$/i.test(name || '') ? name.toLowerCase() : 'cabin'
  const rand = Math.random().toString(16).slice(2, 8)
  return `~/.octopus/workspaces/${slug}-${stamp}-${rand}`
}
const draftLabel = () => state.proposed || '未命名舱'

/* ═════════ 汐音登场 ═════════ */
function face(kind) { $('face').src = FACE[kind] }
function typeLine(text, done) {
  const el = $('bubble')
  el.classList.add('typing')
  el.textContent = ''
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) {
    el.textContent = text; el.classList.remove('typing'); done?.()
    return
  }
  let i = 0
  const t = setInterval(() => {
    el.textContent = text.slice(0, ++i)
    if (i >= text.length) { clearInterval(t); el.classList.remove('typing'); done?.() }
  }, 26)
}
function sparkle(n = 7) {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return
  const box = $('sparks')
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span')
    s.className = 'spark'
    s.textContent = '✦'
    s.style.left = (20 + Math.random() * 240) + 'px'
    s.style.top = (130 + Math.random() * 150) + 'px'
    s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px')
    s.style.setProperty('--dy', (-50 - Math.random() * 70) + 'px')
    s.style.animationDelay = (i * 45) + 'ms'
    box.appendChild(s)
    setTimeout(() => s.remove(), 2200)
  }
}
function nudge() {
  const c = $('crew')
  c.classList.remove('nudge'); void c.offsetWidth; c.classList.add('nudge')
}

/* ═════════ 渲染 ═════════ */
function render() {
  // 目录 chip：没选就是默认的「新建工作空间」，选了显示目录名
  $('dirTxt').textContent = state.dir ? base(state.dir) : '新建工作空间'
  $('dirChip').classList.toggle('on', !!state.dir)
  $('dirChip').title = state.dir
    ? state.dir
    : `不选目录就在第一次创建时新建一个工作空间${state.autoDir ? '：' + state.autoDir : ''}`

  // 同一目录已有舱 → 拦住，只允许打开它
  const clash = state.dir ? EXISTING[state.dir] : null
  state.clash = clash || ''
  $('conflict').classList.toggle('on', !!clash)
  if (clash) {
    $('conflict').innerHTML = `<span>⚠</span><span>这个目录已经是 <b>「${clash}」</b> 了 —— <b>一个目录只能有一个舱</b>，不能在这里再建一个。</span>`
  }

  // 项目 chip
  const n = state.projects.length
  $('projChip').classList.toggle('on', n > 0)
  $('projTxt').textContent = n === 0 ? '绑定项目'
    : n === 1 ? state.projects[0].split('/')[1]
    : state.projects[0].split('/')[1] + ' +' + (n - 1)
  $('projN').textContent = ''

  // 发送键：需求非空才亮（"必须说出需求"）
  const ready = (state.req.trim().length > 0 || !!clash) && state.phase === 'compose'
  $('sendBtn').disabled = !ready
  $('sendTxt').textContent = state.phase === 'creating' ? '正在落舱…'
    : clash ? `打开「${clash}」` : '开始创建'
  $('draftName').textContent = draftLabel()
  $('cabinCount').textContent = String([...document.querySelectorAll('#cabinRows .row')]
    .filter((r) => r.offsetParent !== null).length)
  $('draftSt').textContent = state.phase === 'propose' || state.phase === 'done' ? '待确认' : '草稿中'
  $('tabName').textContent = state.phase === 'propose' || state.phase === 'done' ? draftLabel() : '新建作战舱'
  if (state.phase === 'propose') {
    $('tabChip').textContent = '待确认'
    $('tabChip').style.color = 'var(--cyan)'
    $('tabChip').style.background = 'color-mix(in srgb, var(--cyan) 12%, transparent)'
  } else if (state.phase === 'compose') {
    $('tabChip').textContent = '草稿'
    $('tabChip').style.color = 'var(--cyan)'
    $('tabChip').style.background = 'color-mix(in srgb, var(--cyan) 12%, transparent)'
  }
}

function renderDirList() {
  $('dirList').innerHTML = ''
  // 默认档：什么都不选 = 新建工作空间（第一次创建时才真的建）
  const def = document.createElement('button')
  def.className = 'it' + (!state.dir ? ' on' : '')
  def.innerHTML = '<span class="p" style="font-family:var(--font-ui);font-size:12px">新建工作空间</span>'
    + '<span class="tag">第一次创建时建</span><span class="ck"></span>'

  $('dirList').appendChild(def)

    h.className = 'ph'

    h.textContent = '已经有的舱'

    h2.style.paddingBottom = '2px'

    b.className = 'it' + (state.dir === d.path ? ' on' : '')
    b.innerHTML = `<span class="p">${d.path}</span>${d.tag ? `<span class="tag">${d.tag}</span>` : ''}`

}

function renderProjList() {
  const box = $('projList')
  box.innerHTML = ''
  // 已选条：项目多了以后，先看"我选了哪些"
  const bar = $('selBar')
  bar.innerHTML = ''
  bar.classList.toggle('on', state.projects.length > 0)
  for (const key of state.projects) {
    const [org, name] = key.split('/')
    const c = document.createElement('span')
    c.className = 'sc'
    c.innerHTML = `${name}<b>${org}</b><span title="移除">×</span>`
    c.querySelector('span').onclick = () => {
      state.projects = state.projects.filter((x) => x !== key)
      renderProjList(); render()
    }
    bar.appendChild(c)
  }

  const q = state.pQuery.trim().toLowerCase()
  const hits = PROJECTS.filter((p) => !q || p.name.toLowerCase().includes(q) || p.org.toLowerCase().includes(q))
  if (hits.length === 0) {
    const none = document.createElement('div')
    none.className = 'none'
    none.textContent = `没有匹配「${state.pQuery.trim()}」的项目`
    box.appendChild(none)
    $('projEcho').style.display = 'none'
    return
  }
  const perOrg = hits.reduce((m, p) => (m[p.org] = (m[p.org] || 0) + 1, m), {})
  let lastOrg = ''
  for (const p of hits) {
    if (p.org !== lastOrg) {
      lastOrg = p.org
      const h = document.createElement('div')
      h.className = 'org'
      h.innerHTML = `${p.org} <span class="n">${perOrg[p.org]}</span>`
      box.appendChild(h)
    }
    const key = p.org + '/' + p.name
    const b = document.createElement('button')
    b.className = 'it' + (state.projects.includes(key) ? ' on' : '')
    const hl = q ? p.name.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'), '<mark>$1</mark>') : p.name
    b.innerHTML = `<span class="p">${hl}</span><span class="tag">${p.org}</span><span class="ck"></span>`
    b.onclick = () => {
      state.projects = state.projects.includes(key)
        ? state.projects.filter((x) => x !== key)
        : [...state.projects, key]
      renderProjList(); render()
    }
    box.appendChild(b)
  }
  const echo = ECHO[state.dir]
  $('projEcho').style.display = echo ? '' : 'none'
  if (echo) $('projEcho').textContent = `已从这个工作空间回显 ${echo.length} 个项目 —— 可以增减，也能跨 org 再加。`
}

/* ═════════ 提交 → 她取名字 + 给初始化意见 ═════════ */
function proposeName(text) {
  const map = [
    ['电商', '电商舱'], ['商城', '商城舱'], ['订单', '订单舱'], ['库存', '库存舱'],
    ['健康', '健康舱'], ['体检', '健康舱'], ['医疗', '医疗舱'],
    ['对账', '账本舱'], ['账本', '账本舱'], ['财务', '财务舱'], ['结算', '结算舱'],
    ['知识', '知识舱'], ['文档', '文档舱'], ['爬虫', '采集舱'], ['采集', '采集舱'],
    ['监控', '监控舱'], ['数据', '数据舱'],
  ]
  for (const [k, v] of map) if (text.includes(k)) return v
  let base = text.replace(/[，。；、,.!?！？\s]/g, '')
  base = base.replace(/^(我要|我想|帮我|想要|做一个|做个|开发|搭建|建一?个?|一个|新的?|这个|该|舱)/g, '')
  base = base.slice(0, 4)
  return (base || '新') + '舱'
}
function whyName(text, name) {
  const map = [['电商', '电商后台'], ['订单', '订单'], ['库存', '库存'], ['健康', '健康管理'],
    ['对账', '对账'], ['账本', '账本'], ['知识', '知识库'], ['爬虫', '采集'], ['监控', '监控']]
  for (const [k, v] of map) if (text.includes(k)) return `你说的是${v} —— 名字直接取这个。`
  return '从你这句需求里取的，两三个字，好叫。'
}

function submit() {
  const text = $('req').value.trim()
  if (state.phase !== 'compose') return
  // 一个目录只能有一个舱：已有舱就只允许打开，不新建
  const clash = state.dir ? EXISTING[state.dir] : null
  if (clash) {
    face('think')
    typeLine(`这个目录已经是「${clash}」了 —— 一个目录只能有一个舱。`)
    $('subline').textContent = '我直接给你打开它。'
    setTimeout(() => openCabin(clash, '就绪'), 700)
    return
  }
  if (!text) return
  state.req = text
  if (!state.dir) {
    state.autoDir = state.autoDir || makeAutoDir('')
    $('subline').textContent = '没选目录 —— 我给它建一个自己的工作空间。'
  }
  state.phase = 'propose'
  face('think')
  sparkle(6)
  typeLine('说完了。名字我想好了 —— 你看一眼，不对就改。')
  setTimeout(renderProposal, 320)
}

function renderProposal() {
  const text = state.req
  state.proposed = proposeName(text)
  state.why = whyName(text, state.proposed)

  const panel = document.createElement('div')
  panel.className = 'propose'
  panel.id = 'proposePanel'

    <div class="hr"></div>
    <div class="nameblock">

      <input id="nameInput" value="${esc(state.proposed)}" maxlength="16" aria-label="她取的名字，可改" />
      <span class="why" id="nameWhy">${esc(state.why)}</span>
    </div>
    <div class="init">
      <span class="k">目录</span>
      <span class="v">${state.dir
        ? `<code class="mono">${esc(state.dir)}</code>`

      <span class="k">项目</span>
      <span class="v"><span class="chips">${state.projects.length
        ? state.projects.map((p) => `<span class="chip">${esc(p)}</span>`).join('')
        : '<span>不绑项目 —— 进去也能加</span>'}</span></span>
      <span class="k">初始化</span>
      <span class="v">落 <b>.cabin/</b> 骨架 · 需求写进 <b>requirements.md</b> · 起主会话后我提 M1</span>
    </div>
    <div class="acts">
      <span class="said">名字不喜欢就改；改了只是换个称呼，目录才是身份。</span>
      <button class="ghost" id="backCompose">回去改需求</button>
      <button class="send" id="confirmBtn">就按这个开 <kbd>⌘⏎</kbd></button>
    </div>`

  $('composer').style.display = 'none'
  document.querySelector('.foot2').style.display = 'none'
  $('subline').textContent = !state.dir
    ? '目录我给它开一个新的 —— 确认之后我才真的建，建完直接进舱。'
    : '确认之后我才真的建 —— 建完直接进舱，第一句还是我先问。'
  $('stage').appendChild(panel)

  const input = $('nameInput')
  input.oninput = () => {
    state.proposed = input.value.trim() || proposeName(state.req)
    render()

    panel.remove()
    $('composer').style.display = ''
    document.querySelector('.foot2').style.display = ''
    $('subline').textContent = '名字和项目我来安排 —— 你只要说清楚这个舱是干什么的。'
    state.phase = 'compose'
    face('listen')
    typeLine(GREET)
    render()
    $('req').focus()
  }
  render()
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

/* ═════════ 真正确认 → 建 ═════════ */
function create() {
  if (state.phase !== 'propose') return
  state.phase = 'creating'
  face('think')
  typeLine('落舱……')
  $('subline').textContent = '写 .cabin/ · 接项目关联 · 起一条会话。'
  $('confirmBtn').disabled = true
  $('confirmBtn').innerHTML = '正在落舱…'

  setTimeout(() => {
    state.phase = 'done'
    const name = state.proposed || '新舱'
    state.lastCabin = name
    state.lastStatus = '就绪'

    // 左栏：草稿行 → 正式舱行

      <span class="dot" style="background:var(--green)"></span>

    row.onclick = () => openCabin(name, '就绪')
    $('cabinRows').insertBefore(row, $('draftRow').nextSibling)

    face('done'); sparkle(10); nudge()
    typeLine('开好了。进去我先问你一句：这个舱长期拿它做什么。')
    $('subline').textContent = '会话已经开着 —— 初始化在舱内对话里，不在这里。'
    document.querySelector('#proposePanel .acts .said').textContent = '名字与目录都落好了。'

    const actions = document.querySelector('#proposePanel .acts')
    actions.innerHTML = `<span class="said">目录 = 舱的身份，名字只是称呼。</span>
      <button class="ghost" id="laterBtn">先放一放</button>
      <button class="send" id="enterBtn">进入作战舱 →</button>`
    $('laterBtn').onclick = () => openCabin(state.lastCabin, '就绪')
    $('enterBtn').onclick = () => openCabin(state.lastCabin, '就绪')

    $('tabChip').style.background = 'color-mix(in srgb, var(--green) 12%, transparent)'
    $('tabX').style.display = 'none'
    $('crumb').innerHTML = '会话已开 · 初始化在<b>舱内对话</b>里'

    document.querySelector('.nameblock input').disabled = true
    const tag = document.createElement('div')
    tag.style.cssText = 'margin-top:12px;font-size:10.5px;color:var(--faint)'
    tag.textContent = '已创建 · ' + (state.dir || state.autoDir)
    document.querySelector('#proposePanel').appendChild(tag)
  }, 1100)
}

/* ═════════ 舱内 ═════════ */
const OPENERS = {

  ]

  showView('cabin')
  setTimeout(() => $('chatInput').focus(), 60)
}
function addMsg(text) {
  const w = document.createElement('div')

  b.className = 'bub'; b.textContent = text

/* ═════════ 视图 ═════════ */
function showView(v) {
  for (const id of ['viewHero', 'viewEmpty', 'viewCabin']) $(id).classList.remove('on')
  $('viewHero').classList.toggle('on', v === 'hero')
  $('viewEmpty').classList.toggle('on', v === 'empty')
  $('viewCabin').classList.toggle('on', v === 'cabin')
  $('draftRow').setAttribute('aria-current', v === 'hero' ? 'page' : 'false')
  document.querySelectorAll('.cabinrow').forEach((r) => {
    r.setAttribute('aria-current', v === 'cabin' && r.dataset.cabin === state.lastCabin ? 'page' : 'false')
  })
  if (v === 'hero') {
    if (state.phase !== 'propose' && state.phase !== 'done') {
      $('tabChip').textContent = '草稿'
      $('tabChip').style.color = 'var(--cyan)'
      $('tabChip').style.background = 'color-mix(in srgb, var(--cyan) 12%, transparent)'
      $('tabX').style.display = ''
      $('crumb').innerHTML = '不会创建任何东西，直到 <b>开始创建</b>'
    }
  } else if (v === 'empty') {
    $('tabName').textContent = '对话'
    $('tabChip').textContent = '—'
    $('tabChip').style.color = 'var(--dim)'
    $('tabChip').style.background = 'rgba(255,255,255,.06)'
    $('tabX').style.display = 'none'
    $('crumb').innerHTML = '什么都没建 —— 取消是安全的'
  } else if (v === 'cabin') {
    $('tabName').textContent = state.lastCabin
    $('tabChip').textContent = '舱'
    $('tabChip').style.color = 'var(--dim)'
    $('tabChip').style.background = 'rgba(255,255,255,.06)'
    $('tabX').style.display = 'none'
    $('crumb').innerHTML = '一个目录 = 一个舱'
  }
  render()
}

function resetDraft() {
  state.dir = null; state.projects = []; state.req = ''
  state.proposed = ''; state.why = ''; state.autoDir = ''; state.pQuery = ''
  $('req').value = ''
  const old = $('proposePanel'); if (old) old.remove()
  $('composer').style.display = ''
  $('subline').textContent = '名字和项目我来安排 —— 你只要说清楚这个舱是干什么的。'
  $('tabChip').textContent = '草稿'
  $('tabChip').style.color = 'var(--cyan)'
  $('tabChip').style.background = 'color-mix(in srgb, var(--cyan) 12%, transparent)'
  $('tabX').style.display = ''
  $('crumb').innerHTML = '不会创建任何东西，直到 <b>开始创建</b>'
  render()
}

function discardDraft() {
  resetDraft()
  $('draftRow').style.display = 'none'
  state.phase = 'empty'
  showView('empty')
}

function newDraft() {
  resetDraft()
  $('draftRow').style.display = ''
  state.phase = 'compose'
  showView('hero')
  face('greet'); sparkle(7)
  typeLine(GREET)
  setTimeout(() => $('req').focus(), 120)
}

/* ═════════ 绑定 ═════════ */
$('req').addEventListener('input', () => { state.req = $('req').value; render() })
$('req').addEventListener('focus', () => { if (state.phase === 'compose') face('listen') })
$('sendBtn').onclick = submit
$('dirChip').onclick = (e) => { e.stopPropagation(); $('dirPop').classList.contains('on') ? closePops() : openDir() }
$('projChip').onclick = (e) => { e.stopPropagation(); $('projPop').classList.contains('on') ? closePops() : openProj() }
$('browseRow').onclick = openBrowse
$('dlgX').onclick = closeBrowse
$('dlgCancel').onclick = closeBrowse
$('dlgUp').onclick = () => { const up = parentOf(state.browsePath); if (up) { state.browsePath = up; renderBrowse() } }
$('dlgPick').onclick = () => {
  const path = state.browsePath
  const clash = EXISTING[path]
  closeBrowse()
  if (clash) { openCabin(clash, '就绪'); return }
  pickDir(path)
}
$('dlgBack').onclick = (e) => { if (e.target === $('dlgBack')) closeBrowse() }
$('projSearch').addEventListener('input', () => {
  state.pQuery = $('projSearch').value
  renderProjList()
})
$('projClear').onclick = () => {
  state.pQuery = ''
  $('projSearch').value = ''
  renderProjList()
  $('projSearch').focus()
}
$('dirPopX').onclick = closePops
$('projPopX').onclick = closePops
document.addEventListener('click', (e) => {
  // 列表项点击后会重渲染、原节点被移除，所以用 composedPath 判断"点是不是从输入框里来的"
  const inComposer = e.composedPath().some((n) => n instanceof Element && n.classList?.contains('composer'))
  if (!inComposer) closePops()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeBrowse(); closePops() }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault()
    if (state.phase === 'compose') submit()
    else if (state.phase === 'propose') create()
  }
})
$('tabX').onclick = () => { if (state.phase === 'compose' || state.phase === 'propose') discardDraft() }
$('draftDrop').onclick = (e) => { e.stopPropagation(); discardDraft() }
$('draftRow').onclick = () => {
  if (state.phase === 'empty') newDraft()
  else showView('hero')
}
$('secNew').onclick = newDraft
$('emptyNew').onclick = newDraft
$('emptyBack').onclick = () => openCabin('八爪舱', '就绪')
$('cabinBack').onclick = () => { showView('hero'); if (!document.getElementById('proposePanel')) state.phase = 'compose' }
document.querySelectorAll('.cabinrow').forEach((r) => {
  r.onclick = () => openCabin(r.dataset.cabin, r.querySelector('.st')?.textContent ?? '就绪')
})
$('chatSend').onclick = () => {
  const v = $('chatInput').value.trim(); if (!v) return
  $('chatInput').value = ''
  const me = document.createElement('div')
  me.className = 'msg me'
  me.innerHTML = `<div class="bub">${esc(v)}</div>`
  $('chatLog').appendChild(me)
  setTimeout(() => addMsg('收下了。这轮我们先把 M1 定下来 —— 只提案，派任务等你点头。'), 420)
}
$('chatInput').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('chatSend').click() } }

/* ═════════ 启动 ═════════ */
state.autoDir = makeAutoDir('')
render()
setTimeout(() => { typeLine(GREET); sparkle(7) }, 260)
setTimeout(() => $('stage').classList.remove('intro'), 1600)
</script>
</body>
</html>
