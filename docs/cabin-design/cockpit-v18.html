<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Octopus · 指挥舱 v18 — 舰桥主界面 · 六边形diegetic菜单 + 视觉小说对话</title>
<style>
/* ═══════════ tokens · 取自舰桥场景（日落橙粉紫 + 青霓虹 + 薰衣草金属） ═══════════ */
:root{
  --sun:#FF8A3D; --pink:#FF5C8A; --violet:#7B4DFF; --sky:#35C7F0; --teal:#2EE6D6;
  --metal:#B9B3D9; --metal2:#8D86B8; --hazard:#FFB020; --dot:#FF3B5C;
  --white:#FFFFFF; --ink:#2A2440; --ink2:#5A5378; --indigo:#1B1638; --indigo2:#241d4d;
  --gold:#F5C542; --green:#3DDC97; --amber:#FFB020; --red:#FF3B5C; --cyan:#2EE6D6;
  --paper:rgba(248,247,255,.93); --paper2:rgba(238,236,252,.9);
  --vnH:44vh;
  --hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  --cut:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-mono:'SF Mono','JetBrains Mono',Menlo,Consolas,ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:#0d0a1e;color:var(--white);font-family:var(--font-ui);font-size:13px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--teal) 45%,transparent);color:var(--indigo)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(42,36,64,.08)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--sky),var(--violet));border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--teal),var(--pink));background-clip:content-box}
.vn ::-webkit-scrollbar-track{background:rgba(255,255,255,.06)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
kbd{border:1px solid rgba(42,36,64,.3);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:9px;color:var(--ink2);background:rgba(255,255,255,.5);font-family:var(--font-mono)}

/* ═══════════ 场景 ═══════════ */
.app{position:relative;height:100vh;height:100dvh;overflow:hidden;isolation:isolate}
.scene{position:absolute;inset:-24px;z-index:0;transition:transform .6s cubic-bezier(.2,.8,.2,1);will-change:transform}
.scene img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;animation:breath 16s ease-in-out infinite;transform-origin:50% 45%}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.scene-grade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(27,22,56,.5),transparent 18%,transparent 70%,rgba(27,22,56,.55)),
             radial-gradient(120% 80% at 50% 50%,transparent 55%,rgba(27,22,56,.34))}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;bottom:-8px;width:3px;height:3px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);opacity:0;animation:mote linear infinite}
@keyframes mote{0%{transform:translateY(0);opacity:0}12%{opacity:.7}88%{opacity:.4}100%{transform:translateY(-104vh);opacity:0}}
.flash{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--fx,var(--teal)) 40%,transparent),transparent 62%)}
.flash.on{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.scene img,.motes i{animation:none}.flash{display:none}}

/* ═══════════ HUD 顶栏 ═══════════ */
.hud{position:absolute;left:0;right:0;top:0;z-index:50;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px}
.player{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 6px;clip-path:var(--cut);background:rgba(27,22,56,.62);backdrop-filter:blur(8px);border:1px solid rgba(46,230,214,.35)}
.player .lv{width:34px;height:38px;clip-path:var(--hex);display:grid;place-items:center;background:linear-gradient(160deg,var(--sky),var(--violet));color:#fff;font-weight:800;font-size:13px;font-family:var(--font-mono)}
.player .pn{display:flex;flex-direction:column;line-height:1.2}
.player .pn b{font-size:13px;font-weight:800;letter-spacing:.04em}
.player .pn span{font-size:9px;color:var(--metal);letter-spacing:.1em;font-family:var(--font-mono)}
.hint{margin:0 auto;display:flex;align-items:center;gap:8px;padding:5px 16px;border-radius:999px;background:rgba(27,22,56,.5);backdrop-filter:blur(8px);font-size:10.5px;color:var(--metal);border:1px solid rgba(185,179,217,.25)}
.hint kbd{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:var(--metal)}
.cur{display:flex;align-items:center;gap:7px}
.cur .ci{width:26px;height:29px;clip-path:var(--hex);display:grid;place-items:center;font-size:12px;color:#fff}
.cur.gold .ci{background:linear-gradient(160deg,var(--gold),var(--sun))}
.cur.cry .ci{background:linear-gradient(160deg,var(--sky),var(--violet))}
.cur b{font-size:15px;font-weight:800;font-family:var(--font-mono);text-shadow:0 1px 6px rgba(27,22,56,.8);font-variant-numeric:tabular-nums}
.cur .plus{width:20px;height:22px;clip-path:var(--hex);display:grid;place-items:center;background:rgba(46,230,214,.25);border:1px solid rgba(46,230,214,.5);color:var(--teal);font-size:12px;font-weight:800}
.hudhex{width:34px;height:38px;clip-path:var(--hex);display:grid;place-items:center;background:rgba(27,22,56,.62);border:1px solid rgba(185,179,217,.3);color:var(--metal);font-size:14px;transition:.15s;backdrop-filter:blur(6px)}
.hudhex:hover{color:#fff;background:rgba(46,230,214,.25);border-color:var(--teal)}
.hudhex.on{color:var(--teal);border-color:var(--teal);background:rgba(46,230,214,.18)}
.hudhex.off{color:var(--metal2);opacity:.6}

/* ═══════════ 左竖排系统图标 ═══════════ */
.leftstack{position:absolute;left:14px;top:86px;z-index:20;display:flex;flex-direction:column;gap:14px;transition:opacity .3s}
.litem{display:flex;align-items:center;gap:9px}
.lhex{position:relative;width:46px;height:52px;clip-path:var(--hex);display:grid;place-items:center;background:linear-gradient(160deg,rgba(248,247,255,.92),rgba(185,179,217,.85));color:var(--indigo);font-size:17px;box-shadow:0 0 0 1px rgba(46,230,214,.5),0 4px 14px rgba(27,22,56,.4);transition:.15s}
.litem:hover .lhex{transform:scale(1.08);box-shadow:0 0 0 2px var(--teal),0 0 18px rgba(46,230,214,.5)}
.llbl{padding:3px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);background:rgba(27,22,56,.66);backdrop-filter:blur(6px);font-size:12px;font-weight:800;letter-spacing:.06em;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.ndot{position:absolute;right:-3px;top:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--dot);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 8px rgba(255,59,92,.7);font-family:var(--font-mono)}
.ndot.pulse{animation:np 1.2s ease-in-out infinite}
@keyframes np{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

/* ═══════════ 右六边形主菜单 ═══════════ */
.rightmenu{position:absolute;right:18px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .3s}
.rhex{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:96px;height:108px;color:#fff;transition:.16s}
.rhex::before{content:"";position:absolute;inset:0;clip-path:var(--hex);background:linear-gradient(160deg,rgba(53,199,240,.3),rgba(123,77,255,.34));backdrop-filter:blur(6px);box-shadow:inset 0 0 0 2px rgba(46,230,214,.55);transition:.16s}
.rhex .ri,.rhex .rl{position:relative;z-index:1}
.rhex:hover{transform:scale(1.06)}
.rhex:hover::before{box-shadow:inset 0 0 0 2px var(--teal),0 0 26px rgba(46,230,214,.5);background:linear-gradient(160deg,rgba(53,199,240,.45),rgba(123,77,255,.5))}
.rhex .ri{font-size:26px;line-height:1;text-shadow:0 0 12px rgba(46,230,214,.8)}
.rhex .rl{font-size:13px;font-weight:800;letter-spacing:.1em;text-shadow:0 1px 6px rgba(27,22,56,.8)}
.rhex.big{width:124px;height:140px}
.rhex.big::before{background:linear-gradient(160deg,rgba(255,138,61,.5),rgba(255,92,138,.5));box-shadow:inset 0 0 0 2px rgba(255,176,32,.7)}
.rhex.big:hover::before{box-shadow:inset 0 0 0 2px var(--hazard),0 0 30px rgba(255,138,61,.6)}
.rhex.big .ri{font-size:34px}
.rhex.big .rl{font-size:16px}
.rhex .ndot{right:2px;top:2px;z-index:2}

/* ═══════════ 底部 comms / clock ═══════════ */
.commsbar{position:absolute;left:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:10px;max-width:min(430px,60vw);
  padding:8px 16px 8px 8px;clip-path:var(--cut);background:rgba(27,22,56,.7);backdrop-filter:blur(10px);border:1px solid rgba(46,230,214,.4);transition:.15s}
.commsbar:hover{border-color:var(--teal);box-shadow:0 0 20px rgba(46,230,214,.35)}
.commsbar .cb{position:relative;width:38px;height:42px;clip-path:var(--hex);display:grid;place-items:center;background:linear-gradient(160deg,var(--sky),var(--violet));font-size:16px}
.commsbar .ndot{left:36px;top:2px;z-index:2}
.commsbar .ct{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.commsbar .ct b{font-size:12px;font-weight:800}
.commsbar .ct span{font-size:10.5px;color:var(--metal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clockwidget{position:absolute;right:18px;bottom:16px;z-index:20;display:flex;align-items:center;gap:10px;padding:7px 14px;clip-path:var(--cut);background:rgba(27,22,56,.7);backdrop-filter:blur(10px);border:1px solid rgba(61,220,151,.4)}
.clockwidget .cw{font-size:17px;font-weight:800;font-family:var(--font-mono);color:var(--green);text-shadow:0 0 10px rgba(61,220,151,.6);font-variant-numeric:tabular-nums}
.clockwidget .cs{font-size:9.5px;color:var(--metal);letter-spacing:.08em}

/* ═══════════ 回流横幅 ═══════════ */
.banner{position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-14px);z-index:45;width:min(460px,92vw);
  clip-path:var(--cut);background:linear-gradient(90deg,rgba(248,247,255,.96),rgba(238,236,252,.94));color:var(--ink);
  border:1px solid color-mix(in srgb,var(--accent,var(--sun)) 60%,transparent);box-shadow:0 14px 40px rgba(27,22,56,.45);
  padding:10px 16px;cursor:pointer;opacity:0;pointer-events:none;transition:.3s}
.banner.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.banner .bh{display:flex;align-items:center;gap:8px}
.banner .bk{font-size:9px;letter-spacing:.14em;font-weight:800;padding:2px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%);background:var(--accent,var(--sun));color:#fff}
.banner .bl{font-size:9px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.banner .bl i{width:5px;height:5px;border-radius:50%;background:var(--dot);animation:np 1.2s infinite}
.banner .bx{margin-left:auto;width:22px;height:22px;display:grid;place-items:center;color:var(--ink2);border:1px solid rgba(42,36,64,.2);clip-path:var(--hex)}
.banner .bt{font-size:13.5px;font-weight:800;margin-top:5px}
.banner .bs{font-size:10.5px;color:var(--ink2);margin-top:2px}
.banner .bc{margin-top:6px;font-size:10.5px;font-weight:800;color:var(--accent,var(--sun))}

/* ═══════════ 明亮菜单面板 ═══════════ */
.pscrim{position:absolute;inset:0;z-index:38;background:rgba(27,22,56,.42);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s}
.pscrim.on{opacity:1;pointer-events:auto}
.panel{position:absolute;z-index:40;left:50%;top:70px;bottom:96px;transform:translateX(-50%);width:min(760px,94vw);
  display:none;flex-direction:column;min-height:0;clip-path:var(--cut);
  background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);backdrop-filter:blur(16px);
  border:1px solid rgba(46,230,214,.5);box-shadow:0 24px 70px rgba(27,22,56,.5),0 0 0 1px rgba(255,255,255,.5) inset}
.panel.open{display:flex;animation:pin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{0%{opacity:0;transform:translateX(-50%) translateY(14px) scale(.98)}100%{opacity:1;transform:translateX(-50%)}}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--sky),var(--violet),var(--pink))}
.ph{flex:none;display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid rgba(42,36,64,.12)}
.ph .pg{width:32px;height:36px;clip-path:var(--hex);display:grid;place-items:center;background:linear-gradient(160deg,var(--sky),var(--violet));color:#fff;font-size:15px}
.ph .pt{display:flex;flex-direction:column;line-height:1.2}
.ph .pt b{font-size:15px;font-weight:800}
.ph .pt span{font-size:9.5px;color:var(--ink2);letter-spacing:.1em;font-family:var(--font-mono)}
.ph .sp{flex:1}
.phx{width:28px;height:32px;clip-path:var(--hex);display:grid;place-items:center;background:rgba(42,36,64,.08);color:var(--ink2);font-size:13px}
.phx:hover{background:var(--red);color:#fff}
.pb{flex:1;min-height:0;overflow:auto;padding:14px 18px}
/* fleet rows */
.frow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;clip-path:var(--cut);
  background:rgba(255,255,255,.66);border:1px solid rgba(42,36,64,.1);border-left:4px solid var(--accent,var(--sky));transition:.14s}
.frow:hover{transform:translateX(3px);background:#fff;box-shadow:0 6px 18px rgba(42,36,64,.12)}
.frow .fg{flex:none;width:30px;height:34px;clip-path:var(--hex);display:grid;place-items:center;background:color-mix(in srgb,var(--accent,var(--sky)) 18%,#fff);color:var(--accent,var(--sky));font-size:14px}
.frow .fm{flex:1;min-width:0}
.frow .ft{font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px}
.frow .ft .stars{color:var(--hazard);font-size:9px;letter-spacing:1px}
.frow .fd{font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fb{height:4px;background:rgba(42,36,64,.1);margin-top:4px;clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.frow .fb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent,var(--sky)),var(--pink))}
.frow .fr{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.fstate{font-size:9px;font-weight:800;padding:2px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%);background:rgba(42,36,64,.08);color:var(--ink2)}
.fstate.run{background:rgba(53,199,240,.18);color:#0b7fa8}
.fstate.wait{background:rgba(255,176,32,.2);color:#9a6a00}
.fstate.blocked{background:rgba(255,59,92,.16);color:#c22040}
.fstate.done{background:rgba(61,220,151,.2);color:#0c8f60}
.fneed{font-size:9px;font-weight:800;color:var(--dot);display:inline-flex;align-items:center;gap:4px}
.fneed i{width:5px;height:5px;border-radius:50%;background:var(--dot);animation:np 1.4s infinite}
/* ops cards */
.ocard{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;padding:11px 13px;margin-bottom:9px;clip-path:var(--cut);
  background:rgba(255,255,255,.7);border:1px solid rgba(42,36,64,.1);border-left:4px solid var(--accent,var(--sun));transition:.14s;cursor:pointer}
.ocard:hover{transform:translateX(-3px);background:#fff;box-shadow:0 6px 18px rgba(42,36,64,.14)}
.ocard .ot{display:flex;align-items:center;gap:8px}
.ocard .oh{font-size:11px;font-weight:800;color:var(--accent,var(--sun));font-family:var(--font-mono)}
.ocard .ok{font-size:9px;font-weight:800;letter-spacing:.1em;padding:2px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%);background:var(--accent,var(--sun));color:#fff}
.ocard .oa{margin-left:auto;font-size:9.5px;color:var(--ink2)}
.ocard .ti{font-size:13px;font-weight:800}
.ocard .q{font-size:11px;color:var(--ink2)}
.ocard .go{font-size:10px;font-weight:800;color:var(--accent,var(--sun))}
.ocard.done{border-left-color:var(--green);cursor:default}
.ocard.done .ok{background:var(--green)}
.ocard .rc{font-size:11.5px;font-weight:800;color:#0c8f60}
.ocard.collapsing{animation:oc .5s ease forwards}
@keyframes oc{to{opacity:0;max-height:0;padding:0 13px;margin-bottom:0;border-width:0}}
.pempty{text-align:center;padding:30px 16px;color:var(--ink2);font-size:12px}
.pempty b{display:block;color:#0c8f60;font-size:15px;margin-bottom:5px}
/* detail */
.dtabs{flex:none;display:flex;gap:7px;padding:11px 18px 0}
.dtab{height:30px;padding:0 16px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);background:rgba(42,36,64,.07);color:var(--ink2);font-size:11.5px;font-weight:700;transition:.13s}
.dtab:hover{background:rgba(42,36,64,.13)}
.dtab.on{background:linear-gradient(90deg,var(--sky),var(--violet));color:#fff;font-weight:800}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:12px}
.kvi{padding:9px 12px;clip-path:var(--cut);background:rgba(255,255,255,.7);border:1px solid rgba(42,36,64,.08)}
.kvi .k{font-size:9px;letter-spacing:.12em;color:var(--ink2)}
.kvi .v{font-size:14px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kvi .v.a{color:#0b7fa8}.kvi .v.g{color:#9a6a00}.kvi .v.gr{color:#0c8f60}
.sect{font-size:10px;letter-spacing:.16em;color:var(--violet);font-weight:800;margin:13px 0 7px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(123,77,255,.4),transparent)}
.ev{display:flex;gap:9px;padding:6px 4px;border-bottom:1px dashed rgba(42,36,64,.12);font-size:11px}
.ev:last-child{border-bottom:0}
.ev .t{flex:none;width:40px;color:var(--ink2);font-family:var(--font-mono)}
.ev .w{flex:none;width:80px;color:#0b7fa8;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .x{flex:1;color:var(--ink2)}
.ev.attention .w,.ev.attention .x{color:#9a6a00}
.file{margin-bottom:9px;clip-path:var(--cut);background:rgba(255,255,255,.72);border:1px solid rgba(42,36,64,.1);overflow:hidden}
.file .fh{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:11px;border-bottom:1px solid rgba(42,36,64,.1)}
.file .fh .p{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fh .st{color:#9a6a00;font-weight:800}
.file .fh .ad{color:#0c8f60}.file .fh .dl{color:#c22040}
.diff{font-size:11px;line-height:1.6;padding:5px 0;font-family:var(--font-mono)}
.diff .ln{display:flex;gap:9px;padding:0 12px}
.diff .ln .n{flex:none;width:30px;color:var(--ink2);text-align:right}
.diff .ln.add{background:rgba(61,220,151,.16);color:#0c8f60}
.diff .ln.del{background:rgba(255,59,92,.13);color:#c22040}
.diff .ln.ctx{color:var(--ink2)}
.ac{display:flex;align-items:flex-start;gap:8px;padding:7px 4px;border-bottom:1px dashed rgba(42,36,64,.12);font-size:11.5px}
.ac:last-child{border-bottom:0}
.ac .ck{flex:none;width:17px;height:19px;clip-path:var(--hex);display:grid;place-items:center;font-size:9px;background:rgba(42,36,64,.08);color:var(--ink2)}
.ac.pass .ck{background:rgba(61,220,151,.25);color:#0c8f60}
.ac.open .ck{background:rgba(255,176,32,.25);color:#9a6a00}

  else if(state.detailTab==='changes'){const c=CHANGES[j.id];inner=c?`<div class="kv"><div class="kvi"><div class="k">分支</div><div class="v g">${esc(c.branch)}</div></div><div class="kvi"><div class="k">基线</div><div class="v">${esc(c.base)}</div></div><div class="kvi"><div class="k">文件</div><div class="v">${c.files.length}</div></div></div><div class="sect">变更 diff</div>${c.files.map(f=>`<div class="file"><div class="fh"><span class="st">${f.state}</span><span class="p">${esc(f.path)}</span><span class="ad">+${f.add}</span><span class="dl">−${f.del}</span></div><div class="diff">${f.diff.map(l=>`<div class="ln ${l[0]}"><span class="n">${l[1]}</span><span>${l[0]==='add'?'+':l[0]==='del'?'−':' '} ${esc(l[2])}</span></div>`).join('')}</div></div>`).join('')}`:'<div class="pempty">这条作业暂无代码变更。</div>';}
  else{const a=AC[j.id];inner=a?`<div class="sect">验收单 AC</div>${a.map(x=>`<div class="ac ${x.pass?'pass':'open'}"><span class="ck">${x.pass?'✓':'!'}</span><span>${esc(x.t)}</span></div>`).join('')}<div class="sect">通用项</div>${['产物写入任务目录','没有越权改动','日志无未处理告警'].map(t=>`<div class="ac pass"><span class="ck">✓</span><span>${t}</span></div>`).join('')}`:'<div class="pempty">这条作业暂无验收单。</div>';}
  body=`<div class="dtabs">${tabs.map(t=>`<button class="dtab${state.detailTab===t?' on':''}" data-dtab="${t}">${TL[t]}</button>`).join('')}</div><div style="padding:12px 0 0">${inner}<button class="dtalk" data-talk="${j.id}">💬 与汐音谈这条</button></div>`;
  p.innerHTML=`<div class="ph"><span class="pg">${KIND[j.kind].g}</span><span class="pt"><b>${esc(j.title)}</b><span>${esc(pr.name)} · ${esc(j.branch)}</span></span><span class="sp"></span><button class="phx" data-close>✕</button></div><div class="pb">${body}</div>`;
  bindPanel();return;}
 else{const msgs=threadOf(state.thread);body=msgs.map(m=>{if(m.who==='sys')return `<div class="loglm sys"><div class="bb">${esc(m.text)}</div></div>`;if(m.who==='you')return `<div class="loglm me"><div class="bb"><div class="who"><b>指挥官</b><span>${esc(m.t||'')}</span></div>${esc(m.text)}</div></div>`;if(m.who==='doer')return `<div class="loglm"><span class="av doer">⚙</span><div class="bb"><div class="who"><b>${esc(m.name)}</b><span>${esc(m.t||'')}</span></div>${esc(m.text)}</div></div>`;return `<div class="loglm"><span class="av"><img src="${PORTRAIT[m.mood||'idle']}" alt=""/></span><div class="bb"><div class="who"><b>汐音</b><span>${esc(m.t||'')}</span></div>${esc(m.text)}</div></div>`;}).join('');}
 p.innerHTML=`<div class="ph"><span class="pg">${T[0]}</span><span class="pt"><b>${T[1]}</b><span>${T[2]}</span></span><span class="sp"></span><button class="phx" data-close>✕</button></div><div class="pb">${body}</div>`;
 bindPanel();}
function evHTML(e){return `<div class="ev ${e[2]==='attention'?'attention':''}"><span class="t">${e[0]}</span><span class="w">${esc(e[1])}</span><span class="x">${esc(e[3])}</span></div>`;}
function bindPanel(){const p=$('#panel');
 $('[data-close]',p)?.addEventListener('click',closePanel);
 $$('[data-job]',p).forEach(b=>b.addEventListener('click',()=>{state.detailJob=b.dataset.job;state.detailTab='overview';state.panel='detail';renderPanel();Audio.sfx('click');}));
 $$('[data-op]',p).forEach(c=>{const go=()=>{const o=opOf(c.dataset.op);closePanel();openVN(o.job);};c.addEventListener('click',go);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});
 $$('[data-dtab]',p).forEach(b=>b.addEventListener('click',()=>{state.detailTab=b.dataset.dtab;renderPanel();Audio.sfx('click');}));
 $('[data-talk]',p)?.addEventListener('click',e=>{const jid=e.currentTarget.dataset.talk;closePanel();openVN(jid);});}
$('#pscrim').addEventListener('click',closePanel);

/* VN */
function currentOf(t){const m=threadOf(t);for(let i=m.length-1;i>=0;i--)if(m[i].who==='xy'||m[i].who==='doer')return m[i];return null;}
function lmHTML(m){if(m.who==='sys')return `<div class="lm sys"><div class="bb">${esc(m.text)}</div></div>`;if(m.who==='you')return `<div class="lm me"><div class="bb"><div class="who"><b>指挥官</b><span>${esc(m.t||nowHM())}</span></div>${esc(m.text)}</div></div>`;if(m.who==='doer')return `<div class="lm"><span class="av doer">⚙</span><div class="bb"><div class="who"><b>${esc(m.name)}</b><span>执行分身 · ${esc(m.t||nowHM())}</span></div>${esc(m.text)}</div></div>`;return `<div class="lm"><span class="av"><img src="${PORTRAIT[m.mood||'idle']}" alt=""/></span><div class="bb"><div class="who"><b>汐音</b><span>助理 · ${esc(m.t||nowHM())}</span></div>${esc(m.text)}</div></div>`;}
function renderVN(){const isMain=state.thread==='main';const j=isMain?null:jobOf(state.thread);
 $('#vnThread').textContent=isMain?'主对话':(j?j.title:'对话');$('#vnSub').textContent=isMain?'· 舰桥频道':(j?'· '+projOf(j.proj).name+' · '+j.agent:'');
 $('#vnGlyph').textContent=isMain?'⬢':(j?KIND[j.kind].g:'⬡');$('#vnBack').hidden=isMain;$('#vnDetailBtn').hidden=isMain;
 const cur=currentOf(state.thread);const msgs=threadOf(state.thread).filter(m=>m!==cur);
 $('#vnLog').innerHTML=msgs.map(lmHTML).join('');$('#vnLog').scrollTop=$('#vnLog').scrollHeight;typeCurrent(cur);
 const o=isMain?null:opForJob(state.thread);const ch=$('#vnChoices');
 if(o){ch.hidden=false;ch.innerHTML=o.options.map((opt,i)=>`<button class="vchoice${opt.label===o.rec?' rec':''}" data-choice="${o.id}" data-label="${esc(opt.label)}" style="--accent:${OP_KIND[o.kind].color}"><span class="n">${i+1}</span><b>${esc(opt.label)}</b><span>${esc(opt.impact)}</span></button>`).join('');}
 else{ch.hidden=true;ch.innerHTML='';}
 $('#cmdInput').placeholder=isMain?'回应汐音，或下达新指令…（⏎ 发送 · ⇧⏎ 换行）':`回应 ${j?j.agent:''} / 给这条作业下指令…（上方选项即拍板）`;}
function openVN(thread='main'){state.thread=thread;state.vnOpen=true;state.unread=0;$('#app').classList.add('talking');$('#vn').classList.add('open');renderVN();renderDots();Audio.sfx('open');if(!opForJob(thread))setTimeout(()=>$('#cmdInput').focus(),60);}
function closeVN(){state.vnOpen=false;$('#app').classList.remove('talking');$('#vn').classList.remove('open');$('#cmdInput').blur();renderDots();Audio.sfx('close');}
function pushMsg(t,m){threadOf(t).push(m);if(state.vnOpen&&state.thread===t)renderVN();if(!state.vnOpen){state.unread++;$('#commsPreview').textContent=m.text;renderDots();}}
let typeT={};
function pushReply(t,m,delay=700){clearTimeout(typeT[t]);if(state.vnOpen&&state.thread===t){$('#curLine').innerHTML='<span class="typing"><i></i><i></i><i></i></span>';$('#curSpeaker').textContent=m.who==='doer'?m.name:'汐音';}typeT[t]=setTimeout(()=>{pushMsg(t,m);if(m.who==='xy'&&m.mood)setMood(m.mood,5000);},delay);}

/* send / spawn / resolve */
function autoGrow(){const t=$('#cmdInput');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,110)+'px';}
function sendCommand(){const t=$('#cmdInput');const text=t.value.trim();if(!text){$('#vnIn').classList.remove('shake');void $('#vnIn').offsetWidth;$('#vnIn').classList.add('shake');Audio.sfx('deny');return;}
 const th=state.thread;pushMsg(th,{who:'you',name:'指挥官',text,t:nowHM()});t.value='';autoGrow();Audio.sfx('send');state.cost+=.01;renderHUD();
 const o=th!=='main'?opForJob(th):null;if(o){const hit=o.options.find(x=>text.includes(x.label)||x.label.includes(text));if(hit){resolveOp(o.id,hit.label,text===hit.label?'':text);return;}}
 if(th==='main'){setMood('thinking',4000);const sp=maybeSpawn(text);pushReply('main',{who:'xy',name:'汐音',text:sp?sp.ack:rnd(ACK),t:nowHM(),mood:sp?'working':'idle'},800);}
 else{const j=jobOf(th);pushReply(th,{who:'doer',name:j?j.agent:'分身',text:'收到指令，我在当前安全点接着推进，结果回来汇报。',t:nowHM()},750);pushReply(th,{who:'xy',name:'汐音',text:o?'我先替您盯着这条决策，您选上方任一项即可拍板。':'已 relay 给执行分身，我盯到收口向您汇报。',t:nowHM(),mood:'working'},1500);}}
function maybeSpawn(text){if(!/新建|开发|做一|做个|修一|修复|加一|加个|实现|跑一|写一|迁移|重构|优化/.test(text))return null;
 const id='j-new'+(++state.seq);const proj=/网关|限流|退款|路由/.test(text)?'gateway':/风控|告警/.test(text)?'risk':/边缘|灰度|节点/.test(text)?'edge':'ledger';
 const title=text.length>16?text.slice(0,16)+'…':text;
 state.jobs.unshift({id,proj,kind:'task',title:'新指令 · '+title,status:'run',pct:5,doing:'汐音已接单 · 拆解中',agent:proj+'-1',branch:'feat/new-'+state.seq,clock:'0m',cost:0,rarity:2});
 state.threads[id]=[{who:'sys',text:'—— 新指令 · '+title+' ——'},{who:'you',name:'指挥官',text,t:nowHM()},{who:'xy',name:'汐音',text:'接「'+title+'」，我先拆 spec，到拍板点停下等您。',t:nowHM(),mood:'working'}];
 renderDots();if(state.panel==='fleet')renderPanel();flash(projOf(proj).color);
 return{ack:'收到，指挥官。「'+title+'」我已经派进编队，先拆 spec，到要您拍板的点我举上来。'};}
function resolveOp(id,choice,note=''){const o=opOf(id);if(!o||o.status!=='open')return;o.status='done';o.choice=choice;o.note=note;o.at=nowHM();
 const j=jobOf(o.job);if(j){if(o.kind==='accept'){j.status='done';j.pct=100;j.doing='已验收归档';}else{j.status='run';j.pct=Math.min(96,Math.max(j.pct,60)+8);j.doing='已拍板 · '+choice;}}
 pushMsg(o.job,{who:'you',name:'指挥官',text:'拍板：'+choice+(note?'（'+note+'）':''),t:nowHM()});
 pushReply(o.job,{who:'xy',name:'汐音',text:'收到，「'+choice+'」已派回执行。这条从决断队列消项了，我盯到收口。',t:nowHM(),mood:'happy'},700);
 renderDots();renderHUD();if(state.vnOpen&&state.thread===o.job)renderVN();if(state.panel==='ops')renderPanel();if(state.panel==='detail')renderPanel();
 flash('var(--green)');Audio.sfx('confirm');setMood('happy',5000);
 setTimeout(()=>{o.removed=true;const el=$(`[data-opdone="${id}"]`);if(el){el.classList.add('collapsing');setTimeout(()=>{if(state.panel==='ops')renderPanel();if(state.vnOpen&&state.thread===o.job)renderVN();},500);}else{if(state.panel==='ops')renderPanel();if(state.vnOpen&&state.thread===o.job)renderVN();}},2600);}

/* banner / arrival */
let bannerT=null;
function showBanner(o){state.brief=o;const k=OP_KIND[o.kind];const e=$('#banner');e.style.setProperty('--accent',k.color);$('#bannerK').textContent=k.k;$('#bannerT').textContent=o.title;$('#bannerS').textContent=o.ctx;e.classList.add('show');clearTimeout(bannerT);bannerT=setTimeout(hideBanner,10000);}
function hideBanner(){clearTimeout(bannerT);state.brief=null;$('#banner').classList.remove('show');}
function arriveNext(){if(!state.pool.length){$('#commsPreview').textContent='回流都处理完了，指挥官。要不要我造一条？';setMood('wink',4500);Audio.sfx('click');return;}
 const o=state.pool.shift();state.ops.push(o);const j=jobOf(o.job);if(j){j.status=o.kind==='block'?'blocked':'wait';j.pct=Math.max(j.pct,55);j.doing=o.ctx;}
 pushMsg(o.job,{who:'xy',name:'汐音',text:o.line,t:nowHM(),mood:o.mood||'alert'});
 renderDots();if(state.panel==='ops')renderPanel();if(state.panel==='fleet')renderPanel();
 setMood(o.mood||'alert',6500);flash(OP_KIND[o.kind].color);Audio.sfx('arrive');showBanner(o);scheduleArrival();}
let arrT=null;function scheduleArrival(){clearTimeout(arrT);if(state.pool.length)arrT=setTimeout(arriveNext,34000);}

/* theme */
const THEMES=[['#2EE6D6','#35C7F0','#7B4DFF'],['#FF5C8A','#FF8A3D','#7B4DFF'],['#3DDC97','#35C7F0','#F5C542']];
function cycleTheme(){state.theme=(state.theme+1)%THEMES.length;const[t,s,v]=THEMES[state.theme];document.documentElement.style.setProperty('--teal',t);document.documentElement.style.setProperty('--sky',s);document.documentElement.style.setProperty('--violet',v);Audio.sfx('click');flash(t);}

/* events */
$('#rCmd').addEventListener('click',()=>{openVN('main');warpJump();});
$('#rFleet').addEventListener('click',()=>openPanel('fleet'));
$('#rOps').addEventListener('click',()=>openPanel('ops'));
$('#rDetail').addEventListener('click',()=>{state.detailJob=state.detailJob||state.jobs.find(j=>j.status==='wait'||j.status==='blocked')?.id||state.jobs[0].id;state.detailTab='overview';openPanel('detail');});
$('#lXiyin').addEventListener('click',()=>{const[t,m]=rnd(SAY);setMood(m,5500);openVN('main');typeCurrent({who:'xy',name:'汐音',text:t});});
$('#lLog').addEventListener('click',()=>openPanel('log'));
$('#lSim').addEventListener('click',arriveNext);
$('#lTheme').addEventListener('click',cycleTheme);
$('#btnSim').addEventListener('click',arriveNext);
$('#btnTheme').addEventListener('click',cycleTheme);
$('#btnSound').addEventListener('click',()=>{const on=!state.sound;Audio.setSound(on);if(on)Audio.ensure();$('#btnSound').classList.toggle('on',on);$('#btnSound').classList.toggle('off',!on);$('#btnSound').textContent=on?'♪':'∅';if(on)Audio.sfx('click');});
$('#commsbar').addEventListener('click',()=>openVN(state.thread||'main'));
$('#vnClose').addEventListener('click',closeVN);
$('#vnBack').addEventListener('click',()=>{state.thread='main';renderVN();});
$('#vnDetailBtn').addEventListener('click',()=>{closeVN();state.detailJob=state.thread;state.detailTab='overview';openPanel('detail');});
$('#btnSend').addEventListener('click',sendCommand);
$('#cmdInput').addEventListener('input',autoGrow);
$('#cmdInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCommand();}});
$('#vnChoices').addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(b){const note=$('#cmdInput').value.trim();resolveOp(b.dataset.choice,b.dataset.label,note===b.dataset.label?'':note);$('#cmdInput').value='';autoGrow();}});
$('#banner').addEventListener('click',e=>{if(e.target.closest('#bannerX'))return;const o=state.brief;if(o){hideBanner();openVN(o.job);}});
$('#bannerX').addEventListener('click',e=>{e.stopPropagation();hideBanner();Audio.sfx('close');});
addEventListener('keydown',e=>{const inIn=e.target.closest('textarea,input');
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openVN('main');return;}
 if(e.altKey&&e.key.toLowerCase()==='m'){e.preventDefault();$('#btnSound').click();return;}
 if(e.altKey&&e.key.toLowerCase()==='w'){e.preventDefault();warpJump();return;}
 if(e.altKey&&e.key==='1'){e.preventDefault();const f=[...openOps()].sort((a,b)=>OP_KIND[a.kind].pri-OP_KIND[b.kind].pri)[0];if(f)openVN(f.job);else openVN('main');return;}
 if(e.key==='Escape'){if(state.brief){hideBanner();return;}if(state.panel){closePanel();return;}if(state.vnOpen){closeVN();return;}}
 if(!inIn&&state.vnOpen&&/^[1-9]$/.test(e.key)&&state.thread!=='main'){const o=opForJob(state.thread);if(o){const i=+e.key-1;if(o.options[i]){e.preventDefault();resolveOp(o.id,o.options[i].label);}}}});

/* boot */
renderDots();renderHUD();setMood('idle');
setTimeout(()=>{$('#commsPreview').textContent='指挥官，欢迎回到舰桥。我就在这儿，您说话我回应。';},600);
arrT=setTimeout(arriveNext,16000);
</script>
</body>
</html>
