<!doctype html>
<!--
  ══════════════════════════════════════════════════════════════════════════
  PROTOTYPE — 一次性代码，回答一个设计问题。不进生产，不做像素级还原。
  问题：知识中心 /knowledge WebUI 怎么排布才符合人类使用习惯？
        （痛点：对话/浏览模式一切换整个界面重绘；右栏 wiki 被对话"跟随"劫持；
          wiki 显示不像 wiki 软件）
  变体（浮条 ◀▶ 或键盘 ←→ / 数字 0-3 切换，状态在 URL hash #v0 #vA #vB #vC）：
    v0 现状复现（基线，用来"感受病"）      —— 照抄 page.tsx:197 的两套 grid 与跟随逻辑
    vA wiki 主场 + 对话抽屉               —— 参考 Notion AI / Obsidian：正文永不重排
    vB 页签制：讨论属于页面               —— 参考 Wikipedia「阅读/讨论」Talk 页签
    vC 命令条 + 浮式问答                  —— 参考 Perplexity / Linear：零常驻栏
  数据全是内存假数据（形状对齐 lib/knowledge/knowledge-center-api.ts 的
  KcTree/KcArticle/KcHealth + card-protocol 卡型）。零持久化，刷新即重置。
  浏览器直接打开本文件即可（file://），不需要起 server。
  ══════════════════════════════════════════════════════════════════════════
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · 知识中心 WebUI — 4 变体对比</title>
<style>
/* ── 全站 TUI 暗色 token（镜像 globals.css，勿改真代码） ── */
:root{
  --bg:#0A0A0C; --paper:#1C1C22; --ink:#F5F5F2; --dim:#9698A3; --bd:#32323B;
  --pink:#FF855C; --pink-s:#2A1B19; --yellow:#FFC857; --yellow-s:#231E17;
  --purple:#D2A8FF; --purple-s:#221E29; --green:#7EE787; --green-s:#18211A;
  --amber:#FFC857; --amber-s:#231E17; --cyan:#4FD1D9; --cyan-s:#151F21;
  --red:#FF5C5C; --navy:#4C79BF; --navy-s:#181F2D;
  --idle:#131318; --inset:#020202;
  --bdw:1.5px; --sh:0 4px 16px rgba(0,0,0,.45); --sh-lg:0 10px 32px rgba(0,0,0,.5);
  --mono:"Cascadia Code",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.65 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font:inherit;color:var(--ink);background:var(--inset);border:var(--bdw) solid var(--bd);border-radius:8px;outline:none}
input:focus{border-color:var(--pink)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px}
#root{height:100vh;display:flex;flex-direction:column;min-height:0}
b{color:var(--ink)}
.dim{color:var(--dim)} .mono{font-family:var(--mono)} .small{font-size:11px}
/* 通用件 */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700;background:var(--idle);color:var(--dim);border:var(--bdw) solid transparent;white-space:nowrap}
.chip.type{color:var(--cyan);border-color:var(--cyan)} .chip.stable{background:var(--green-s);color:var(--green)}
.chip.drift{background:var(--amber-s);color:var(--amber)} .chip.conf{background:var(--cyan-s);color:var(--cyan)}
.chip.date{background:var(--idle);color:var(--dim)}
.chip.link{color:var(--pink);border-color:var(--pink)} .chip.link:hover{background:var(--pink-s)}
.chip.src{color:var(--green);border-color:var(--green);font-family:var(--mono);font-size:10px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.chip.src:hover{background:var(--green-s)}
.pill{border:var(--bdw) solid var(--bd);border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;background:var(--paper);color:var(--dim)}
.pill:hover{color:var(--ink);background:var(--purple-s)}
.pill.on{background:var(--amber);color:var(--bg)}
.rule{display:flex;gap:8px;align-items:baseline;margin:.4em 0}
.rid{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--yellow);background:var(--yellow-s);padding:1px 6px;border-radius:4px;white-space:nowrap}
a.wl{color:var(--pink);text-decoration:none;border-bottom:1px dashed var(--pink);cursor:pointer}
a.wl:hover{background:var(--pink-s)}
.art-body h2{font-size:16px;margin:1.2em 0 .4em;border-bottom:var(--bdw) solid var(--bd);padding-bottom:4px}
.art-body p{margin:.5em 0;color:#d8d8d4}
.art-body ul{margin:.4em 0;padding-left:1.3em;color:#d8d8d4}
.art-body code{font-family:var(--mono);font-size:11.5px;background:var(--inset);padding:1px 5px;border-radius:4px;color:var(--cyan)}
.flash{outline:2px solid var(--yellow);outline-offset:2px;transition:outline-color .8s}
/* 卡片（kc-card 假想形制） */
.kccard{border:var(--bdw) solid var(--bd);border-radius:10px;background:var(--paper);padding:8px 10px;margin:6px 0;box-shadow:var(--sh)}
.kccard .kt{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px}
.kccard .kb{font-size:9.5px;font-family:var(--mono);padding:1px 6px;border-radius:4px;font-weight:700}
.kb.compile-diff{background:var(--green-s);color:var(--green)} .kb.finding{background:var(--amber-s);color:var(--amber)}
.kb.backfill{background:var(--cyan-s);color:var(--cyan)} .kb.case{background:var(--purple-s);color:var(--purple)}
.kccard .km{font-size:11px;color:var(--dim);margin-top:2px}
.kccard .krefs{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.kcref{font-size:10.5px;font-weight:700;color:var(--pink);background:var(--pink-s);border-radius:6px;padding:1px 7px;cursor:pointer}
.kcref:hover{outline:1px solid var(--pink)}
.kcbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.kcbtns .pill{font-size:10.5px;padding:2px 8px}
.kcbtns .danger:hover{color:var(--red);background:#231517}
/* TUI 转录（镜像 TuiTranscript.tsx：❯ 用户行 / ✳ agent 段 / ◌ 过程折叠 / ▸ 工具行可展 input·result） */
.tui{font-size:12.5px}
.tui-user{background:var(--paper);box-shadow:inset 0 0 0 1px var(--bd);border-radius:6px;padding:5px 10px;margin:8px 0 6px;white-space:pre-wrap;word-break:break-word}
.tui-user .chev{color:var(--pink);font-weight:800}
.tui-meta-h{color:var(--dim);cursor:pointer;display:inline-block;margin:2px 0}
.tui-meta-h b{color:var(--pink)} .tui-meta-h:hover{color:var(--ink)}
.tui-meta-b{margin:2px 0 8px 4px;padding-left:10px;border-left:var(--bdw) solid var(--bd)}
.tui-think{color:var(--dim);white-space:pre-wrap;word-break:break-word;margin:2px 0}
.tui-tool{color:var(--dim)}
.tui-tool .tw{cursor:pointer;display:block;width:100%;text-align:left}
.tui-tool .tw:hover{color:var(--ink)}
.tui-tool .st-ok{color:var(--green)} .tui-tool .st-fail{color:var(--red)} .tui-tool .st-run{color:var(--dim)}
.tui-tool-b{margin:2px 0 6px 8px;padding-left:8px;border-left:var(--bdw) solid var(--bd)}
.tui-tool-b .h{font-size:9.5px;font-weight:900;letter-spacing:.6px}
.tui-tool-b pre{margin:2px 0 6px;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:10.5px;color:#c9c9c4;max-height:24vh;overflow:auto;background:var(--inset);border-radius:6px;padding:5px 7px}
.tui-mark{color:var(--pink);font-weight:800;font-size:11px}
.tui-body{white-space:pre-wrap;word-break:break-word;margin:2px 0 8px}
.tui-b{color:var(--pink);font-weight:800}
.tui-c{font-family:var(--mono);font-size:11px;background:#2b2b33;color:var(--green);border-radius:3px;padding:0 4px}
/* 会话 tab 条 */
.sessbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:var(--bdw) solid var(--bd);background:var(--bg);flex-wrap:wrap}
.sess{display:flex;align-items:center;gap:5px;padding:2px 8px;border:var(--bdw) solid var(--bd);border-radius:8px;font-size:11px;font-weight:700;color:var(--dim);cursor:pointer}
.sess.on{background:var(--pink-s);border-color:var(--pink);color:var(--pink)}
.sess .x{color:var(--dim);font-weight:900;padding:0 2px}
.sess .x:hover{color:var(--red)}
.sessbar .mini{font-size:10.5px;padding:2px 7px}
.histpop{position:absolute;right:8px;top:74px;width:min(320px,92%);background:var(--paper);border:var(--bdw) solid var(--bd);border-radius:10px;box-shadow:var(--sh-lg);padding:6px;z-index:5}
.histpop .h{font-size:10px;font-weight:900;color:var(--dim);letter-spacing:.6px;padding:4px 8px}
.histitem{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;font-size:11.5px;cursor:pointer}
.histitem:hover{background:var(--purple-s)}
.histitem .dim{margin-left:auto;font-size:10px}
.composer{display:flex;gap:6px;padding:8px;border-top:var(--bdw) solid var(--bd);background:var(--idle)}
.composer input{flex:1;height:32px;padding:0 10px;font-size:12px}
.composer .send{background:var(--pink);color:var(--bg);font-weight:800;border-radius:8px;padding:0 14px;height:32px}
.composer .send:hover{filter:brightness(1.1)}
/* 树 */
.tree details{margin-bottom:6px} .tree summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";color:var(--dim);font-size:10px;transition:transform .12s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree .glabel{font-size:10px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.tree .gcount{margin-left:auto;font-size:9.5px;color:var(--dim)}
.tree .titem{display:flex;gap:6px;align-items:center;width:100%;text-align:left;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700;color:var(--ink)}
.tree .titem:hover{background:var(--purple-s)}
.tree .titem.sel{background:var(--pink-s);color:var(--pink)}
.tree .titem .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.tree .titem .dot.drift{background:var(--amber)}
.tree .ten{padding-left:14px}
/* 浮条切换器（技能制式：底部居中高对比胶囊） */
#switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#000;border:2px solid var(--pink);border-radius:999px;padding:4px 6px;z-index:99;box-shadow:var(--sh-lg);font-weight:800;font-size:12px}
#switcher button{border-radius:999px;padding:3px 10px;color:var(--pink)}
#switcher button:hover{background:var(--pink-s)}
#swName{color:var(--ink);padding:0 6px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
#swIdx{color:var(--dim);font-size:10px}
/* 设计说明条 */
.note{background:var(--yellow-s);border-bottom:var(--bdw) solid var(--yellow);color:#e8d9a8;font-size:11.5px;padding:6px 12px;display:flex;gap:10px;align-items:flex-start}
.note b{color:var(--yellow)} .note .x{margin-left:auto;color:var(--dim);cursor:pointer}
/* 状态角标 */
#statebox{position:fixed;right:10px;bottom:14px;z-index:98;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#statebox .t{background:#000;border:1px solid var(--bd);color:var(--dim);border-radius:8px;padding:2px 8px;font-size:10px;font-family:var(--mono);cursor:pointer}
#statebox pre{display:none;background:#000;border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:10px;color:var(--cyan);max-width:340px;margin:0}
#statebox.open pre{display:block}
/* toast */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--paper);border:var(--bdw) solid var(--cyan);color:var(--cyan);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;z-index:100;display:none;box-shadow:var(--sh)}
/* 命令条 Ctrl+K */
#palette{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:97;display:none;justify-content:center;padding-top:14vh}
#palette.open{display:flex}
#palette .box{width:min(560px,90vw);background:var(--paper);border:var(--bdw) solid var(--bd);border-radius:12px;box-shadow:var(--sh-lg);overflow:hidden;height:fit-content}
#palette input{width:100%;border:none;border-bottom:var(--bdw) solid var(--bd);border-radius:0;padding:12px 14px;font-size:14px}
#palette .hits{max-height:44vh;overflow:auto;padding:4px}
#palette .hit{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
#palette .hit:hover,#palette .hit.cur{background:var(--purple-s)}
#palette .hit .sum{color:var(--dim);font-size:11px;margin-left:auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--dim);background:var(--inset)}

/* ══════════ v0 现状复现 ══════════ */
.v0-bar{display:flex;flex-wrap:wrap;gap:0 18px;padding:6px 16px;border-bottom:var(--bdw) solid var(--bd);background:var(--paper);font-size:11px;font-weight:700;color:var(--dim)}
.v0-tools{display:flex;gap:8px;align-items:center;padding:7px 14px;border-bottom:var(--bdw) solid var(--bd);background:var(--idle)}
.v0-search{flex:1;text-align:left;height:32px;padding:0 12px;font-size:11.5px;font-weight:700;color:var(--dim);background:var(--inset);border:var(--bdw) solid var(--bd);border-radius:8px}
.v0-search:hover{color:var(--ink);background:var(--purple-s)}
.v0-main{flex:1;min-height:0}
.v0-chat{display:flex;flex-direction:column;min-height:0;border-right:var(--bdw) solid var(--bd);background:var(--idle)}
.v0-chat .hd{display:flex;gap:8px;align-items:center;padding:5px 10px;border-bottom:var(--bdw) solid var(--bd);background:var(--bg);font-size:11px;font-weight:800}
.v0-side{min-height:0;overflow-y:auto;border-right:var(--bdw) solid var(--bd);background:var(--idle);padding:8px}
.v0-view{min-height:0;overflow-y:auto;background:var(--bg)}
.tr{flex:1;min-height:0;overflow-y:auto;padding:8px 10px}
.v0-followflash{background:var(--yellow-s);border-bottom:var(--bdw) solid var(--yellow);color:var(--yellow);font-size:10.5px;font-weight:800;padding:2px 12px;display:flex;gap:8px}
.page{padding:22px 26px;max-width:980px}
.page h1{font-size:22px;margin:0 0 6px;font-weight:900}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.footsec{margin-top:22px;border-top:var(--bdw) solid var(--bd);padding-top:8px}
.footsec summary{cursor:pointer;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
.logline{display:flex;gap:10px;padding:4px 6px;border-radius:6px;font-size:12px;font-family:var(--mono)}
.logline:hover{background:var(--idle)}
.logline .op{font-weight:800;color:var(--cyan);width:70px;flex:none}
.rawrow{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:12px}
.rawrow:hover{background:var(--idle)}
.rawrow .p{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orphan{color:var(--amber);background:var(--amber-s);border-radius:5px;padding:0 6px;font-size:9.5px;font-weight:800;white-space:nowrap}

/* ══════════ vA wiki 主场 + 抽屉 ══════════ */
.va-hd{display:flex;gap:10px;align-items:center;padding:0 14px;height:46px;border-bottom:var(--bdw) solid var(--bd);background:var(--paper);flex:none}
.va-brand{font-weight:900;display:flex;gap:7px;align-items:center}
.va-search{width:300px;height:28px;padding:0 10px;font-size:12px;color:var(--dim)}
.va-hpill{display:flex;gap:7px;align-items:center;margin-left:auto;font-size:11px;font-weight:800;color:var(--dim)}
.va-score{color:var(--amber)} .va-fb{background:var(--amber-s);color:var(--amber);border-radius:6px;padding:0 7px}
.va-body{flex:1;display:grid;grid-template-columns:250px 1fr;min-height:0}
.va-side{overflow-y:auto;border-right:var(--bdw) solid var(--bd);background:var(--idle);padding:10px 8px}
.va-stage{overflow-y:auto;min-height:0;display:flex}
.va-art{flex:1;max-width:780px;margin:0 auto;padding:26px 34px 60px}
.va-crumb{font-size:11px;color:var(--dim);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.va-crumb b{color:var(--pink)}
.va-rail{width:210px;flex:none;border-left:var(--bdw) solid var(--bd);padding:22px 14px;position:sticky;top:0;align-self:flex-start;font-size:11.5px}
.va-rail .rt{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:14px 0 6px}
.va-rail a{display:block;color:var(--dim);text-decoration:none;padding:2px 6px;border-radius:5px;border-left:2px solid var(--bd);margin:2px 0}
.va-rail a:hover{color:var(--ink);border-left-color:var(--pink)}
.va-drawer{position:fixed;top:0;right:0;bottom:0;width:var(--dw,560px);max-width:94vw;background:var(--idle);border-left:var(--bdw) solid var(--bd);box-shadow:var(--sh-lg);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:90}
.va-drawer.open{transform:none}
.va-dres{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:3}
.va-dres:hover,.va-dres.act{background:rgba(255,133,92,.4)}
.va-dhd{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:var(--bdw) solid var(--bd);font-weight:800;font-size:12px}
.va-dhd .x{margin-left:auto;color:var(--dim);padding:2px 8px;border-radius:6px}
.va-dhd .x:hover{color:var(--ink);background:var(--purple-s)}
.va-follow{display:flex;gap:8px;align-items:center;background:var(--green-s);border:var(--bdw) solid var(--green);color:var(--green);border-radius:999px;padding:3px 12px;font-size:11px;font-weight:800;cursor:pointer}
.va-follow:hover{filter:brightness(1.15)}
.va-chatbtn.on{background:var(--green-s);color:var(--green);border-color:var(--green)}

/* ══════════ vB 页签制（Wikipedia Talk） ══════════ */
.vb-top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:var(--bdw) solid var(--bd);background:var(--paper);flex:none}
.vb-logo{font-family:Georgia,"STZhongsong",serif;font-size:19px;font-weight:700}
.vb-logo small{display:block;font-family:inherit;font-size:9px;letter-spacing:2px;color:var(--dim);font-weight:400}
.vb-searchbox{flex:1;max-width:520px;margin:0 auto}
.vb-searchbox input{width:100%;height:32px;padding:0 14px;border-radius:999px;font-size:12.5px}
.vb-wrap{flex:1;display:grid;grid-template-columns:200px 1fr;min-height:0}
.vb-nav{overflow-y:auto;border-right:var(--bdw) solid var(--bd);background:var(--bg);padding:10px 8px;font-size:12px}
.vb-article{overflow-y:auto;min-height:0;padding:20px 34px 60px;max-width:860px}
.vb-h1{font-size:23px;font-weight:400;font-family:Georgia,serif;border-bottom:var(--bdw) solid var(--bd);padding-bottom:6px;margin:0 0 2px}
.vb-tabs{display:flex;gap:2px;margin:12px 0 14px;border-bottom:var(--bdw) solid var(--bd)}
.vb-tab{padding:6px 16px;font-size:12.5px;font-weight:700;color:var(--navy);border:var(--bdw) solid transparent;border-bottom:none;border-radius:8px 8px 0 0;position:relative;top:var(--bdw)}
.vb-tab:hover{background:var(--navy-s)}
.vb-tab.on{background:var(--bg);border-color:var(--bd);border-bottom-color:var(--bg);color:var(--ink)}
.vb-tab .n{font-size:9.5px;background:var(--amber-s);color:var(--amber);border-radius:6px;padding:0 5px;margin-left:5px}
.vb-talk{max-width:720px}
.vb-talk .topic{border:var(--bdw) solid var(--bd);border-left:4px solid var(--navy);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--paper)}
.vb-dash{padding:22px 34px}
.vb-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:10px 0 20px}

function chips(p){
  let h = `<span class="chip type">${p.kind||p.type}</span>`;
  (p.aliases||[]).forEach(a=>h+=`<span class="chip">${esc(a)}</span>`);
  h += `<span class="chip ${p.stability==='stable'?'stable':'drift'}">${p.stability}</span>`;
  h += `<span class="chip conf">confidence ${p.conf}</span>`;
  h += `<span class="chip date">编译于 ${p.compiled}</span>`;
  if(p.effect&&p.effect.cited)h+=`<span class="chip date">被引 ${p.effect.cited} · helpful ${p.effect.rate}</span>`;
  return h;
}
function linksRow(p){
  if(!(p.links||[]).length && !(p.sources||[]).length) return '';
  let h='<div class="meta" style="margin-top:4px">';
  (p.links||[]).forEach(l=>h+=`<button class="chip link" data-act="golink" data-t="${esc(l)}">🔗 ${esc(l)}</button>`);
  (p.sources||[]).forEach(s=>h+=`<button class="chip src" data-act="stub" data-m="PROTOTYPE：真面会打开 raw 只读视图 ${esc(s)}">📄 ${esc(s)}</button>`);
  return h+'</div>';
}
function footSecs(p){
  return `<details class="footsec"><summary>🕘 版本历史（git ${p.history.length}）</summary>${p.history.map(x=>`<div class="logline"><span class="op">${x[0].slice(0,7)}</span><span class="dim">${x[1]}</span><span>${esc(x[2])}</span></div>`).join('')||'<p class="dim small">无</p>'}</details>`
   + `<details class="footsec"><summary>↩ 反向链接 ${p.backlinks.length}</summary>${p.backlinks.map(b=>{const q=P[b];return q?`<a class="wl" data-act="goto" data-t="${b}">${esc(q.title)}</a>`:''}).join(' · ')||'<span class="dim small">无</span>'}</details>`;
}
function pageHtml(p, extraCls){
  if(!p) return '<div class="page dim">选择页面查看内容</div>';

    <h1>${esc(p.title)}</h1>

function treeHtml(selAttr){
  let out = GROUPS.map((g,i)=>{
    let items = g.items.map(x=>typeof x==='string'?P[x]:x);
    if(S.v!=='vA') items = items.filter(x=>x.id!=='sys-raw'); // 原料库只进 vA（v0 忠实复现现状，不夹带新私货）
    return `<details ${i<3?'open':''}><summary><span class="glabel">${g.label}</span><span class="gcount">${items.length}</span></summary>
    ${items.map(x=>`<button class="titem ${S.view.kind==='page'&&S.view.id===x.id||x.id==='sys-raw'&&S.view.kind==='rawlib'?'sel':''} ${x.id.startsWith('sys-')?'':'ten'}" data-act="goto" data-t="${x.id}" ${selAttr||''}>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}</span>${x.sub?`<span class="dim" style="font-size:9px">${x.sub}</span>`:`<span class="dot ${x.stability==='stable'?'':'drift'}"></span>`}
    </button>`).join('')}</details>`;
  }).join('');
  if(S.v==='vA'&&S.rawInTree) out += `<details open><summary><span class="glabel">Raw · 原料</span><span class="gcount">${RAW.length}</span></summary>
    ${RAW.map((r,i)=>`<button class="titem ten ${S.view.kind==='rawdoc'&&S.view.i===i?'sel':''}" data-act="raw-open" data-i="${i}"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ORIG[r.origin]} ${esc(r.title)}</span>${r.orphan?'<span class="orphan">孤</span>':''}</button>`).join('')}</details>`;
  return out;
}

function cardHtml(c, ctx){
  const openRef = r=>`<button class="kcref" data-act="${ctx==='v0full'?'v0-full':'goto'}" data-t="${r}">↗ ${P[r]?esc(P[r].title):r}</button>`;
  const bt = c.btns.map(b=>`<button class="pill ${b[1]}" data-act="${b[0]==='撤销'?'stub':(b[0]==='↗'?'':'stub')}" data-m="PROTOTYPE：真面走队列端点（${esc(c.title)} → ${b[0]}）">${b[0]}</button>`).join('');
  return `<div class="kccard"><div class="kt"><span class="kb ${c.kind}">${c.kind}</span>${esc(c.title)}</div>
   <div class="km">${c.meta}</div><div class="krefs">${c.refs.map(r=>r==='@@'?'':openRef(r)).join('')}</div>
   <div class="kcbtns">${ctx==='v0full'?'<button class="pill" data-act="v0-full" data-t="'+c.refs[0]+'">全页（会触发整页重排 · 现状行为）</button>':''}${bt}</div></div>`;
}
function lineHtml(ln, key, ctx){
  if(ln.kind==='card') return cardHtml(ln.card, ctx);
  if(ln.role==='user') return `<div class="tui-user"><span class="chev">❯ </span>${esc(ln.text)}</div>`;
  let h='<div>';
  if(ln.steps&&ln.steps.length){
    const open=S.metaOpen[key];
    h+=`<span class="tui-meta-h" data-act="meta" data-k="${key}">◌ 过程（时间序）· <b>${ln.steps.length} 步</b> ${open?'▾':'▸'}</span>`;
    if(open) h+='<div class="tui-meta-b">'+ln.steps.map((s,si)=>{
      const k2=key+'-'+si;
      if(s[0]==='think') return `<div class="tui-think">◌ ${esc(s[1])}</div>`;
      const [,name,brief,status,inp,res]=s;
      const cls=status==='✓'?'st-ok':status==='✗'?'st-fail':'st-run';
      let t=`<div class="tui-tool"><span class="tw" data-act="tool" data-k="${k2}">${S.toolOpen[k2]?'▾':'▸'} <span class="mono">${esc(name)}</span> ${esc(brief)} <span class="${cls}">[${status}]</span></span>`;
      if(S.toolOpen[k2]) t+=`<div class="tui-tool-b"><div class="h" style="color:var(--cyan)">input · ${esc(name)}</div><pre>${esc(inp||'（无输入）')}</pre>${res?`<div class="h" style="color:var(--green)">result</div><pre>${esc(res)}</pre>`:''}</div>`;
      return t+'</div>';
    }).join('')+'</div>';
  }
  if(ln.text) h+=`<div class="tui-body"><span class="tui-mark">✳ </span>${mdHtml(ln.text)}</div>`;
  else if(ln.steps&&ln.steps.length) h+=`<div class="dim"><span class="tui-mark">✳ </span>（未生成文本回复）</div>`;
  return h+'</div>';
}
function mdHtml(t){ return esc(t).replace(/\*\*([^*\n]+)\*\*/g,'<b class="tui-b">$1</b>').replace(/`([^`\n]+)`/g,'<code class="tui-c">$1</code>'); }
function activeSession(){ return S.sessions.find(x=>x.id===S.active)||S.sessions[0]; }

/* ── 发消息 → 剧本回手（模拟流式落定 + 卡） ── */
function sendChat(target){ // target: 'session' | 'vb:'+pageId | 'vc'
  const inp = document.querySelector(`[data-compose="${target}"]`);
  const text = (inp&&inp.value||'').trim() || '（示例输入）这个页该补充引用纪律';
  if(inp) inp.value='';
  const push = target==='session'||target==='vc'?activeSession().lines:(target.startsWith('vb:')?(S.vbTalk[target.slice(3)]||(S.vbTalk[target.slice(3)]=[])):null);
  if(target==='vc') S.vcPanel=true;
  push.push({role:'user', text});
  const sc = SCRIPT[S.scriptIdx++ % SCRIPT.length];
  const cur = S.view.kind==='page'?P[S.view.id]:null;
  const c = JSON.parse(JSON.stringify(sc.c)); // 深拷贝，refs 指向当前页更戏剧
  if(c.card.refs[0]==='@@') c.card.refs=[cur?cur.id:'e-octo-wiki'];
  setTimeout(()=>{
    push.push({role:'ai', text:sc.text, steps:sc.steps}, Object.assign({}, c, {card:Object.assign({}, c.card, {ts:'刚刚'}), fresh:true}));
    afterChat(target, c.card);
    refreshAll();
  }, 420);
  refreshAll();
}
function afterChat(target, cd){
  const ref = cd.refs[0]; if(!ref||!P[ref]) return;
  if(target==='session' && S.v==='v0' && !S.pinned){ // 现状：右栏被劫持
    S.view={kind:'page', id:ref}; S._followFlash=true;
    toast('现状行为：右栏已自动跳到「'+P[ref].title+'」——你在读的页没了');
  } else if(target==='session' && S.v==='vA'){
    S.vaFollow = ref; toast('抽屉未动 · 中部正文未动：只在头部亮了一枚引用药丸');
  } else if(target.startsWith('vb:')){ /* 天然就在本页讨论流里，无事 */ }
  else if(target==='vc'){ /* 浮层内展示，无事 */ }
  else { S.vaFollow = ref; } // A 抽屉里发消息同样只亮药丸
}

      s.closedAt='刚刚'; S.hist.unshift(s); if(S.active===t)S.active=S.sessions[0].id; refreshAll(); toast('会话「'+s.title+'」已关闭 —— 可在 🗂 历史 重新打开'); }

function openPal(){ $('#palette').classList.add('open'); const i=$('#palInput'); i.value=''; palRender(''); i.focus(); }
function palRender(q){
  const all=Object.values(P).filter(p=>!q||(p.title+p.summary+(p.aliases||[]).join()).toLowerCase().includes(q.toLowerCase()));
  $('#palHits').innerHTML = all.map((p,i)=>`<div class="hit ${i===S.palCur?'cur':''}" data-pid="${p.id}"><span class="chip type" style="padding:0 6px">${p.kind||p.type}</span><b>${esc(p.title)}</b><span class="sum">${esc(p.summary)}</span></div>`).join('')||'<div class="hit dim">无匹配（真面有 FTS5 全文兜底）</div>';
}
$('#palInput').addEventListener('input', e=>{S.palCur=0;palRender(e.target.value);});
$('#palInput').addEventListener('keydown', e=>{
  const hits=[...$('#palHits').querySelectorAll('[data-pid]')];
  if(e.key==='Escape') $('#palette').classList.remove('open');
  if(e.key==='ArrowDown'){S.palCur=Math.min(S.palCur+1,hits.length-1);palRender(e.target.value);}

});
$('#swPrev').onclick=()=>{const i=VARIANTS.findIndex(v=>v.k===S.v);setVariant(VARIANTS[(i+VARIANTS.length-1)%VARIANTS.length].k);};
$('#swNext').onclick=()=>{const i=VARIANTS.findIndex(v=>v.k===S.v);setVariant(VARIANTS[(i+1)%VARIANTS.length].k);};
$('#stToggle').onclick=()=>$('#statebox').classList.toggle('open');

/* ── 抽屉左缘拖宽（420px ~ 94vw） ── */
let drag=null;
document.addEventListener('mousedown', e=>{
  const h=e.target.closest('.va-dres'); if(!h) return;
  drag={x:e.clientX,w:S.dw}; h.classList.add('act'); e.preventDefault();
});
document.addEventListener('mousemove', e=>{
  if(!drag) return;
  S.dw=Math.max(420,Math.min(Math.round(window.innerWidth*0.94), drag.w+(drag.x-e.clientX)));
  const d=document.querySelector('.va-drawer'); if(d) d.style.width=S.dw+'px';
  renderState();
});
document.addEventListener('mouseup', ()=>{ if(!drag) return; drag=null; document.querySelectorAll('.va-dres.act').forEach(x=>x.classList.remove('act')); refreshAll(); });

refreshAll();
</script>
</body>
</html>
