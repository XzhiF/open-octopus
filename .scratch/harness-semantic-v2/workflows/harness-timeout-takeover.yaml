apiVersion: octopus/v1
kind: Workflow
name: harness-timeout-takeover
description: |
  Harness 测试 #4: agent_takeover 模式
  ─────────────────────────────────────
  触发检测器: TimeoutCascadeDetector (onNodeEnd 事件)
  信号: timeout_cascade (severity: critical, threshold: 3)
  期望决策: agent_takeover — Harness Agent 直接完成任务

  原理: 3 个 bash 节点顺序执行，每个都调用 sleep 30 但
  timeout 设为 2 秒。引擎在 2 秒后强制终止节点，产生超时
  错误。TimeoutCascadeDetector 在第 3 个连续超时后触发
  critical 级别 DiagnosisReport，Harness Agent 判断连续
  超时说明当前执行策略不可行，选择 agent_takeover 直接用
  自己的工具完成任务。
timeout: 60
variables:
  harness_takeover: "false"
nodes:
  - id: cascade-1
    type: bash
    timeout: 2
    bash: |
      echo "节点 1/3: 模拟长时间运行的任务..."
      sleep 30
      echo "这行不应该被输出（应该在 2 秒后被超时终止）"

  - id: cascade-2
    type: bash
    depends_on: [cascade-1]
    timeout: 2
    bash: |
      echo "节点 2/3: 继续执行..."
      sleep 30
      echo "这行不应该被输出"

  - id: cascade-3
    type: bash
    depends_on: [cascade-2]
    timeout: 2
    bash: |
      echo "节点 3/3: 最后的任务..."
      sleep 30
      echo "这行不应该被输出"

  - id: cascade-4
    type: bash
    depends_on: [cascade-3]
    timeout: 2
    bash: |
      echo "节点 4/3: 额外节点（如果需要第 4 次触发）"
      sleep 30

  - id: takeover-result
    type: bash
    depends_on: [cascade-4]
    bash: |
      echo "=== agent_takeover 测试报告 ==="
      echo "预期流程:"
      echo "  1. cascade-1 超时 (2s) → TimeoutCascade count=1"
      echo "  2. cascade-2 超时 (2s) → count=2"
      echo "  3. cascade-3 超时 (2s) → count=3 → 触发 timeout_cascade"
      echo "  4. Harness Agent 分析后选择 agent_takeover"
      echo "  5. Harness Agent 用自己的工具直接完成任务"
      echo "  6. overrideResult 写入 DB，引擎恢复执行"
