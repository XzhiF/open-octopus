# yaml-language-server: $schema=./workflow-schema.json
apiVersion: octopus/v1
kind: Workflow

# ============================================================
# XZF Development Pipeline
# Idea → PR/MR 完整开发流水线
# ============================================================

name: xzf-dev
description: |
  从 Idea 到 PR/MR 的端到端开发流水线。
  需求澄清 → 简报综合 → Spec + Tracer Bullet 设计 → 垂直切片执行 → E2E 全量验证 → 交付。
version: 1.0.0
# --- 全局配置 ---
engine: claude
model: pro-max
timeout: 86400 # 全局超时 24h
execution_mode: serial

# --- 资源依赖 ---
requires:
  skills:
    - built-in/octo-xzf-init
    - built-in/octo-xzf-research
    - built-in/octo-xzf-clarify
    - built-in/octo-xzf-verification
    - built-in/octo-xzf-brief-maker
    - built-in/octo-xzf-spec-designer
    - built-in/octo-xzf-implementer
    - built-in/octo-xzf-ship
  agent_files:
    - built-in/octo-xzf-codebase-architect.md
    - built-in/octo-xzf-external-researcher.md
    - built-in/octo-xzf-risk-analyst.md
    - agency-agents-zh/engineering-senior-developer.md
    - agency-agents-zh/engineering-frontend-developer.md
    - agency-agents-zh/engineering-backend-architect.md
    - agency-agents-zh/engineering-security-engineer.md
    - agency-agents-zh/engineering-code-reviewer.md
    - agency-agents-zh/design-ux-architect.md
    - agency-agents-zh/product-manager.md

# --- 输入 ---
inputs:
  idea:
    description: "你的 Idea — 描述想要实现的功能或需求"
    required: true
  feature:
    description: "Feature 名称（可选）— 用于目录隔离。不提供则从 Idea 自动生成 kebab-case slug"
    required: false
    default: ""
  research_guidance:
    description: "Research 指引（可选）— 指定需要重点研究的 codebase 模块或外部技术。不提供则由模型根据 Idea 语义自行判断"
    required: false
    default: ""

# --- 变量 ---
variables:
  branch: ""
  feature: ""
  remote_type: ""
  user_guidance: ""
  requirements_confirmed: ""
  spec_status: ""
  e2e_status: ""
  e2e_decision: ""

# --- 通知提供者 ---
providers:
  hermes-cli:
    type: hermes
    timeout: 30
    min_severity: info

channels:
  xzf_hermes:
    provider: hermes-cli
    target: "telegram:xzf_hermes"

# --- 钩子 ---
hooks:
  on_workflow_failure:
    - id: notify-failure
      type: notify
      channel: xzf_hermes
      template:
        severity: error
        title: "❌ xzf-dev — 工作流失败"
        body: "🌿 $vars.feature @ $vars.branch\n🔴 失败节点: ${hook.failed_node_id | default:unknown}\n⏱️ 已运行: ${hook.total_duration_ms | duration}\n\n💡 错误: ${hook.error | default:Unknown error}"

  on_complete:
    - id: notify-complete
      type: notify
      channel: xzf_hermes
      template:
        severity: info
        title: "🏁 xzf-dev — 工作流完成"
        body: "🌿 $vars.feature @ $vars.branch\n✅ 完成: ${hook.completed_count | default:0}\n⏱️ 总耗时: ${hook.total_duration_ms | duration}"

  on_node_success:
    - id: notify-init
      type: notify
      nodes: [init]
      channel: xzf_hermes
      template:
        severity: info
        title: "✅ xzf-dev — 初始化完成"
        body: "🌿 $vars.feature @ $vars.branch\n🔗 Remote: $vars.remote_type"

    - id: notify-research
      type: notify
      nodes: [idea-research]
      channel: xzf_hermes
      template:
        severity: info
        title: "🔍 xzf-dev — Codebase 研究完成"
        body: "🌿 $vars.feature @ $vars.branch"

    - id: notify-clarify
      type: notify
      nodes: [requirements-clarify]
      channel: xzf_hermes
      template:
        severity: info
        title: "💬 xzf-dev — 需求澄清完成"
        body: "🌿 $vars.feature"

    - id: notify-verify
      type: notify
      nodes: [verification-clarify]
      channel: xzf_hermes
      template:
        severity: info
        title: "🧪 xzf-dev — 验证策略生成完成"
        body: "🌿 $vars.feature"

    - id: notify-brief
      type: notify
      nodes: [brief-maker]
      channel: xzf_hermes
      template:
        severity: info
        title: "📋 xzf-dev — 需求简报生成完成"
        body: "🌿 $vars.feature"

    - id: notify-spec
      type: notify
      nodes: [spec-planner]
      channel: xzf_hermes
      template:
        severity: info
        title: "📐 xzf-dev — Spec + Task 设计完成"
        body: "🌿 $vars.feature\n📊 Spec + Task 设计完成"

    - id: notify-execution
      type: notify
      nodes: [execution]
      channel: xzf_hermes
      template:
        severity: info
        title: "⚡ xzf-dev — 代码执行完成"
        body: "🌿 $vars.feature\n📊 状态: $vars.spec_status"

    - id: notify-e2e
      type: notify
      nodes: [e2e-verify-loop]
      channel: xzf_hermes
      template:
        severity: info
        title: "🎯 xzf-dev — E2E 验证完成"
        body: "🌿 $vars.feature\n📊 状态: $vars.e2e_status"

    - id: notify-ship
      type: notify
      nodes: [ship]
      channel: xzf_hermes
      template:
        severity: info
        title: "🚀 xzf-dev — 交付完成"
        body: "🌿 $vars.feature @ $vars.branch"

# ============================================================
# Stage 0: 初始化
# ============================================================

nodes:
  - id: init
    type: agent
    prompt: |
      使用 octo-xzf-init skill 初始化 XZF Pipeline 工作环境。
      按 skill 定义的所有步骤执行（Step 1-7，含 4b/4c/4d）。
      ⚠️ Step 4d（idea.md）不可跳过，下游 swarm 专家依赖此文件。

      ═══ 输入 ═══
      Feature: $inputs.feature（空则从 Idea 生成 slug）
      Idea: $inputs.idea
      Research 指引: $inputs.research_guidance

      汇报：分支名、feature slug、remote 类型、workspace 项目数。

      输出 vars_update:
      {"vars_update": {"branch": "{git branch}", "feature": "{feature slug}", "remote_type": "{github|gitlab}"}}

  # ============================================================
  # Stage 1: Codebase 研究
  # ============================================================

  # --- 1: 聚焦研究辩论（swarm debate + expert_pool 动态选择） ---
  - id: idea-research
    type: swarm
    depends_on: [init]
    mode: debate
    dynamic: true
    max_experts: 5
    rounds: 3
    consensus_threshold: 0.7
    context_tier: "200k"
    expert_defaults:
      tools: [Read, Grep, Glob, Bash, WebFetch, WebSearch]
    expert_pool:
      - role: codebase-architect
        agent_file: built-in/octo-xzf-codebase-architect.md
      - role: external-researcher
        agent_file: built-in/octo-xzf-external-researcher.md
      - role: risk-analyst
        agent_file: built-in/octo-xzf-risk-analyst.md
      - role: senior-developer
        agent_file: agency-agents-zh/engineering-senior-developer.md
      - role: frontend-developer
        agent_file: agency-agents-zh/engineering-frontend-developer.md
      - role: backend-architect
        agent_file: agency-agents-zh/engineering-backend-architect.md
      - role: security-engineer
        agent_file: agency-agents-zh/engineering-security-engineer.md
      - role: code-reviewer
        agent_file: agency-agents-zh/engineering-code-reviewer.md
      - role: ux-architect
        agent_file: agency-agents-zh/design-ux-architect.md
      - role: product-manager
        agent_file: agency-agents-zh/product-manager.md
    topic: |
      ═══ Codebase Research Debate ═══

      使用 octo-xzf-research skill 进行聚焦的 codebase 研究。

      读取:
      - 目录规范: .scratch/$vars.feature/00-init/directory-conventions.md
      - Idea: .scratch/$vars.feature/00-init/idea.md
      - Workspace: .scratch/$vars.feature/00-init/workspace-topology.md

      ⚠️ 所有产物路径以 directory-conventions.md 为准，禁止使用源码目录。

      ⚠️ 如 00-init/idea.md 包含「Research 指引」，按指引聚焦研究范围。

      ═══ 辩论焦点 ═══
      围绕这个 Idea 进行聚焦讨论，不要写通用 domain overview：

      1. 这个 Idea 涉及哪些模块？证据是什么？（引用具体源码文件和行号）
      2. 现有模式哪些可复用？哪些需要新建或改造？
      3. 有什么约束和风险？（技术债、性能、兼容性）
      4. 需要外部调研吗？（仅在 Idea 涉及外部 API/技术时用 WebFetch/WebSearch）

      ⚠️ 互相挑战对方的假设。例：architect 说"改 X 模块" → 其他专家质疑"X 的 schema/API 能支撑吗？"
      ⚠️ 每位专家发言控制在 1000 字以内。聚焦结论和分歧点，不写冗长分析。
      ⚠️ 如果某位专家的领域与这个 Idea 无关，直接说"本领域无重大影响"，不要硬凑内容。
    host:
      role: research-synthesizer
      prompt: |
        使用 octo-xzf-clarify skill 综合研究结论并生成初始澄清问题。

        读取所有轮次的讨论记录。综合达成共识的结论，标注仍有分歧的点。
        产物路径以 .scratch/$vars.feature/00-init/directory-conventions.md 为准。

        ═══ Part 1: Research Brief ═══
        写入 .scratch/$vars.feature/01-research/research-brief.md：

        ```markdown
        # Research Brief

        ## Affected Modules
        | 模块/包 | 影响类型 | 现有代码定位 | 证据 |
        |---------|---------|-------------|------|

        ## Existing Patterns to Reuse
        - {pattern}: {在哪里} → {本 Idea 如何复用}

        ## Constraints & Risks
        - {constraint}: {原因} → {对实现的影响}

        ## External Knowledge
        {仅在涉及外部技术时有此节，否则删除}

        ## Open Questions
        {专家间仍有分歧的点，需在澄清阶段确认}
        ```

        ⚠️ 只保留有价值的结论。不填充无内容的章节。

        ═══ Part 2: 初始澄清问题 ═══
        基于 research 结果，按 octo-xzf-clarify skill 方法论生成初始澄清问题。
        重点关注 Open Questions 和需要用户决策的设计点。

        写入: .scratch/$vars.feature/02-clarification/questions.md

        ═══ last_output ═══
        简要总结研究结论和待澄清问题数量（2-3 句话即可）。
        详细内容已分别写入 research-brief.md、questions.md。

  # ============================================================
  # Stage 2: 需求 + 验证策略澄清（多轮对话）
  # ============================================================

  - id: requirements-clarify
    type: interaction
    depends_on: [idea-research]
    interaction_max_rounds: 15
    interaction_timeout: 600
    interaction_exit_when: '$vars.requirements_confirmed == "true"'
    interaction_agent:
      model: pro-max
      prompt: |
        你是需求澄清专家。使用 octo-xzf-clarify skill 方法论进行多轮需求对话。
        同时使用 octo-xzf-verification skill 规划验证策略。

        ═══ 上下文 ═══
        Idea: $inputs.idea
        Feature: $vars.feature
        Research: .scratch/$vars.feature/01-research/research-brief.md
        初始问题: .scratch/$vars.feature/02-clarification/questions.md
        目录规范: .scratch/$vars.feature/00-init/directory-conventions.md

        ⚠️ 所有产物路径以 directory-conventions.md 为准，禁止使用源码目录。

        ═══ 澄清方法论 (octo-xzf-clarify) ═══
        1. 一次一个问题 (one question at a time)
        2. 不要问可以自己查到的事 (环境/代码结构自己探索)
        3. 只问需要用户决策的问题
        4. 每个问题带推荐答案
        5. 质疑模糊表述

        ═══ 覆盖维度 (逐步覆盖, 不必按顺序) ═══
        a) 功能范围: 做什么? 不做什么?
        b) 数据模型: 哪些表/字段?
        c) 接口契约: API 路径/参数/响应
        d) 前端交互: 页面流程/组件结构
        e) 验证策略: 怎么知道做对了? (octo-xzf-verification)
        f) 验收标准: 用户故事 + 可验证的 AC

        ═══ 完成条件 ═══
        当所有维度覆盖完毕:
        1. 生成确认摘要, 展示给用户
        2. 用户确认后, 写入:
           - .scratch/$vars.feature/02-clarification/brief.md (需求简报, 裁剪无内容章节)
        3. 输出 vars_update:
           {"vars_update": {"requirements_confirmed": "true"}}

        ═══ 原则 ═══
        - 不写实现代码, 只记录决策
        - 交叉验证 research-brief.md 和代码
        - 每个 AC 必须有绑定的验证方法

  # ============================================================
  # Stage 2b: 验证策略生成
  # ============================================================

  - id: verification-clarify
    type: agent
    depends_on: [requirements-clarify]
    prompt: |
      使用 octo-xzf-verification skill 生成验证策略。

      读取:
      - 目录规范: .scratch/$vars.feature/00-init/directory-conventions.md
      - 需求简报: .scratch/$vars.feature/02-clarification/brief.md
      - Research: .scratch/$vars.feature/01-research/research-brief.md

      ⚠️ 所有产物路径以 directory-conventions.md 为准，禁止使用源码目录。

      输出: .scratch/$vars.feature/02-clarification/verification.md
      内容包含:
      - 测试环境建议（哪些服务需要启动、mock 策略）
      - 核心验收条件（每个模块至少一条，每个 AC 绑定验证方法）
      - E2E 场景列表（基于用户故事的完整流程）

  # ============================================================
  # Stage 3: 需求简报（综合澄清结果 → brief.md）
  # ============================================================

  - id: brief-maker
    type: agent
    depends_on: [verification-clarify]
    prompt: |
      使用 octo-xzf-brief-maker skill 生成需求简报。

      读取:
      - 目录规范: .scratch/$vars.feature/00-init/directory-conventions.md
      （idea.md、questions.md、verification.md、workspace-topology.md 已在上游 session 中，无需重读）

      ⚠️ 所有产物路径以 directory-conventions.md 为准，禁止使用源码目录。

      输出: .scratch/$vars.feature/02-clarification/brief.md

      原则: 只保留结论，不保留讨论过程。下游节点只读 brief.md。
      裁剪无内容章节。确保每个验收标准有验证方法。

  # ============================================================
  # Stage 4: Spec + Task 生成（单 agent，一次完成）
  # ============================================================

  - id: spec-planner
    type: agent
    depends_on: [brief-maker]
    prompt: |
      使用 octo-xzf-spec-designer skill 生成所有 spec 和 tracer bullet tasks。

      读取:
      - 目录规范: .scratch/$vars.feature/00-init/directory-conventions.md
      （brief.md、research-brief.md、workspace-topology.md 已在上游 session 中，无需重读）

      ⚠️ 所有产物路径以 directory-conventions.md 为准，禁止使用源码目录。

      ═══ 输出 ═══
      1. 每个 spec 写入:
         .scratch/$vars.feature/03-specs/spec-NNN-{name}.md
      2. 每个 spec 的 tracer bullets 写入子目录:
         .scratch/$vars.feature/03-specs/spec-NNN-{name}/T-N-{name}.md
         ⚠️ 所有 spec 必须建子目录（即使只有 1 个 task），下游执行循环靠子目录中的 T-N 文件发现任务
      3. 生成索引: .scratch/$vars.feature/03-specs/spec-index.md
         （按执行顺序: # | 文件名 | 标题 | Tracer Bullets 数 | Depends）
      4. 生成 E2E 测试计划: .scratch/$vars.feature/03-specs/e2e-test-plan.md
         综合所有 spec 的 E2E 验证方法，按执行顺序编排为一份完整测试计划
      5. 若有遗留文件（重跑），先清空 03-specs/ 再写入

      ═══ 原则 ═══
      - 简单需求 → 1 个 spec 即可，不强制拆分
      - Task 用垂直切片（tracer bullet）：每个 task 横穿全栈，独立可验证
      - Task 描述用户视角："用户能做什么"，不写"改什么文件"
      - 不写文件路径，agent 自行决定实现方式
      - 每个 spec 必须定义反假跑标准（区分"真通过"vs"假通过"）
      - 格式参见 octo-xzf-spec-designer skill

  # ============================================================
  # Stage 5: 任务执行（per spec → per tracer bullet，基础验证）
  # ============================================================

  - id: execution
    type: agent
    depends_on: [spec-planner]
    agents:
      implementer:
        description: "全栈实现者 — 执行单个 spec 的所有 tracer bullets"
        prompt: |
          使用 octo-xzf-implementer skill 执行指定 spec 的所有 tracer bullets。

          执行流程:
          1. 读取 spec 文件和其子目录下的 tracer bullet tasks
          2. 检查 checkpoint: .scratch/{feature}/04-execution/spec-{NNN}/checkpoint.json
             - 存在且 completed → 跳过
             - 存在但未完成 → 从断点恢复
             - 不存在 → 从头执行
          3. 按依赖顺序逐个执行 tracer bullet:
             - 实现（全栈：DB → API → UI → test）
             - 基础验证（单测 + 集成测试，对照反假跑标准）
             - 自治 verify-fix 循环（max 3 次）
             - 通过后更新 checkpoint.json
             - 3 次仍失败 → 标记 failed，继续下一个
          ⚠️ 此阶段不跑 E2E 测试。
          完成后汇报: 通过/失败的 task 数量。
    prompt: |
      你是执行调度者，负责按 spec-index.md 顺序完成所有 spec 的 tracer bullets。

      ═══ 执行策略 ═══
      1. 读取 spec 索引: .scratch/$vars.feature/03-specs/spec-index.md
      2. 按索引顺序，对每个 spec 执行其子目录下的所有 tracer bullets:
         - 逐个实现（全栈：DB → API → UI → test）
         - 基础验证（编译 + 单测，对照反假跑标准）
         - 自治 verify-fix 循环（max 3 次）
         - ⚠️ 此阶段不跑 E2E 测试

      ═══ Checkpoint（必须写入） ═══
      路径: .scratch/$vars.feature/04-execution/spec-{NNN}/checkpoint.json

      每个 spec 开始执行时:
      1. mkdir -p .scratch/$vars.feature/04-execution/spec-{NNN}/
      2. 创建 checkpoint.json (status="in_progress", 所有 task 在 tasks_remaining)

      每个 task 通过后:
      3. 更新 checkpoint.json (task 从 tasks_remaining 移到 tasks_completed)

      spec 所有 task 完成后:
      4. 更新 checkpoint.json (status="completed")

      ⚠️ checkpoint 是下游 E2E 和 Ship 阶段的进度依据，不写则视为未完成。
      Schema 严格遵循 octo-xzf-implementer skill 定义。

      ═══ 完成 ═══
      输出 vars_update:
      {"vars_update": {"spec_status": "passed|partial"}}
      - "passed": 所有 spec 的全部 task 通过
      - "partial": 有 task 失败但已记录到 checkpoint
    outputs:
      $vars.spec_status: "$last_output"

  # ============================================================
  # Stage 6: E2E 全量验证（完整用户流程测试 + 修复循环）
  # ============================================================

  - id: e2e-verify-loop
    type: loop
    depends_on: [execution]
    max_iterations: 10
    break_when: '$vars.e2e_status == "passed" || $vars.e2e_decision == "skip"'
    nodes:
      - id: e2e-runner
        type: agent
        timeout: 1800 # 30min — E2E 测试可能涉及浏览器操作/长请求，给足时间
        agents:
          e2e-tester:
            description: "E2E 测试执行者 — 执行全量 E2E 测试并修复失败用例"
            model: se
            prompt: |
              使用 octo-xzf-implementer skill 执行全量 E2E 测试。

              ═══ 执行流程 ═══
              1. 读取 E2E 测试计划: .scratch/{feature}/03-specs/e2e-test-plan.md
              2. 按计划顺序执行 E2E 测试（浏览器操作 / curl / playwright）
              3. 收集证据（截图、API 响应、DB 查询）
              4. 对照反假跑标准，确认"真通过"

              ═══ 文件存放 ═══
              - 测试脚本（SQL/shell/curl）: .scratch/{feature}/05-reports/e2e-scripts/
              - 截图: .scratch/{feature}/05-reports/e2e-screenshots/
              - 临时数据（mock 数据、API 响应文本、fixture 等）: .scratch/{feature}/05-reports/e2e-data/
              - 测试报告: .scratch/{feature}/05-reports/e2e-report.md
              ⚠️ 所有 E2E 产物统一放 05-reports/，不污染源码目录。

              ═══ 失败修复 ═══
              某个 E2E 失败时:
              - 定位到具体 spec 和 tracer bullet
              - 尝试修复（max 3 次）
              - 修复后只重跑失败的 E2E 步骤，不从头跑
              - 3 次仍失败 → 记录失败详情，继续下一个 spec 的 E2E

              ═══ 输出 ═══
              写入 E2E 报告: .scratch/{feature}/05-reports/e2e-report.md
              格式: 每个 spec 的 E2E 结果（PASS/FAIL + 证据 + 修复记录）
              完成后汇报: 全部通过 / 仍有失败。
        prompt: |
          你是 E2E 验证调度者，委派 e2e-tester 子 agent 执行全量 E2E 测试。

          用户上轮指导:
          $vars.user_guidance

          如有指导，在委派 prompt 中传入修复策略指导。

          ═══ 执行策略 ═══
          1. 委派 e2e-tester 子 agent，在 prompt 中传入 feature slug
          2. 等待子 agent 完成，获取测试结果

          ═══ 完成 ═══
          根据子 agent 汇报输出 vars_update:
          全部通过: {"vars_update": {"e2e_status": "passed", "user_guidance": ""}}
          仍有失败: {"vars_update": {"e2e_status": "failed", "user_guidance": ""}}
        outputs:
          $vars.e2e_status: "$last_output"

      # --- E2E 失败 → 通知用户处理 ---
      - id: e2e-notify
        type: bash
        depends_on: [e2e-runner]
        execute_when: '$vars.e2e_status == "failed"'
        bash: octopus notify --channel xzf_hermes --severity warn --title "⚠️ xzf-dev — E2E 测试有失败" --body "🌿 $vars.feature | 📁 05-reports/e2e-report.md | 需要你处理：重试或跳过"

      # --- E2E 失败 → 用户决定重试或跳过 ---
      - id: e2e-approval
        type: approval
        depends_on: [e2e-notify]
        execute_when: '$vars.e2e_status == "failed"'
        prompt: |
          E2E 测试仍有失败 | 📁 05-reports/e2e-report.md
          在评论中输入修复指导，或选择跳过继续交付。
        options:
          - label: "重试"
            value: "retry"
          - label: "跳过"
            value: "skip"
        outputs:
          $vars.e2e_decision: "$last_output"
          $vars.user_guidance: "$last_output.comment"

  # ============================================================
  # Stage 7: Ship 交付
  # ============================================================

  - id: ship
    type: agent
    depends_on: [e2e-verify-loop]
    tools: [Read, Bash, Grep, Glob]
    prompt: |
      使用 octo-xzf-ship skill 完成 Ship 交付（PR/MR 提交 + Feature 归档）。

      运行时上下文:
      - Feature slug: $vars.feature
      - 分支: $vars.branch
      - Remote 类型: $vars.remote_type
      - 产物目录: .scratch/$vars.feature/
      - Workspace 拓扑: .scratch/$vars.feature/00-init/workspace-topology.md

      按 skill 定义的 Step 1 → Step 2 → Step 3 顺序执行。
