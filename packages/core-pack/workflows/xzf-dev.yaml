# yaml-language-server: $schema=./workflow-schema.json
apiVersion: octopus/v1
kind: Workflow

# ============================================================
# XZF Development Pipeline
# Idea → PR/MR 完整开发流水线
# ============================================================

name: xzf-dev
description: |
  从 Idea 到 PR/MR 的端到端开发流水线。
  需求澄清 → 简报综合 → Spec + Tracer Bullet 设计 → 垂直切片执行 → E2E 全量验证 → 交付。
version: 1.0.0
# --- 全局配置 ---
engine: claude
model: pro-max
timeout: 86400 # 全局超时 24h
execution_mode: serial

# --- 资源依赖 ---
requires:
  skills:
    - built-in/octo-xzf-init
    - built-in/octo-xzf-research
    - built-in/octo-xzf-clarify
    - built-in/octo-xzf-verification
    - built-in/octo-xzf-brief-maker
    - built-in/octo-xzf-spec-designer
    - built-in/octo-xzf-implementer
    - built-in/octo-xzf-ship
    - built-in/octo-xzf-story-walker
  agent_files:
    - built-in/octo-xzf-codebase-architect.md
    - built-in/octo-xzf-external-researcher.md
    - built-in/octo-xzf-risk-analyst.md
    - agency-agents-zh/engineering-senior-developer.md
    - agency-agents-zh/engineering-frontend-developer.md
    - agency-agents-zh/engineering-backend-architect.md
    - agency-agents-zh/engineering-security-engineer.md
    - agency-agents-zh/engineering-code-reviewer.md
    - agency-agents-zh/design-ux-architect.md
    - agency-agents-zh/product-manager.md

# --- 输入 ---
inputs:
  idea:
    description: "你的 Idea — 描述想要实现的功能或需求"
    required: true
  feature:
    description: "Feature 名称（可选）— 用于目录隔离。不提供则从 Idea 自动生成 kebab-case slug"
    required: false
    default: ""
  research_guidance:
    description: "Research 指引（可选）— 指定需要重点研究的 codebase 模块或外部技术。不提供则由模型根据 Idea 语义自行判断"
    required: false
    default: ""

# --- 变量 ---
variables:
  branch: ""
  feature: ""
  remote_type: ""
  requirements_confirmed: ""
  verification_confirmed: ""
  spec_status: ""
  e2e_status: ""
  current_spec: "0"
  spec_count: "0"
  current_spec_file: ""
  current_spec_tasks: ""
  current_spec_done: ""

# --- 通知提供者 ---
providers:
  hermes-cli:
    type: hermes
    timeout: 30
    min_severity: info

channels:
  xzf_hermes:
    provider: hermes-cli
    target: "telegram:xzf_hermes"

# --- 钩子 ---
hooks:
  on_workflow_failure:
    - id: notify-failure
      type: notify
      channel: xzf_hermes
      template:
        severity: error
        title: "❌ xzf-dev — 工作流失败"
        body: "🌿 $vars.feature @ $vars.branch\n🔴 失败节点: ${hook.failed_node_id | default:unknown}\n⏱️ 已运行: ${hook.total_duration_ms | duration}\n\n💡 错误: ${hook.error | default:Unknown error}"

  on_complete:
    - id: notify-complete
      type: notify
      channel: xzf_hermes
      template:
        severity: info
        title: "🏁 xzf-dev — 工作流完成"
        body: "🌿 $vars.feature @ $vars.branch\n✅ 完成: ${hook.completed_count | default:0}\n⏱️ 总耗时: ${hook.total_duration_ms | duration}"

  on_node_success:
    - id: notify-init
      type: notify
      nodes: [init]
      channel: xzf_hermes
      template:
        severity: info
        title: "✅ xzf-dev — 初始化完成"
        body: "🌿 $vars.feature @ $vars.branch\n🔗 Remote: $vars.remote_type"

    - id: notify-research
      type: notify
      nodes: [idea-research]
      channel: xzf_hermes
      template:
        severity: info
        title: "🔍 xzf-dev — Codebase 研究完成"
        body: "🌿 $vars.feature @ $vars.branch"

    - id: notify-clarify
      type: notify
      nodes: [requirements-clarify]
      channel: xzf_hermes
      template:
        severity: info
        title: "💬 xzf-dev — 需求澄清完成"
        body: "🌿 $vars.feature"

    - id: notify-verify
      type: notify
      nodes: [verification-clarify]
      channel: xzf_hermes
      template:
        severity: info
        title: "🧪 xzf-dev — 验证策略生成完成"
        body: "🌿 $vars.feature"

    - id: notify-brief
      type: notify
      nodes: [brief-maker]
      channel: xzf_hermes
      template:
        severity: info
        title: "📋 xzf-dev — 需求简报生成完成"
        body: "🌿 $vars.feature"

    - id: notify-spec
      type: notify
      nodes: [spec-planner]
      channel: xzf_hermes
      template:
        severity: info
        title: "📐 xzf-dev — Spec + Task 设计完成"
        body: "🌿 $vars.feature\n📊 Spec + Task 设计完成"

    - id: notify-execution
      type: notify
      nodes: [execution]
      channel: xzf_hermes
      template:
        severity: info
        title: "⚡ xzf-dev — 代码执行完成"
        body: "🌿 $vars.feature\n📊 状态: $vars.spec_status"

    - id: notify-e2e
      type: notify
      nodes: [e2e-verify]
      channel: xzf_hermes
      template:
        severity: info
        title: "🎯 xzf-dev — E2E 验证完成"
        body: "🌿 $vars.feature\n📊 状态: $vars.e2e_status"

    - id: notify-ship
      type: notify
      nodes: [ship]
      channel: xzf_hermes
      template:
        severity: info
        title: "🚀 xzf-dev — 交付完成"
        body: "🌿 $vars.feature @ $vars.branch"

# ============================================================
# Stage 0: 初始化
# ============================================================

nodes:
  - id: init
    type: agent
    prompt: |
      使用 octo-xzf-init skill 初始化 XZF Pipeline 工作环境。
      按 skill 定义的所有步骤执行（Step 1-7，含 4b/4c/4d）。
      ⚠️ Step 4d（idea.md）不可跳过，下游 swarm 专家依赖此文件。

      ═══ 输入 ═══
      Feature: $inputs.feature（空则从 Idea 生成 slug）
      Idea: $inputs.idea
      Research 指引: $inputs.research_guidance

      汇报：分支名、feature slug、remote 类型、workspace 项目数。

      输出 vars_update:
      {"vars_update": {"branch": "{git branch}", "feature": "{feature slug}", "remote_type": "{github|gitlab}"}}

  # ============================================================
  # Stage 1: Codebase 研究
  # ============================================================

  # --- 1: 聚焦研究辩论（swarm debate + expert_pool 动态选择） ---
  - id: idea-research
    type: swarm
    depends_on: [init]
    mode: debate
    dynamic: true
    max_experts: 5
    rounds: 3
    consensus_threshold: 0.7
    context_tier: "200k"
    expert_defaults:
      tools: [Read, Grep, Glob, Bash, WebFetch, WebSearch]
    expert_pool:
      - role: codebase-architect
        agent_file: built-in/octo-xzf-codebase-architect.md
      - role: external-researcher
        agent_file: built-in/octo-xzf-external-researcher.md
      - role: risk-analyst
        agent_file: built-in/octo-xzf-risk-analyst.md
      - role: senior-developer
        agent_file: agency-agents-zh/engineering-senior-developer.md
      - role: frontend-developer
        agent_file: agency-agents-zh/engineering-frontend-developer.md
      - role: backend-architect
        agent_file: agency-agents-zh/engineering-backend-architect.md
      - role: security-engineer
        agent_file: agency-agents-zh/engineering-security-engineer.md
      - role: code-reviewer
        agent_file: agency-agents-zh/engineering-code-reviewer.md
      - role: ux-architect
        agent_file: agency-agents-zh/design-ux-architect.md
      - role: product-manager
        agent_file: agency-agents-zh/product-manager.md
    topic: |
      ═══ Codebase Research Debate ═══

      使用 octo-xzf-research skill 进行聚焦的 codebase 研究。

      读取:
      - 目录规范: .scratch/$vars.feature/00-init/directory-conventions.md
      - Idea: .scratch/$vars.feature/00-init/idea.md
      - Workspace: .scratch/$vars.feature/00-init/workspace-topology.md

      ⚠️ 所有产物路径以 directory-conventions.md 为准，禁止使用源码目录。

      ⚠️ 如 00-init/idea.md 包含「Research 指引」，按指引聚焦研究范围。

      ═══ 辩论焦点 ═══
      围绕这个 Idea 进行聚焦讨论，不要写通用 domain overview：

      1. 这个 Idea 涉及哪些模块？证据是什么？（引用具体源码文件和行号）
      2. 现有模式哪些可复用？哪些需要新建或改造？
      3. 有什么约束和风险？（技术债、性能、兼容性）
      4. 需要外部调研吗？（仅在 Idea 涉及外部 API/技术时用 WebFetch/WebSearch）

      ⚠️ 互相挑战对方的假设。例：architect 说"改 X 模块" → 其他专家质疑"X 的 schema/API 能支撑吗？"
      ⚠️ 每位专家发言控制在 1000 字以内。聚焦结论和分歧点，不写冗长分析。
      ⚠️ 如果某位专家的领域与这个 Idea 无关，直接说"本领域无重大影响"，不要硬凑内容。
    host:
      role: research-synthesizer
      prompt: |
        使用 octo-xzf-clarify skill 综合研究结论并生成初始澄清问题。

        读取所有轮次的讨论记录。综合达成共识的结论，标注仍有分歧的点。
        产物路径以 .scratch/$vars.feature/00-init/directory-conventions.md 为准。

        ═══ Part 1: Research Brief ═══
        写入 .scratch/$vars.feature/01-research/research-brief.md：

        ```markdown
        # Research Brief

        ## Affected Modules
        | 模块/包 | 影响类型 | 现有代码定位 | 证据 |
        |---------|---------|-------------|------|

        ## Existing Patterns to Reuse
        - {pattern}: {在哪里} → {本 Idea 如何复用}

        ## Constraints & Risks
        - {constraint}: {原因} → {对实现的影响}

        ## External Knowledge
        {仅在涉及外部技术时有此节，否则删除}

        ## Open Questions
        {专家间仍有分歧的点，需在澄清阶段确认}
        ```

        ⚠️ 只保留有价值的结论。不填充无内容的章节。

        ═══ Part 2: 初始澄清问题 ═══
        基于 research 结果，按 octo-xzf-clarify skill 方法论生成初始澄清问题。
        重点关注 Open Questions 和需要用户决策的设计点。

        写入: .scratch/$vars.feature/02-clarification/questions.md

        ═══ last_output ═══
        简要总结研究结论和待澄清问题数量（2-3 句话即可）。
        详细内容已分别写入 research-brief.md、questions.md。

  # ============================================================
  # Stage 2: 需求 + 验证策略澄清（多轮对话）
  # ============================================================

  - id: requirements-clarify
    type: interaction
    depends_on: [idea-research]
    interaction_max_rounds: 15
    interaction_timeout: 600
    interaction_exit_when: '$vars.requirements_confirmed == "true"'
    interaction_agent:
      model: pro-max
      prompt: |
        你是需求澄清专家。使用 octo-xzf-clarify skill 方法论进行多轮需求对话。

        ═══ 上下文 ═══
        你已继承上游研究阶段的会话上下文（research-brief.md、questions.md 已在会话中）。
        目录规范: .scratch/$vars.feature/00-init/directory-conventions.md
        Feature: $vars.feature

        ⚠️ 所有产物路径以 directory-conventions.md 为准，禁止使用源码目录。

        ═══ 澄清方法论 (octo-xzf-clarify) ═══
        1. 一次一个问题 (one question at a time)
        2. 不要问可以自己查到的事 (环境/代码结构自己探索)
        3. 只问需要用户决策的问题
        4. 每个问题带推荐答案
        5. 质疑模糊表述

        ═══ 覆盖维度 (逐步覆盖, 不必按顺序) ═══
        a) 功能范围: 做什么? 不做什么?
        b) 数据模型: 哪些表/字段?
        c) 接口契约: API 路径/参数/响应
        d) 前端交互: 页面流程/组件结构
        e) 验证策略: 怎么知道做对了? (octo-xzf-verification)
        f) 验收标准: 用户故事 + 可验证的 AC

        ═══ 故事完整性 Walk-Through（刨根问底）═══
        覆盖维度后，用 octo-xzf-story-walker skill（requirement 模式）trace 1-3 核心故事
        穿过已决策的接口/存储/UI，找决策缺口（孤儿字段/魔术桥/静默失败/缺触发器/断反馈）。
        缺口转为待澄清问题（方案 A/B/C + 推荐），刨根问底问清每个需求点。
        目标：存储/接口/UI-UX/设计/决策全闭环，故事端到端走通。

        ═══ 完成条件 ═══
        当所有维度覆盖完毕:
        1. 生成确认摘要, 展示给用户
        2. 用户确认后, 写入:
           - .scratch/$vars.feature/02-clarification/brief.md (需求简报, 裁剪无内容章节)
        3. 输出 vars_update:
           {"vars_update": {"requirements_confirmed": "true"}}

        ═══ 原则 ═══
        - 不写实现代码, 只记录决策
        - 交叉验证 research-brief.md 和代码
        - 每个 AC 必须有绑定的验证方法

  # ============================================================
  # Stage 2b: 验证策略生成
  # ============================================================

  - id: verification-clarify
    type: interaction
    depends_on: [requirements-clarify]
    interaction_max_rounds: 10
    interaction_timeout: 600
    interaction_exit_when: '$vars.verification_confirmed == "true"'
    interaction_agent:
      model: pro-max
      prompt: |
        你是验证策略规划专家。使用 octo-xzf-verification skill 推导验证策略（推导，不是提问）。

        ═══ 上下文 ═══
        继承上游会话（research-brief、brief 澄清对话、questions.md 已确认决策均在会话中）。
        目录规范: .scratch/$vars.feature/00-init/directory-conventions.md
        ⚠️ 产物路径以 directory-conventions.md 为准，禁止源码目录。

        ═══ 多轮流程 (octo-xzf-verification) ═══
        Round 1（verification.md 不存在）:
        1. 决策→验收条件映射（每个 Dx：通过标准 + 反假跑）
        2. E2E 场景设计（用户视角完整场景）
        3. 单测覆盖（模块/文件/case 表）
        4. 测试方法（系统如何测试）：从 topology 推导启动命令/端口/工具/数据/凭据
           — 无法推断且影响执行的 → ❓ Vx 待确认，让用户在评论澄清
        5. 敏感凭据强制澄清 → ❓ Vx [CRITICAL] 待确认项
        写入 .scratch/$vars.feature/02-clarification/verification.md
        输出 Synthesis（待确认 + 推荐验证方案概览：测试环境/验收条件/E2E场景/单测模块）给用户审阅。

        Round 2+（文件已存在）:
        1. 读现有 verification.md
        2. 用户评论补充/修正 → 记录「用户补充」→ 处理 → 移「已确认」
        3. 需追问 → 追加「待确认」
        4. 重新输出 Synthesis

        ═══ 完成条件 ═══
        env_checklist_status:
        - 「待确认」+「用户补充」都清空 → COMPLETE
        - 有未处理项 → INCOMPLETE: {缺失项}

        当 COMPLETE，输出 vars_update:
        {"vars_update": {"verification_confirmed": "true"}}

        ⚠️ 测试环境端口/启动命令错误会杀运行中服务，必须让用户在 Synthesis 审阅。
        ⚠️ 敏感凭据（账号/API Key/Token）agent 无法推断，必须待用户在评论提供。

  # ============================================================
  # Stage 3: 需求简报（综合澄清结果 → brief.md）
  # ============================================================

  - id: brief-maker
    type: agent
    depends_on: [verification-clarify]
    prompt: |
      使用 octo-xzf-brief-maker skill 生成需求简报。

      你已继承上游会话上下文（idea、questions、verification、澄清对话均已在会话中）。
      目录规范: .scratch/$vars.feature/00-init/directory-conventions.md

      ⚠️ 所有产物路径以 directory-conventions.md 为准，禁止使用源码目录。

      输出: .scratch/$vars.feature/02-clarification/brief.md

      原则: 只保留结论，不保留讨论过程。下游节点只读 brief.md。
      裁剪无内容章节。确保每个验收标准有验证方法。

  # ============================================================
  # Stage 4: Spec + Task 生成（单 agent，一次完成）
  # ============================================================

  - id: spec-planner
    type: agent
    depends_on: [brief-maker]
    prompt: |
      使用 octo-xzf-spec-designer skill 生成所有 spec 和 tracer bullet tasks。

      你已继承上游会话上下文（brief.md、research-brief、verification 均已在会话中）。
      目录规范: .scratch/$vars.feature/00-init/directory-conventions.md

      ⚠️ 所有产物路径以 directory-conventions.md 为准，禁止使用源码目录。

      ═══ 输出 ═══
      1. 每个 spec 写入:
         .scratch/$vars.feature/03-specs/spec-NNN-{name}.md
      2. 每个 spec 的 tracer bullets 写入子目录:
         .scratch/$vars.feature/03-specs/spec-NNN-{name}/T-N-{name}.md
         ⚠️ 所有 spec 必须建子目录（即使只有 1 个 task），下游执行循环靠子目录中的 T-N 文件发现任务
      3. 生成索引: .scratch/$vars.feature/03-specs/spec-index.md
         （按执行顺序: # | 文件名 | 标题 | Tracer Bullets 数 | Depends）
      4. 生成 E2E 测试计划: .scratch/$vars.feature/03-specs/e2e-test-plan.md
         综合所有 spec 的 E2E 验证方法，按执行顺序编排为一份完整测试计划
      5. 若有遗留文件（重跑），先清空 03-specs/ 再写入

      ═══ 原则 ═══
      - 简单需求 → 1 个 spec 即可，不强制拆分
      - Task 用垂直切片（tracer bullet）：每个 task 横穿全栈，独立可验证
      - Task 描述用户视角："用户能做什么"，不写"改什么文件"
      - 不写文件路径，agent 自行决定实现方式
      - 每个 spec 必须定义反假跑标准（区分"真通过"vs"假通过"）
      - 格式参见 octo-xzf-spec-designer skill

  # ============================================================
  # Stage 4b: Spec Walk-Through 审查 (只补充，不改原设计路径)
  # ============================================================

  - id: spec-audit
    type: agent
    depends_on: [spec-planner]
    agents:
      story-walker:
        description: "Story walk-through — trace 故事找 spec 断路/阻塞"
        prompt: |
          使用 octo-xzf-story-walker skill（spec 模式）。

          读:
          - .scratch/$vars.feature/03-specs/spec-index.md
          - 各 spec-NNN.md + 子目录 T-N task
          - .scratch/$vars.feature/02-clarification/brief.md
          - .scratch/$vars.feature/02-clarification/verification.md

          trace 核心故事穿过 specs + 当前 codebase，找断路/阻塞/未实现/反馈未闭环。
          查 6 反模式（魔术桥/孤儿字段/静默失败/缺触发器/无版本/断反馈）。

          返回结构化断点（severity + fix 建议 + 涉及 spec/task）。
          ⚠️ 只返回发现，不改 spec/code。
    prompt: |
      委派 story-walker 审查 plan 完整性。获取断点后：

      ═══ 原则 ═══
      只补充，不改原设计路径/方案/已有 T-N/AC（前面需求澄清的线路已对）。

      ═══ 采纳规则 ═══
      - CRITICAL/HIGH（阻塞断路）→ 采纳为补充：
        追加新 T-N task / AC 到对应 spec 子目录（如 T-N-gap-*.md），不改已有。
      - MEDIUM/LOW → 记录到 spec-audit.md，不自动改。

      写入 .scratch/$vars.feature/03-specs/spec-audit.md（断点 + 采纳的补充清单）。
      汇报：审查了 N 个故事，发现 X 断点，采纳 Y 个补充。

  # ============================================================
  # Stage 5: Spec 逐个执行 (Loop → dynamic_sub_workflow → CR+Fix)
  # ============================================================

  - id: execution
    type: loop
    depends_on: [spec-audit]
    max_iterations: 20
    break_when: '$vars.spec_status == "all_done"'
    nodes:

      # --- 5a: 选择下一个 spec ---
      - id: spec-selector
        type: agent
        prompt: |
          读取 spec 索引: .scratch/$vars.feature/03-specs/spec-index.md
          当前进度变量: current_spec=$vars.current_spec / spec_count=$vars.spec_count

          ═══ 扫描已完成 spec（resume 跳过）═══
          按索引顺序逐行检查。对每个 spec 行：
          1. 取其文件名前缀（如 spec-001-user-login.md → spec-001）
          2. 检查 .scratch/$vars.feature/04-execution/{前缀}/checkpoint.json
             存在且 status=completed → 该 spec 已完成，跳过
          3. 第一个未完成（无 checkpoint 或 status≠completed）的 spec 即为目标

          ═══ 输出 ═══
          若找到未完成 spec（第 N 行，N 从 1 计）:
          {"vars_update": {
            "spec_count": "{spec 总数}",
            "current_spec": "{N-1}",
            "current_spec_file": "{该 spec 文件路径}",
            "current_spec_tasks": "{该 spec 子目录下所有 T-N task 文件路径 JSON 数组}"
          }}

          若所有 spec 都有 completed checkpoint（或索引为空）:
          {"vars_update": {"spec_status": "all_done"}}

          ⚠️ current_spec 是 0-based（第 1 行 → 0）。spec_count 从索引行数得出。

      # --- 5b: 动态生成 DAG 并执行 ---
      - id: spec-dag-execute
        type: dynamic_sub_workflow
        depends_on: [spec-selector]
        execute_when: '$vars.spec_status != "all_done"'
        on_error: continue
        prompt: |
          根据以下 spec 的 task 文件生成 DAG 执行工作流。

          Spec 文件: $vars.current_spec_file
          Task 文件列表: $vars.current_spec_tasks
          目录规范: .scratch/$vars.feature/00-init/directory-conventions.md

          ═══ DAG 生成规则 ═══
          1. 每个 T-N task 文件对应一个 agent 节点
          2. 节点 id 使用 task 编号 (如 T-1, T-2, T-3)
          3. 依赖关系按 task 文件中的「依赖」字段声明 depends_on
          4. 无依赖的 task 可并行执行（不声明 depends_on）
          5. 每个 agent 节点的 prompt 包含:
               - "使用 octo-xzf-implementer skill 执行以下 task"
               - task 文件的完整内容（目标和验收标准）
               - "⚠️ 此阶段不跑 E2E 测试"

      # --- 5c: CR + Fix ---
      - id: cr-and-fix
        type: agent
        depends_on: [spec-dag-execute]
        execute_when: '$vars.spec_status != "all_done"'
        agents:
          code-reviewer:
            description: "代码审查专家 — 审查并修复 spec 实现"
            prompt: |
              审查当前 spec ($vars.current_spec_file) 的所有实现，修复发现的问题。

              基于会话上下文中的 DAG 执行结果进行审查。

              ═══ 审查要点 ═══
              1. 每个 task 的验收标准是否全部满足
              2. 编译/类型检查是否通过 (pnpm build)
              3. 单测是否通过 (pnpm test)
              4. 代码质量（明显的 bug、安全问题、性能问题）

              ═══ 修复 ═══
              发现问题直接修复，不超过 3 轮 verify-fix。
              修复后重新验证编译和测试。
        prompt: |
          委派 code-reviewer 子 agent 审查当前 spec 的实现。
          获取审查结果后汇报: 通过/修复了什么问题/仍有问题。

      # --- 5d: 更新进度 ---
      - id: spec-progress
        type: agent
        depends_on: [cr-and-fix]
        execute_when: '$vars.spec_status != "all_done"'
        prompt: |
          更新当前 spec 的执行 checkpoint。

          1. 从 $vars.current_spec_file 提取 spec 前缀
             （如 .scratch/feat/03-specs/spec-002-auth.md → spec-002）
          2. mkdir -p .scratch/$vars.feature/04-execution/{前缀}/
          3. 写入 {"status":"completed"} 到 checkpoint.json

          4. 判断是否最后一个 spec:
             若 current_spec($vars.current_spec) + 1 >= spec_count($vars.spec_count):
               输出 {"vars_update": {"spec_status": "all_done"}}

          ⚠️ 不写 current_spec（由 spec-selector 每轮扫描得出）。

  # ============================================================
  # Stage 5b: 实现真实性/完整性 Walk-Through 修复 (e2e 前，一次性)
  # ============================================================

  - id: impl-walkthrough-fix
    type: agent
    depends_on: [execution]
    timeout: 3600
    agents:
      story-walker:
        description: "Story walk-through — trace 实现代码找缺口/偏离"
        prompt: |
          使用 octo-xzf-story-walker skill（impl 模式）。

          读:
          - .scratch/$vars.feature/02-clarification/verification.md（测试方法 + 反假跑）
          - .scratch/$vars.feature/03-specs/spec-index.md + 各 spec-NNN.md
          - .scratch/$vars.feature/03-specs/spec-audit.md（如有补充项）

          trace 核心故事穿过已实现代码，找 stub/断路/偏离 spec 验收标准。
          查 6 反模式。

          返回结构化断点（severity + 修复建议，对齐 spec）。
          ⚠️ 只返回发现，不改 spec。
    prompt: |
      委派 story-walker 审查实现真实性/完整性。获取断点后：

      ═══ 原则 ═══
      修复对齐 spec 设计预期，不偏离。保证最终实现符合之前的设计。

      ═══ 修复规则 ═══
      - CRITICAL/HIGH（断路/偏离）→ 直接修复代码。
      - MEDIUM/LOW → 记录到 impl-walkthrough.md，非阻塞。

      写入 .scratch/$vars.feature/05-reports/impl-walkthrough.md（断点 + 修复记录）。
      汇报：修复了 X 处，仍有 Y 处非阻塞。

  # ============================================================
  # Stage 6: E2E 全量验证（完整用户流程测试 + 修复循环）
  # ============================================================

  - id: e2e-verify
    type: agent
    depends_on: [impl-walkthrough-fix]
    timeout: 7200 # 主 agent 内部多轮 e2e 执行 + 修复
    agents:
      e2e-tester:
        description: "E2E 测试执行者 — 执行 E2E 步骤并修复失败用例"
        model: se
        prompt: |
          使用 octo-xzf-implementer skill 执行 E2E 测试。

          ═══ 执行流程 ═══
          1. 读取 E2E 测试计划: .scratch/{feature}/03-specs/e2e-test-plan.md（场景顺序 + 每步来源 spec）
          2. 读取验证方法: .scratch/{feature}/02-clarification/verification.md
             — 测试方法（系统如何测试：启动命令/端口/工具/数据/凭据）
             — 反假跑标准
          3. 读取相关 spec: .scratch/{feature}/03-specs/spec-NNN.md
             — 当前步骤所属 spec 的验收标准（从 e2e-test-plan 步骤标注获取 spec 编号）

          ═══ 测试方法 fallback ═══
          若 verification.md 测试方法不完整（缺启动命令/端口/工具）:
          → 按 .scratch/{feature}/00-init/workspace-topology.md 自行启动系统、选择工具
            （有 web 界面用 playwright，纯 API 用 curl）
          → ⚠️ 但断言必须来自 spec 验收标准，不得自行编造"通过"条件

          ═══ 失败修复 ═══
          某个 E2E 失败时:
          - 定位到具体 spec 和 tracer bullet
          - 尝试修复（max 3 次），修复后只重跑失败步骤
          - 3 次仍失败 → 标记 BLOCKED（记录失败详情 + 阻塞原因），继续下一项

          ═══ 文件存放 ═══
          脚本/截图/临时数据/报告统一放 .scratch/{feature}/05-reports/（e2e-scripts/ e2e-screenshots/ e2e-data/），不污染源码目录。

          ═══ 返回 ═══
          结构化结果: 通过项列表 + 阻塞项列表（含 spec/步骤/原因/已尝试修复）。
    prompt: |
      你是 E2E 验证主调度者。管理 e2e-tester 子 agent，最大努力完成所有 E2E 测试。

      ═══ 原则：最大努力，不卡住 ═══
      - 内部循环委派 e2e-tester 跑 e2e-test-plan 全部步骤。
      - 失败 → 再委派 e2e-tester 修复后重跑（多轮，直到通过或标记 BLOCKED）。
      - 实在阻塞过不去的 → 记录到 e2e-report.md（失败详情 + 阻塞原因），不向用户请求审批，继续下一项。
      - 自己判断何时结束：所有步骤都处理完（通过 or 记录为 BLOCKED）。

      ═══ 结束 ═══
      所有步骤处理完毕后:
      - 全部通过 → e2e_status=passed
      - 有 BLOCKED 记录但已尽力 → e2e_status=blocked（仍进 ship）

      写入 .scratch/{feature}/05-reports/e2e-report.md（每项: PASS/BLOCKED + 证据 + 修复记录）。
      输出 vars_update: {"vars_update": {"e2e_status": "..."}}

  # ============================================================
  # Stage 7: Ship 交付
  # ============================================================

  - id: ship
    type: agent
    depends_on: [e2e-verify]
    tools: [Read, Bash, Grep, Glob]
    prompt: |
      使用 octo-xzf-ship skill 完成 Ship 交付（PR/MR 提交 + Feature 归档）。

      你已继承上游会话上下文（所有 spec、执行结果、E2E 报告均已在会话中）。

      运行时上下文:
      - Feature slug: $vars.feature
      - 分支: $vars.branch
      - Remote 类型: $vars.remote_type
      - 产物目录: .scratch/$vars.feature/

      按 skill 定义的 Step 1 → Step 2 → Step 3 顺序执行。
