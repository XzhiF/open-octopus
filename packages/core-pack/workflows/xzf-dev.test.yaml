# yaml-language-server: $schema=~/.octopus/test-fixture-schema.json
scenarios:
  # ─── Scenario 1: Happy Path — all stages pass first try ───
  - name: "happy path"
    inputs:
      idea: "Add user authentication"
      feature: "auth"
      research_guidance: ""
    mocks:
      # Stage 0: Init
      init:
        output: "初始化完成。分支: feat/auth, feature: auth, remote: github"
        update_vars:
          branch: "feat/auth"
          feature: "auth"
          remote_type: "github"

      # Stage 1: Research (swarm debate)
      idea-research:
        output: "研究结论: 涉及 auth 模块，3 个待澄清问题。"
        update_vars:
          requirements_checklist_status: "INCOMPLETE: 缺少验证策略"

      # Stage 2a: Requirements clarification (1 iteration, immediate proceed)
      requirements-clarify-loop:
        iterations: 1
        nodes:
          requirements-approval:
            choice: "proceed"
            comment: "需求已明确"
          requirements-clarify:
            output: "需求检查完成"
            update_vars:
              requirements_checklist_status: "COMPLETE"

      # Stage 2b: Verification clarification (1 iteration, immediate proceed)
      verification-clarify-loop:
        iterations: 1
        nodes:
          verification-approval:
            choice: "proceed"
            comment: "验证策略已确认"
          verification-clarify:
            output: "验证策略完成"
            update_vars:
              env_checklist_status: "COMPLETE"

      # Stage 3: Brief
      brief-maker:
        output: "需求简报已生成"

      # Stage 4: Spec + Tasks
      spec-planner:
        output: "Spec + Tracer Bullets 设计完成"

      # Stage 5: Execution
      execution:
        output: "所有 spec 执行完毕: 3/3 passed"
        update_vars:
          spec_status: "passed"

      # Stage 6: E2E verification (1 iteration, passes first try)
      e2e-verify-loop:
        iterations: 1
        nodes:
          e2e-runner:
            output: "E2E 测试全部通过"
            update_vars:
              e2e_status: "passed"
          e2e-notify:
            output: "通知已发送"
          e2e-approval:
            choice: "retry"
            comment: ""

      # Stage 7: Ship
      ship:
        output: "PR 已创建: https://github.com/XzhiF/open-octopus/pull/42"

    assertions:
      status: "completed"
      vars:
        branch: "feat/auth"
        feature: "auth"
        remote_type: "github"
        requirements_checklist_status: "COMPLETE"
        env_checklist_status: "COMPLETE"
        spec_status: "passed"
        e2e_status: "passed"
      node_trace:
        executed:
          - init
          - idea-research
          - requirements-clarify-loop
          - verification-clarify-loop
          - brief-maker
          - spec-planner
          - execution
          - e2e-verify-loop
          - ship

  # ─── Scenario 2: E2E fails once, retry succeeds ───
  - name: "e2e fails then passes"
    inputs:
      idea: "Add user authentication"
      feature: "auth"
      research_guidance: ""
    mocks:
      init:
        output: "初始化完成"
        update_vars:
          branch: "feat/auth"
          feature: "auth"
          remote_type: "github"

      idea-research:
        output: "研究结论"
        update_vars:
          requirements_checklist_status: "INCOMPLETE: 待澄清"

      requirements-clarify-loop:
        iterations: 1
        nodes:
          requirements-approval:
            choice: "proceed"
            comment: "OK"
          requirements-clarify:
            output: "done"
            update_vars:
              requirements_checklist_status: "COMPLETE"

      verification-clarify-loop:
        iterations: 1
        nodes:
          verification-approval:
            choice: "proceed"
            comment: "OK"
          verification-clarify:
            output: "done"
            update_vars:
              env_checklist_status: "COMPLETE"

      brief-maker:
        output: "brief done"

      spec-planner:
        output: "spec done"

      execution:
        output: "3/3 passed"
        update_vars:
          spec_status: "passed"

      # E2E: iteration 1 fails, iteration 2 passes
      e2e-verify-loop:
        iterations: 2
        nodes:
          e2e-runner:
            - output: "E2E 失败: 3 个 case 不通过"
              update_vars:
                e2e_status: "failed"
            - output: "E2E 全部通过"
              update_vars:
                e2e_status: "passed"
          e2e-notify:
            - output: "已通知"
            - output: "已通知"
          e2e-approval:
            - choice: "retry"
              comment: "请修复 case #3, #7, #12"
            - choice: "retry"
              comment: ""

      ship:
        output: "PR 已创建"

    assertions:
      status: "completed"
      vars:
        spec_status: "passed"
        e2e_status: "passed"

  # ─── Scenario 3: E2E fails, user skips ───
  - name: "e2e fails then skip"
    inputs:
      idea: "Add user authentication"
      feature: "auth"
      research_guidance: ""
    mocks:
      init:
        output: "初始化完成"
        update_vars:
          branch: "feat/auth"
          feature: "auth"
          remote_type: "github"

      idea-research:
        output: "研究结论"
        update_vars:
          requirements_checklist_status: "INCOMPLETE: 待澄清"

      requirements-clarify-loop:
        iterations: 1
        nodes:
          requirements-approval:
            choice: "proceed"
            comment: "OK"
          requirements-clarify:
            output: "done"
            update_vars:
              requirements_checklist_status: "COMPLETE"

      verification-clarify-loop:
        iterations: 1
        nodes:
          verification-approval:
            choice: "proceed"
            comment: "OK"
          verification-clarify:
            output: "done"
            update_vars:
              env_checklist_status: "COMPLETE"

      brief-maker:
        output: "brief done"

      spec-planner:
        output: "spec done"

      execution:
        output: "3/3 passed"
        update_vars:
          spec_status: "passed"

      # E2E: fails, user chooses skip
      e2e-verify-loop:
        iterations: 1
        nodes:
          e2e-runner:
            output: "E2E 失败: 无法修复"
            update_vars:
              e2e_status: "failed"
          e2e-notify:
            output: "已通知"
          e2e-approval:
            choice: "skip"
            comment: "已知问题，后续修复"

      ship:
        output: "PR 已创建（skip E2E）"

    assertions:
      status: "completed"
      vars:
        e2e_status: "failed"
        e2e_decision: "skip"
      node_trace:
        executed: [e2e-notify, e2e-approval]
