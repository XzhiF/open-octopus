# yaml-language-server: $schema=~/.octopus/test-fixture-schema.json
scenarios:
  # =============================================================
  # Scenario 1: Happy Path — 全流程顺畅，所有循环一次通过
  # =============================================================
  - name: "happy path — all stages complete"
    inputs:
      idea: "添加用户认证功能"
      feature: "user-auth"
      research_guidance: ""
    mocks:
      # --- Stage 0: Init ---
      init:
        output: "初始化完成。分支: feat/user-auth, feature: user-auth, remote: github"
        update_vars:
          branch: "feat/user-auth"
          feature: "user-auth"
          remote_type: "github"

      # --- Stage 1: Codebase Research (Swarm Debate) ---
      idea-research:
        output: "研究完成。影响模块: auth, user。待澄清问题: 3"

      # --- Stage 2: Requirements Clarify (interaction) ---
      requirements-clarify:
        summary: "需求澄清完成。"
        vars_update:
          requirements_confirmed: "true"

      # --- Stage 2b: Verification Strategy ---
      verification-clarify:
        summary: "验证策略已生成: .scratch/user-auth/02-clarification/verification.md"
        vars_update:
          verification_confirmed: "true"

      # --- Stage 3: Brief Maker ---
      brief-maker:
        output: "需求简报已生成: .scratch/user-auth/02-clarification/brief.md"

      # --- Stage 4: Spec Planner ---
      spec-planner:
        output: "Spec 和 Tracer Bullet 设计完成。2 个 spec，5 个 task。"

      # --- Stage 5: Execution Loop ---
      execution:
        iterations: 1
        nodes:
          spec-selector:
            output: "选择 spec-001"
            update_vars:
              spec_count: "1"
              current_spec: "0"
              current_spec_file: ".scratch/user-auth/03-specs/spec-001-auth.md"
              current_spec_tasks: '[".scratch/user-auth/03-specs/spec-001-auth/T-1-db.md",".scratch/user-auth/03-specs/spec-001-auth/T-2-api.md"]'
          spec-dag-execute:
            output: "DAG 执行完成。2 个 task 全部通过。"
          cr-and-fix:
            output: "CR 通过，无问题。"
          spec-progress:
            output: "spec 0 完成，全部 spec 已执行。"
            update_vars:
              spec_status: "all_done"

      # --- Stage 6: E2E Verify Loop ---
      e2e-verify-loop:
        iterations: 1
        nodes:
          e2e-runner:
            output: "passed"
            update_vars:
              e2e_status: "passed"
          e2e-notify:
            output: ""
          e2e-approval:
            choice: "retry"
            comment: ""

      # --- Stage 7: Ship ---
      ship:
        output: "PR 已提交: https://github.com/org/repo/pull/123"

    assertions:
      status: "completed"
      vars:
        branch: "feat/user-auth"
        feature: "user-auth"
        remote_type: "github"
        requirements_confirmed: "true"
        verification_confirmed: "true"
        spec_status: "all_done"
        e2e_status: "passed"
      node_trace:
        executed:
          - init
          - idea-research
          - requirements-clarify
          - verification-clarify
          - brief-maker
          - spec-planner
          - execution
          - e2e-verify-loop
          - ship
        skipped:
          - e2e-notify
          - e2e-approval

  # =============================================================
  # Scenario 2: E2E Failure + Skip — E2E 失败后用户选择跳过
  # =============================================================
  - name: "e2e failure then skip"
    inputs:
      idea: "添加搜索功能"
      feature: "search"
      research_guidance: ""
    mocks:
      init:
        output: "初始化完成。分支: feat/search, feature: search, remote: github"
        update_vars:
          branch: "feat/search"
          feature: "search"
          remote_type: "github"

      idea-research:
        output: "研究完成。影响模块: search, api。"

      requirements-clarify:
        summary: "需求澄清完成。"
        vars_update:
          requirements_confirmed: "true"

      verification-clarify:
        summary: "验证策略已生成"
        vars_update:
          verification_confirmed: "true"

      brief-maker:
        output: "需求简报已生成"

      spec-planner:
        output: "Spec 设计完成。1 个 spec，3 个 task。"

      execution:
        iterations: 1
        nodes:
          spec-selector:
            output: "选择 spec-001"
            update_vars:
              spec_count: "1"
              current_spec: "0"
              current_spec_file: ".scratch/search/03-specs/spec-001-search.md"
              current_spec_tasks: '[".scratch/search/03-specs/spec-001-search/T-1-api.md"]'
          spec-dag-execute:
            output: "DAG 执行完成。"
          cr-and-fix:
            output: "CR 通过。"
          spec-progress:
            output: "spec 0 完成，全部 spec 已执行。"
            update_vars:
              spec_status: "all_done"

      # E2E 第一轮失败，用户选择跳过
      e2e-verify-loop:
        iterations: 2
        nodes:
          e2e-runner:
            - output: "failed"
              update_vars:
                e2e_status: "failed"
            - output: "failed"
              update_vars:
                e2e_status: "failed"
          e2e-notify:
            output: "通知已发送"
          e2e-approval:
            - choice: "retry"
              comment: "再试一次"
            - choice: "skip"
              comment: "跳过 E2E 继续交付"

      ship:
        output: "PR 已提交: https://github.com/org/repo/pull/456"

    assertions:
      status: "completed"
      vars:
        branch: "feat/search"
        feature: "search"
        spec_status: "all_done"
        e2e_decision: "skip"
      node_trace:
        executed:
          - init
          - idea-research
          - requirements-clarify
          - verification-clarify
          - brief-maker
          - spec-planner
          - execution
          - e2e-verify-loop
          - ship

  # =============================================================
  # Scenario 3: Resume-Skip — spec-001 已有 checkpoint，selector 扫描后跳到 spec-002
  # =============================================================
  - name: "resume skip — spec-001 already done, jump to spec-002"
    inputs:
      idea: "添加通知功能"
      feature: "notify"
      research_guidance: ""
    mocks:
      # --- Stage 0: Init ---
      init:
        output: "初始化完成。分支: feat/notify, feature: notify, remote: github"
        update_vars:
          branch: "feat/notify"
          feature: "notify"
          remote_type: "github"

      # --- Stage 1: Codebase Research ---
      idea-research:
        output: "研究完成。影响模块: notify, api。"

      # --- Stage 2: Requirements Clarify ---
      requirements-clarify:
        summary: "需求澄清完成。"
        vars_update:
          requirements_confirmed: "true"

      # --- Stage 2b: Verification (interaction) ---
      verification-clarify:
        summary: "验证策略已生成"
        vars_update:
          verification_confirmed: "true"

      # --- Stage 3: Brief Maker ---
      brief-maker:
        output: "需求简报已生成"

      # --- Stage 4: Spec Planner ---
      spec-planner:
        output: "Spec 设计完成。2 个 spec，3 个 task。"

      # --- Stage 5: Execution Loop ---
      # spec-001 已有 checkpoint（resume 场景），selector 扫描后跳到 spec-002
      execution:
        iterations: 1
        nodes:
          spec-selector:
            output: "跳过 spec-001（已完成），选择 spec-002"
            update_vars:
              spec_count: "2"
              current_spec: "1"
              current_spec_file: ".scratch/notify/03-specs/spec-002-email.md"
              current_spec_tasks: '[".scratch/notify/03-specs/spec-002-email/T-1-smtp.md"]'
          spec-dag-execute:
            output: "DAG 执行完成。"
          cr-and-fix:
            output: "CR 通过。"
          spec-progress:
            output: "spec 2 完成，全部 spec 已执行。"
            update_vars:
              spec_status: "all_done"

      # --- Stage 6: E2E Verify Loop ---
      e2e-verify-loop:
        iterations: 1
        nodes:
          e2e-runner:
            output: "passed"
            update_vars:
              e2e_status: "passed"
          e2e-notify:
            output: ""
          e2e-approval:
            choice: "retry"
            comment: ""

      # --- Stage 7: Ship ---
      ship:
        output: "PR 已提交: https://github.com/org/repo/pull/789"

    assertions:
      status: "completed"
      vars:
        branch: "feat/notify"
        feature: "notify"
        verification_confirmed: "true"
        current_spec: "1"
        spec_count: "2"
        spec_status: "all_done"
        e2e_status: "passed"
      node_trace:
        executed:
          - init
          - idea-research
          - requirements-clarify
          - verification-clarify
          - brief-maker
          - spec-planner
          - execution
          - e2e-verify-loop
          - ship
        skipped:
          - e2e-notify
          - e2e-approval
