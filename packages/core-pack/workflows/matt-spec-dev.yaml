apiVersion: octopus/v1
kind: Workflow

# ============================================================
# matt-spec-dev — 规格直执行流（ADR-0018 规格直执行 + ws 权威 spec 环）
#
# 与 matt-dev-pipeline 的分工：那条流从 idea 出发（swarm 研究 + interaction
# 澄清 + 现场生成 spec）；本流**只消费已冻结的 Batch 目录**（task-author 起草、
# 用户拆分确认过），零澄清、零 spec 再生成：
#   spec-resolve (bash — 确定性核对 + spec 定位 + 反馈/前序交接探测，不烧 agent token)
#     ├─ ok=false → fail-fast (bash — 当场失败并说明原因)
#     └─ ok=true  → spec-review (agent — 仅反馈轮：在 ws 就地审查更新 spec.md)
#                  → ticket-dag  (dynamic_sub_workflow — 功能票 DAG；跳过 NN-e2e 票)
#                  → code-review (判→批修→一测；终检在此)
#                  → e2e-verify  (agent — 仅 has_e2e：对最终 HEAD 走查，review 之后)
#                  → ship-pr (Git PR)
#
# 快线化 (2026-09-16 实测 Round2=27.6min 的复盘): decode-bound —— 56.5K 输出
# tokens 里 ~60% 是转述散文，全量 mvn 同轮跑 4-5 遍。对策 = ①review 回合硬预算
# (≤8 回合, 批修一测, 零编辑零测)；②integration-verify 节点删除，终检并入
# review 收尾；③ship-pr 基于共享会话禁重读 + 产物契约节名逐字 (核对 tab 正则
# 消费者)；④票探路上限。
#
# 验证归属：e2e 是 code-review **之后**的独立 e2e-verify 节点（验最终 HEAD），且不再
# 每批恒有 —— gate 放宽为「验证声明二选一」：有 `NN-e2e-*` 票，或 spec 写
# `Verification Tier: unit-only`。无票 → has_e2e=false → e2e-verify 跳过，轻 phase
# 不烧最贵的走查成本。（曾有过的 integration-gate 兜底节点仍是死码，保持删除。）
#
# 多仓：spec-resolve 枚举**全部** projects/*/ 仓及各自分支写入 $vars.repos（旧实现只认
# 第一个仓 → 第二仓分支/PR 会丢）。code-review / ship-pr 逐仓循环，每个有改动的仓各出
# 一个 PR。跨仓依赖由票 Blocked by 定序 + 被依赖票按自身构建系统安装产物保证编译可见。
# e2e 票的 e2e-harness 依赖按需 —— 仅 browser 走查票挂（它是 web-app 专用 Playwright
# 库），API 级走查票不挂。
# 会话几何 (2026-09-21 起)：票层声明式隔离 (context:new + 可选 resume_from)，
# 主链 code-review/e2e-verify/ship-pr 亦各自新会话、以文件为真相 —— TTFT 全程快，
# 慢的一直是逐字生成。
#
# spec 权威（ADR-0018）：入队后批次目录的最终权威在 **ws 侧** —— 打回反馈指向
# 规格本身问题时，本流的 spec-review 段在 ws 里就地更新 spec.md（决策表行/编号
# 稳定纪律不变），终态由 server collect 回流 home（home=终态镜像 + 下轮 seed 源）。
# spec-rN.md 仅属起草窗口；本流取「最大 spec-rN.md，否则 spec.md」为底本。
#
# 人 gate = 看板验收（K6）：本流内部零 approval/interaction 节点。
# ============================================================

name: matt-spec-dev
description: |
  规格直执行流：读 phase Batch 目录（spec.md + issues/，seed 下行后的 ws 同构位）
  直接执行 —— 票 DAG 实现 → 集成门禁 → Code Review → ship 出 PR；打回轮先就地
  审查更新 spec 再执行。零需求澄清、零 spec 再生成。
version: 1.0.0

# --- 全局配置 ---
engine: claude
model: pro-max
timeout: 10800 # 全局 3h — 完整里程碑轮（含 E2E 票），显著大于 task-fix
execution_mode: serial

# --- 输入（phase input_values 绑定；${phase.batch_rel} 词表 materialize 时解析）---
inputs:
  batch_dir:
    description: "ws 相对批次目录（${phase.batch_rel} 解析值，`.scratch/<date>/<slug>` — seed 后内含 spec*.md + issues/ + fix-feedback-rN.md）"
    required: true
  task_artifacts_dir:
    description: "任务产物目录 — 看板 dispatch 管理键自动注入，绑定表单无需手填"
    required: false
  prev_handoff_paths:
    description: "已 accepted 前序 phase 的 handoff.md 绝对路径（换行连接，home 位）— 看板 accept→下一 phase 开轮时自动注入（内置键，非占位符），绑定表单无需手填；spec-resolve 探测存在性后写 vars.prev_handoffs / prev_handoff_count，缺失路径静默跳过"
    required: false
  is_final_phase:
    description: "本 phase 是否任务末站（\"true\"/\"false\"）— 看板派发时自动注入（内置键，非占位符），绑定表单无需手填。末站无下游执行会话，ship-pr 据此不产 handoff.md"
    required: false
  task_id:
    description: "归属任务 id — 看板派发时自动注入（内置键，非占位符；空串=拿不到，消费步自检跳过）。ship-pr 的验收台复检回填用（spec-field POST）。"
    required: false
  octopus_api:
    description: "Octopus server 自身 base URL（如 http://127.0.0.1:3001）— 与 task_id 同纪律自动注入，空串同上跳过。"
    required: false

# --- 变量（spec-resolve 写，下游读；串行链上的路由真相）---
variables:
  batch_ok: ""
  batch_reason: ""
  spec_file: ""
  has_feedback: "false"
  latest_feedback: ""
  review_budget: ""
  branch: ""
  repos: ""
  repo_count: "0"
  has_e2e: "false"
  e2e_ticket: ""
  review_status: ""
  verify_status: ""
  e2e_status: ""
  pr_url: ""
  prev_handoffs: ""
  prev_handoff_count: "0"

# --- 资源依赖（DAG 票节点 + review/ship 用到的 skill 子集）---
requires:
  skills:
    - mattpocock-skills/implement
    - mattpocock-skills/tdd
    - mattpocock-skills/code-review
    - mattpocock-skills/diagnosing-bugs
    - mattpocock-skills/handoff

# --- 通知 ---
providers:
  hermes-cli:
    type: hermes
    timeout: 30
    min_severity: info

channels:
  xzf_hermes:
    provider: hermes-cli
    target: "telegram:xzf_hermes"

# --- 钩子 ---
hooks:
  on_workflow_start:
    - id: notify-start
      type: notify
      channel: xzf_hermes
      template:
        severity: info
        title: "🏁 matt-spec-dev — 轮次启动"
        body: "📁 $inputs.batch_dir\n▶ 开跑（DAG 规划即将开始）"

  on_workflow_failure:
    - id: notify-failure
      type: notify
      channel: xzf_hermes
      template:
        severity: error
        title: "❌ matt-spec-dev — 工作流失败"
        body: "📁 $inputs.batch_dir\n🔴 失败节点: ${hook.failed_node_id | default:unknown}\n⏱️ 已运行: ${hook.total_duration_ms | duration}\n💡 错误: ${hook.error | default:Unknown error}"

  on_complete:
    - id: notify-complete
      type: notify
      channel: xzf_hermes
      template:
        severity: info
        title: "🚀 matt-spec-dev — 轮次完成"
        body: "📁 $inputs.batch_dir\n✅ PR: $vars.pr_url\n🔧 review: $vars.review_status"

  on_node_success:
    - id: notify-spec-review
      type: notify
      nodes: [spec-review]
      channel: xzf_hermes
      template:
        severity: info
        title: "📝 spec 已就地修订"
        body: "📁 $inputs.batch_dir | 反馈: $vars.latest_feedback"

    - id: notify-dag
      type: notify
      nodes: [ticket-dag]
      channel: xzf_hermes
      template:
        severity: info
        title: "⚡ 票 DAG 执行完成"
        body: "📁 $inputs.batch_dir"

    - id: notify-review
      type: notify
      nodes: [code-review]
      channel: xzf_hermes
      template:
        severity: info
        title: "🔍 Code Review 完成"
        body: "📁 $inputs.batch_dir\n🔧 review: $vars.review_status · 终检: $vars.verify_status"

    - id: notify-e2e
      type: notify
      nodes: [e2e-verify]
      channel: xzf_hermes
      template:
        severity: info
        title: "🧪 E2E 走查完成"
        body: "📁 $inputs.batch_dir\n🧪 e2e: $vars.e2e_status（unit-only 批次本节点跳过、不发此通知）"

    - id: notify-ship
      type: notify
      nodes: [ship-pr]
      channel: xzf_hermes
      template:
        severity: info
        title: "🚀 Ship 完成"
        body: "🌿 $vars.branch | PR: $vars.pr_url"

  on_node_failure:
    # review/e2e 皆 on_error:continue —— 失败不阻断 ship，不通知就成「沉默即没事」
    # 的假象；失败信号单独发一条（人 gate 前把话说全）。
    - id: notify-review-failed
      type: notify
      nodes: [code-review]
      channel: xzf_hermes
      template:
        severity: warn
        title: "🔴 Code Review 未完成（不阻断，待人工裁决）"
        body: "📁 $inputs.batch_dir\n⚠️ ${hook.error | default:详见节点日志}"

    - id: notify-e2e-failed
      type: notify
      nodes: [e2e-verify]
      channel: xzf_hermes
      template:
        severity: warn
        title: "🔴 E2E 走查未完成（不阻断，待人工裁决）"
        body: "📁 $inputs.batch_dir\n⚠️ ${hook.error | default:详见节点日志}"

# ============================================================
# Nodes
# ============================================================

nodes:
  # ------------------------------------------------------------
  # Stage 0: 前置核对（确定性 bash — 输入不全当场分流，不启动 agent）
  # ------------------------------------------------------------

  - id: spec-resolve
    type: bash
    timeout: 120
    bash: |
      BATCH="$inputs.batch_dir"
      REASON=""

      if [ ! -d "$BATCH" ]; then
        REASON="batch dir not found in workspace: $BATCH (seed 下行未落盘?)"
      fi

      # 本轮底本 ← 最大 r 号的 spec-rN.md（起草窗口并存的最新修订）；无 rN 则 spec.md
      SPEC=""
      if [ -z "$REASON" ]; then
        LATEST=$(ls "$BATCH"/spec-r*.md 2>/dev/null | sed -E 's/.*-r([0-9]+)\.md$/\1/' | sort -n | tail -1)
        if [ -n "$LATEST" ]; then
          SPEC="$BATCH/spec-r$LATEST.md"
        elif [ -f "$BATCH/spec.md" ]; then
          SPEC="$BATCH/spec.md"
        else
          REASON="no spec.md / spec-rN.md under: $BATCH"
        fi
      fi

      # issues/ 非空（票 = 执行单元）
      if [ -z "$REASON" ]; then
        TICKETS=$(ls "$BATCH"/issues/*.md 2>/dev/null | wc -l | tr -d ' ')
        if [ "$TICKETS" = "0" ]; then
          REASON="issues/ empty under: $BATCH (nothing to execute)"
        fi
      fi

      # e2e 探测：issues/ 有 `NN-e2e-*` 票 → has_e2e=true。该票不进 ticket-dag（planner
      # 跳过），改由 code-review 之后的 e2e-verify 节点对最终 HEAD 走查。作者判定本
      # phase 免走查（spec 写 Verification Tier: unit-only）时不产 e2e 票 →
      # has_e2e=false → e2e-verify 整节点跳过，省掉最贵的走查成本。
      HAS_E2E="false"; E2E_FILE=""
      if [ -z "$REASON" ]; then
        E2E_FILE=$(ls "$BATCH"/issues/*-e2e-*.md 2>/dev/null | head -1)
        [ -n "$E2E_FILE" ] && HAS_E2E="true"
      fi

      # code-review 熔断丝：随票数 + 仓数伸缩。10 + 5×票 + 3×仓 —— 3 票批实测 review 用
      # 8-17 回合，定长者对复杂批必爆(三单 r1 的 max_turns=8 实证)；跨仓终检按 reactor 序
      # 每仓多跑一轮 mvn，故再并入仓数。实际预算在下方仓枚举算出 RC 后再定。

      # 未消化反馈探测：存在 fix-feedback-rN.md → 本轮先过 spec-review 再审段
      FB=""; HAS_FB="false"
      if [ -z "$REASON" ]; then
        FB=$(ls "$BATCH"/fix-feedback-r*.md 2>/dev/null | sed -E 's/.*-r([0-9]+)\.md$/\1/' | sort -n | tail -1)
        if [ -n "$FB" ]; then HAS_FB="true"; FB="$BATCH/fix-feedback-r$FB.md"; fi
      fi

      # 前序交接探测（phase-handoff-chaining K3）：prev_handoff_paths = 看板 accept→
      # 下一 phase 开轮注入的内置键（home 绝对路径，换行连接）。未注入时
      # substituteVars 原样留下字面量 → 单引号赋值 + 字面量比对判空（双引号会被
      # bash 展开掉 "$inputs" 前缀，判空失真）。反斜杠→正斜杠归一：Windows 注入值
      # 为 C:\ 形路径，归一后 [ -f ] 可测且 vars_update JSON 值无裸反斜杠（JSON-safe）。
      # 缺失路径静默跳过不 fail（R2）。
      PREV_JSON=""; PREV_COUNT=0
      # substituteVars 对「未解析引用」**原样保留**整段字面量。哨兵用 '$inputs' 裸词
      # 拼接构造（裸词 $inputs 不匹配 inputs.* 分支 → 不被替换），否则比较两侧会
      # 同时被替换成实值、判空失真。
      PH_RAW='$inputs.prev_handoff_paths'
      PH_UNRESOLVED='$inputs'".prev_handoff_paths"
      if [ "$PH_RAW" = "$PH_UNRESOLVED" ]; then PH_RAW=""; fi
      while IFS= read -r PH_LINE; do
        PH_LINE=$(printf '%s' "$PH_LINE" | tr -d '\r' | tr '\\' '/')
        [ -z "$PH_LINE" ] && continue
        if [ -f "$PH_LINE" ]; then
          if [ "$PREV_COUNT" -gt 0 ]; then PREV_JSON="$PREV_JSON\\n"; fi
          PREV_JSON="$PREV_JSON$PH_LINE"
          PREV_COUNT=$((PREV_COUNT+1))
        fi
      done <<< "$PH_RAW"

      # 代码仓枚举（worktree 在 projects/ 下，ws 根不是 git repo）。单仓列一行、跨仓
      # 任务列全部，下游 code-review / ship-pr 逐仓循环。REPOS 每行 `path|branch`
      # （相对路径、正斜杠、JSON-safe）；branch 留首仓值供展示。
      REPOS_JSON=""; BR=""; RC=0
      for D in projects/*/; do
        [ -e "$D/.git" ] || continue
        B=$(git -C "$D" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
        [ -z "$B" ] && continue
        P=${D%/}
        if [ "$RC" -gt 0 ]; then REPOS_JSON="$REPOS_JSON\\n"; fi
        REPOS_JSON="$REPOS_JSON$P|$B"
        [ -z "$BR" ] && BR="$B"
        RC=$((RC+1))
      done

      # 熔断丝现在算（依赖 RC — 见上方仓枚举）：10 + 5×票 + 3×仓
      REVIEW_BUDGET=$(( 10 + 5 * ${TICKETS:-0} + 3 * RC ))

      if [ -n "$REASON" ]; then
        echo "PRECHECK FAILED: $REASON"
        printf '{"vars_update": {"batch_ok": "false", "batch_reason": "%s", "ticket_count": "%s", "review_budget": "%s", "repos": "%s", "repo_count": "%s", "has_e2e": "false", "prev_handoffs": "%s", "prev_handoff_count": "%s"}}\n' "$REASON" "${TICKETS:-0}" "$REVIEW_BUDGET" "$REPOS_JSON" "$RC" "$PREV_JSON" "$PREV_COUNT"
        exit 0
      fi

      if [ "$PREV_COUNT" -gt 0 ]; then echo "PREV HANDOFFS: count=$PREV_COUNT (前序交接在场 — 下游先读)"; fi
      echo "PRECHECK OK: spec=$SPEC tickets=$TICKETS repos=$RC has_e2e=$HAS_E2E feedback=$HAS_FB branch=$BR"
      printf '{"vars_update": {"batch_ok": "true", "batch_reason": "", "spec_file": "%s", "has_feedback": "%s", "latest_feedback": "%s", "review_budget": "%s", "branch": "%s", "repos": "%s", "repo_count": "%s", "has_e2e": "%s", "e2e_ticket": "%s", "ticket_count": "%s", "prev_handoffs": "%s", "prev_handoff_count": "%s"}}\n' "$SPEC" "$HAS_FB" "$FB" "$REVIEW_BUDGET" "$BR" "$REPOS_JSON" "$RC" "$HAS_E2E" "$E2E_FILE" "$TICKETS" "$PREV_JSON" "$PREV_COUNT"

  - id: fail-fast
    type: bash
    depends_on: [spec-resolve]
    execute_when: '$vars.batch_ok != "true"'
    bash: |
      echo "matt-spec-dev cannot run: $vars.batch_reason"
      echo "→ 检查 phase.specPath 绑定与 seed 是否落盘（批次目录应已镜像到 ws 的 $inputs.batch_dir）"
      exit 1

  # ------------------------------------------------------------
  # Stage 0.5: spec 就地再审（仅打回反馈轮 — ADR-0018 ws 权威段）
  # ------------------------------------------------------------

  - id: spec-review
    type: agent
    depends_on: [spec-resolve]
    execute_when: '$vars.has_feedback == "true"'
    timeout: 1800
    prompt: |
      ═══ Spec 就地再审（ws 权威 — ADR-0018）═══
      本 round 因验收打回而重跑。反馈与批次目录都在 ws 侧，你是 spec 的最终维护者。

      ═══ 读取 ═══
      - 反馈（逐条）: $vars.latest_feedback
      - spec 底本: $vars.spec_file
      - 票: $inputs.batch_dir/issues/
      - 前序交接（若列出的先读；空则本 phase 无前序）: $vars.prev_handoffs
        —— 就地修订 spec 时不得回退其 Protected Decisions，接口引用优先复用其
        Confirmed Interfaces 指向的现物。

      ═══ 执行纪律 ═══
      1. 逐条判断反馈性质：实现缺陷（spec 不变，票不变）/ 规格错误（spec 需改）/
         范围补充（spec + 票都要改）。
      2. 规格有误或需补充 → **就地更新 $inputs.batch_dir/spec.md**（ws 内，终态）：
         - Key Decisions 表：行与编号保持稳定，改判行在 Conclusion 追加
           `NEW-r<本轮>` 标记 — 不删旧行、不重排编号。
         - User Stories / Verification 随之修订。
         - 若底本是 spec-rN.md（起草窗口遗留），把其内容并入 spec.md 后一切以
           spec.md 为准（spec-rN.md 留作历史，不再更新）。
      3. 票的增删改**原位增量**（不重写整目录）：新票顺延编号，末张保持
         `NN-e2e-*` 验收票；被反馈作废的票标 Status: skip（不物理删）。
         **重开纪律**：反馈涉及的、已标 `Status: done` 的票 → 把 Status 改回
         `ready`（实现缺陷=原票重开；规格错误=原票重开+按新 spec 改票文）。
         不回开 = 下游 planner 只见 done 票 → 0 节点 DAG → 整轮空转失败
         （2026-09-16 三单 r2 实证）。与反馈无关的 done 票保持不动。
      4. 修订点记入 $inputs.batch_dir/round-report.md 的「## Spec 修订」节
         （反馈条目 → 是否改 spec → 改了什么），供验收人对照。
      5. 只动本批次目录，不碰 projects/ 代码（实现是 Stage 1 的事）。

      （本节点不产 vars_update —— 它报过的 spec_reviewed 无声明也无消费方，
       2026-09-17 清除。节点的完成状态由引擎记录，下游用不着额外信号。）

  # ------------------------------------------------------------
  # Stage 1: 票 DAG 执行（dynamic_sub_workflow — LLM 规划，引擎并发）
  # ------------------------------------------------------------

  - id: ticket-dag
    type: dynamic_sub_workflow
    depends_on: [spec-review]
    workflow: ticket-dag
    on_error: continue
    prompt: |
      你是 DAG 规划器。读取 issues 目录中的所有 ticket，构建执行 DAG。

      Issues 目录: $inputs.batch_dir/issues/
      Spec 文件: $vars.spec_file（spec-review 跑过时以 $inputs.batch_dir/spec.md 为准）

      ═══ 步骤 ═══
      1. 列出 issues/ 中所有 .md 文件
      2. 读取每个文件，提取:
         - Ticket ID（文件名前缀数字，如 01）
         - Ticket Title
         - "Blocked by" 字段（依赖关系）
         - "Status" 字段（跳过 status: done 或 skip 的）
         - "Verification Method" 字段（票节点必须执行它）
      3. 构建依赖图 —— **但把末张 `NN-e2e-*` 验收票排除出 DAG**（不给它建节点）：
         它改由下游独立的 e2e-verify 节点在 code-review 之后执行（验最终 HEAD）。
         DAG 只规划功能票；功能票依赖里若引用了 e2e 票 ID 也一并忽略。
      4. 为每个待执行的功能 ticket 创建一个 agent 节点:

      普通票节点格式:
      ```json
      {
        "id": "ticket-NN",
        "type": "agent",
        "prompt": "你是实现者，执行 ticket NN。\n\nSpec: <spec 文件>\nTicket: $inputs.batch_dir/issues/NN-slug.md\n代码仓: projects/ 下可能有多个仓（跨仓任务：提供方仓产出符号、消费方仓引用）。先定位本票改动落在哪个仓。\n跨仓依赖：若本票引用另一仓本次新产出的符号，其构建/安装步骤以被依赖票自己的 Verification Method 为准（作者按各仓构建系统写好），票间 Blocked by 保证顺序——本票编译前先确认依赖方产物已就绪。\n前序交接（有则先读；空则本 phase 无前序）: $vars.prev_handoffs — 不得回退其中 Protected Decisions；接口/表/组件/命令直接复用其中 Confirmed Interfaces 给的现物，不回炉重设计。\n\n使用 implement skill 和 tdd skill 方法论:\n1. Read spec + ticket 理解需求（各一次读全，不回读）\n2. 探路 ≤2 次 grep/Read：定位到源文件与测试目录即止——**已续接前序会话（你唯一依赖的那张票）探过的路**禁止重走；无续接的票（并行票/汇聚票）各自探自己的，别为别人的重复劳动买单\n3. TDD 实现（DB → API → UI → test）\n4. 运行 ticket 的 Verification Method —— **只跑本票相关的测试文件/用例（如 vitest run <files>、-t <name>），票内禁跑全量测试套件**（全量终检归 code-review 恰一次）；修复轮只重跑失败用例\n5. 更新 ticket Status: done 或 skip（原位回写票文件）\n═══ 速度纪律 ═══ 直接编辑文件，不口播实现过程；最终回复 = 票状态一行 + vars_update JSON。**相互独立的 Read/Grep 在同一回合并发发起**（一个回合放多个工具调用），不要一回合一个工具排队。\n\n你是多个并发实现者之一。只关注你的 ticket。\n不要修改其他 ticket 的文件。不要改 spec*.md。不要 commit。\n\n最后输出 vars_update: {\"vars_update\": {\"ticket_NN_status\": \"done|skip\"}}",
        "skills": ["implement", "tdd"],
        "depends_on": ["ticket-XX"],
        "context": "new",
        "resume_from": "ticket-XX（可选，见下纪律）"
      }
      ```

      会话纪律（context / resume_from 由你在每个票节点上显式声明）:
      - 一切票节点 **"context": "new"** —— 各票独立会话，并行的票绝不共享/续接彼此的上下文（实测：共享会话把上下文互灌到 270k+/回合，decode 全线拖慢、账目重复）。
      - **resume_from** 仅给「恰好一个 Blocked-by 前驱、且你判断继承它的探路成果值得」的票：值 = 那个前驱节点 id，且它必须同时在 depends_on 里。多前驱的汇聚票**不写** resume_from（汇聚票的输入真相在文件里——票状态/handoff——不在任何单一分支的记忆里）。
      - 首票 / 无前驱票不写 resume_from。

      （E2E 票不在这里建节点 —— 见下方 e2e-verify 独立节点。）

      ═══ 约束 ═══
      - 所有节点必须是 type: "agent"
      - 不允许循环依赖
      - 无依赖的 ticket 并行执行
      - depends_on 引用 ticket ID（如 "ticket-01"）
      - 已完成（done/skip）的 ticket 不创建节点
      - **`NN-e2e-*` 票不创建节点**（由 code-review 之后的 e2e-verify 独立节点执行）

  # ------------------------------------------------------------
  # Stage 2: Code Review（裁判 ≠ 球员；对照 spec.md 现态。2026-09-16 快线化:
  #          判→批修→一测，终检并入本节点，原 integration-verify 吸收于此）
  # ------------------------------------------------------------

  - id: code-review
    type: agent
    depends_on: [ticket-dag]
    context: new
    # 熔断丝随票数伸缩(spec-resolve 算 review_budget)。注意:模板正统语法是
    # $vars.x 无花括号 —— ${vars.x} 在 substituteVarsFull 里归 filter 引擎,
    # 不带 |filter 不解析(五单 R1 实证 "treated as unset")。
    max_turns: $vars.review_budget
    # 熔断/出错不连坐: 节点如实 failed (看板徽章可见), 但 ship 照常把货端上
    # 验收台 (引擎 on_error:continue → completed_with_failures, 人 gate 裁决)。
    on_error: continue
    prompt: |
      使用 code-review skill 独立审查所有代码变更。
      主 agent 从没看过实现过程，天然独立 → 直接审查。
      三轴不变: Standards / Spec 对照 $inputs.batch_dir/spec.md / Completeness。
      审查范围: $vars.repos 列出的**每个**代码仓（每行 `path|branch`）。逐仓取工作树
      变更，合并进同一份审查；某仓工作树无改动则跳过该仓。单仓时只有一行，行为同旧流。

      ═══ 审查锚点（别探索、别就此成文）═══
      审查发生在 ship 之前 —— 每仓 HEAD == origin/main，全部变更在**工作树**:
      锚点 = 逐仓 `git -C <path> status --porcelain` + `git -C <path> diff HEAD` + 未跟踪清单。
      origin/main...HEAD 必为空是流水线几何，不是异常：不探测、不成文。

      ═══ 回合预算（目标 ≤10 回合；熔断丝 = 10+5×票数，保险丝不是绩效目标）═══
      1. 清单一条 bash 拿全，然后**同一回合并发 Read** 全部变更文件全文 + spec.md
      2. findings 一次成表后**立即落盘** code-review.md 初版（每条 ≤2 行:
         🔴/🟡/🔵 + 文件:行 + 一句）—— 报告先存在，再好起来
      3. 🔴/🟡 一批全部 Edit 完（禁止修一个测一个；🔴 修不动/持续 → 如实
         保留进报告，人 gate = 看板验收，不阻断）
      4. 测一次:
         - 第 3 步零编辑 → 不测（功能票的相关测试绿仍是现物；票内已禁全量，
           全量套件在本节点才有 — 零编辑即无新风险面，不补测）
         - 有编辑 → 每仓按各自构建系统全量 test **各恰一次**（本轮终检，不可跳过；
           此后禁止再补任何测试）。仓间有依赖时按依赖序：先构建/安装被依赖仓，再测消费仓。
      5. 终稿补全: 修复记录 + 「## 终检」节（零编辑未测则写明"零编辑未测，绿引功能票测试现物"）

      ═══ 修复轮增量（批目录已有上一轮 code-review.md 时）═══
      只审上一轮之后的工作树变化 + 上轮每条 finding 的处置状态（已修/仍开/
      不修原因），**不重做全量三轴**。上轮报告是你本轮的输入。

      最后输出 vars_update JSON:
      {"vars_update": {"review_status": "passed|has_notes|has_fixes", "verify_status": "passed|failed|not_needed"}}

  # ------------------------------------------------------------
  # Stage 2.5: E2E 走查 —— code-review 之后，对最终 HEAD 执行 NN-e2e 票；
  #   has_e2e=false 则整节点跳过，走查挂了 on_error:continue 不阻断 ship（人 gate 裁决）
  # ------------------------------------------------------------

  - id: e2e-verify
    type: agent
    depends_on: [code-review]
    execute_when: '$vars.has_e2e == "true"'
    on_error: continue
    timeout: 1800
    context: new
    skills: [matt-e2e-test-methodology, diagnosing-bugs]
    prompt: |
      你是 E2E 验证者，对**已 review 修复后的最终代码**执行验收票 $vars.e2e_ticket 定义的走查。
      本节点在 code-review 之后 —— 你现在验的正是即将 ship 的那版，别再回头改代码（除 Quick Fix）。

      ═══ 双模式（先读票上「类型」声明选路）═══
      - 「browser 走查」→ Playwright 真起浏览器 + 截图/vision 证据（仅 web-app 类；可用 e2e-harness 库）
      - 「API 级走查（不开浏览器）」→ 真实服务 curl + sqlite 直查 + 手算交叉；

      ═══ 步骤 ═══
      1. 读票的 Verification Method + spec 的 Verification Strategy / AC 表
      2. 需要真实服务时，优先复用项目自带的验收运行契约：若工作区/代码仓有
         `.octopus/acceptance/{up,health,down}.sh`（或 spec 指明的启动契约），跑
         up → 轮询 health(退出码0=就绪) → 走查 → down 收尾；没有再自行起服务
         （端口冲突用 --isolated）。契约与验收台「跑起来看」同源，别各起一套。
         **禁无端全量 rebuild**
         —— code-review 终检刚过，构建产物是热的，直接以现有 dist/产物起服务；
         仅当本节点 Quick Fix 真改了代码，才只重建受影响的部分。
      3. 反假跑纪律：真实服务、断言业务值、≥2 种证据、E2E_TD_ 前缀数据、测后清理恢复
      4. **跨仓复用契约探针（消费方视角）**：若本 phase 跨仓（消费仓引用了产出仓本次新增
         的符号），加一条断言证明「真复用而非就地重写」——用该仓构建系统的依赖解析或
         import/字节码级检查，确认消费方编译产物真的链到了产出方的实现。只看端点返回值
         证不了复用的是别人的实现。
      5. 证据写 $inputs.batch_dir/e2e-data/（截图 e2e-screenshots/，脚本 e2e-scripts/；
         API 级写响应体/SQL 原样输出/手算记录）
      6. 失败项：Quick Fix 一轮 → 修不动则 diagnosing-bugs 深挖 → 仍失败如实标 Status +
         原因（不得伪造通过；本节点 on_error continue，挂了也不阻断 ship，人 gate 裁决）
      7. 票文件原位回写 Status + 结果摘要

      最后输出 vars_update JSON:
      {"vars_update": {"e2e_status": "passed|failed"}}

  # ------------------------------------------------------------
  # Stage 3: Ship（代码仓 Git PR + 批次目录 round-report.md + handoff.md 阶段交接；
#          末 phase 不产 handoff —— 无下游执行会话，见 §2 产物 2 的末站跳过）
  # 快线化: 文件快照一遍读齐 + 事实一条 bash 采齐 + 产物契约节名逐字
  # （round-report「票执行摘要」「Changed Files」与 handoff 三节是核对 tab /
  #   下一 phase 的解析锚点 —— 压缩只压正文，不压节名与表头）
  # ------------------------------------------------------------

  - id: ship-pr
    type: agent
    depends_on: [e2e-verify]
    timeout: 1800
    context: new
    tools: [Read, Bash, Grep, Glob]
    prompt: |
      完成 Ship 交付: Round Report + Git PR。
      使用 handoff skill 方法论记录本轮交接（**仅当本 phase 非末站** —— 见产物 2 的末站跳过）。

      ═══ 上下文 ═══
      Batch 目录（ws 根下，与 task home 同构）: $inputs.batch_dir
      代码仓: $vars.repos 列出的**每个** git repo（每行 `path|branch`，跨项目任务多仓）
      前序交接（有则先读，其 Gap Targets 未闭环项须承接或显式关闭；空则本 phase 无前序）: $vars.prev_handoffs
      本 phase 是否末站: $inputs.is_final_phase（true ⇒ 无下游执行会话，跳过产物 2）

      ═══ 速度纪律 ═══
      - 你是独立会话（主链已瘦身）—— 文件即真相：**同一回合并发 Read** 拿齐
        spec.md、末张 e2e 票的走查结果节、code-review.md、（有则）fix-feedback 最新一份，
        此后这些文件不再回读。
      - 事实采集一条 bash 拿全: **逐仓** `git -C <path> diff --stat origin/main...HEAD`
        + grep -H "Status:" $inputs.batch_dir/issues/*.md
        + code-review.md 的结论行。此后除落笔与 git 操作外不再探索。

      ═══ 产物契约（下游消费者是正则解析器，节名/表头一字不能改）═══
      1. $inputs.batch_dir/round-report.md（spec-review 已写「Spec 修订」节的，
         在其后追加，不覆盖）必须依次含四节，节名逐字:
           ## 票执行摘要      表格: | 票 | 状态 | 判据结果 |（每票一行，含 skip）
           ## Code Review 结论 findings/fixed/noted，对照 code-review.md
              （review_status 为空/failed —— 评审熔断或出错 → 本节如实写
              "评审未完成（原因）"，code-review.md 有初稿则引用已落盘部分，
              并把该缺口记进 Remaining Issues；货照常交付，人 gate 裁决）
           ## E2E 证据索引    e2e-verify 节点产物：$vars.e2e_status + e2e-data/ 关键文件与
              结果（e2e_status=passed/failed 如实写；has_e2e=false 的免走查 phase 写
              "本批 unit-only 免走查（spec 声明）"）
           ## Changed Files   逐仓 git -C <path> diff --stat 分节原样贴入，不重排不截断
         可另加 ## Remaining Issues（如实，含终检 failed 时的详情）。
      2. $inputs.batch_dir/handoff.md — 面向下游 phase 执行会话的精选交接短页
         （每轮整页重写、禁止追加 — 头块轮次 rN 即最新终态）:
         - 头块：phase 名与 batch slug · 终态轮次 rN（当前轮号 — 从批内
           fix-feedback-rN.md / round-report.md 现态判定，首跑 = r1）· PR 链接 · 批次路径
         - `## Protected Decisions` — 本 phase 定死、下游不得回退的决策（对照 spec.md
           Key Decisions 表）
         - `## Confirmed Interfaces` — 下游可直接复用的接口/表/组件/命令，给路径不给描述
         - `## Gap Targets` — 如实遗留：skip 票、noted 风险、未竟事项（含承接的前序 Gap 去向）
         节名逐字不可改（下一 phase 的 prompt 逐字引用）；正文 ≤25 行，压正文不压节。
         ⚠️ **末站跳过**（$inputs.is_final_phase == "true"）：本 phase 是任务最后一个，
         没有下游执行会话会读它（server 只在 index < 目标 phase 的范围内注入前序交接，
         归档链也不读）—— 此时**不产 handoff.md**（已有旧版则一并删掉，留着是误导），
         改为在 round-report 的 `## Remaining Issues` 写一行
         "末 phase（无下游）：按 ADR-0019 §1 边界跳过 handoff.md"。验收人要看本轮全貌有
         round-report，不缺这一页。
      3. issues/ 有票漏回写 Status → 补写。
      3.5 **验收台「当场复检」回填（fire-safe，绝不为它失败本轮）**——$inputs.task_id 与
         $inputs.octopus_api 均非空时：curl -s $inputs.octopus_api/api/tasks/$inputs.task_id
         看 task_spec.acceptance_verify.command —— 已存在 → **绝不覆盖，跳过**；缺失 → 按你
         本轮**实际跑过**的构建/测试命令回填一条仓根可重跑的（禁编没跑过的命令；命令值保持
         纯 ASCII，别塞中文）：
           单仓:  value = {"command":"<cmd>","cwd":"projects/<仓目录名>","timeoutS":900}
           多仓($vars.repo_count>1): value = {"command":"<仓根相对 cmd,不带 cd/仓名>","per_repo":true,"timeoutS":900}
         POST $inputs.octopus_api/api/tasks/$inputs.task_id/spec-field，body
         {"field":"acceptance_verify","value":<上述 value>}。任何非 200 → 静默放弃，
         人会在验货台抽屉自己配——这一步是锦上添花，不是交付条件。

      ═══ Git（逐仓交付：$vars.repos 每个有改动的仓各出一个 PR）═══
      4. 对 $vars.repos 每行 `path|branch`:
         - git -C <path> status --porcelain 为空 → 该仓无改动，跳过（不出 PR）
         - 否则在该仓内: git add -A && git commit -m "feat(<batch slug>): spec-dev round" && git push origin <branch>
      5. 每个已 push 的仓创建或更新 PR（在该仓目录内执行）:
         - gh pr list --head <branch> --state open
         - 已有 → gh pr edit（保留 MANUAL 区块）
         - 无 → gh pr create
      6. pr_url 汇总所有已出 PR 的链接（多个用换行连接，单仓时就是一个）。

      ═══ 纪律 ═══
      - 只 commit 代码仓变更；批次目录（ws 根 .scratch/ 下）不进代码仓 git。
      - 终态由看板 collect 回流 home — 你只管写 ws。

      最后输出 vars_update JSON:
      {"vars_update": {"pr_url": "<PR URL>"}}
