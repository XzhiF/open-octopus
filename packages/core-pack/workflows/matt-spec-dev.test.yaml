# matt-spec-dev.test.yaml — 模拟器场景（验证入口：octopus workflow simulate matt-spec-dev.yaml）
# 场景 1-3 = 前置分流三条：首跑直执行 / 空转轮（票全 done/skip）fail-fast / 批次目录断链 fail-fast。
# 场景 4-5 = phase-handoff-chaining（ADR-0019）：spec-resolve 真执行（real_execution）
#   探测 prev_handoff_paths 存在子集 / 无输入回归。
#
# ⚠ 本 fixture 不经任何自动化测试消费（simulate 只有 CLI 子命令；golden 测试用的是内联
# workflow）。改节点集合时手工跑一次 simulate 才不会烂在暗处。
#
# ⚠ 场景 4-5 的 real_execution 需要本地 fixture（`.scratch/` 被 gitignore，不随仓库走）：
#   .scratch/phase-handoff-chaining/sim/batch/{spec.md,issues/01-*.md}   ← 票要带
#   .scratch/phase-handoff-chaining/sim/prev-phase/handoff.md             `Status:` 行，
#   .scratch/phase-handoff-chaining/sim/prev-phase2/handoff.md            否则被票自检判空转
#   缺目录时两条场景以「batch dir not found」红 —— 那是缺件，不是回归。
scenarios:
  # =============================================================
  # Scenario 1: 首跑（round 1）— spec-resolve 定位底本 + 票自检通过
  #   → 票 DAG → review（含终检）→ ship
  # =============================================================
  - name: "first round — spec executed directly"
    inputs:
      batch_dir: ".scratch/20260905/llm-event-bus-1"
      is_final_phase: "false"
      task_artifacts_dir: "/Users/dev/.octopus/tasks/t-123/artifacts"
    mocks:
      spec-resolve:
        output: "PRECHECK OK: spec=.scratch/20260905/llm-event-bus-1/spec.md tickets=3 pending=3 repos=1 has_e2e=true branch=octopus-task-abc"
        update_vars:
          batch_ok: "true"
          batch_reason: ""
          spec_file: ".scratch/20260905/llm-event-bus-1/spec.md"
          branch: "octopus-task-abc"
          ticket_count: "3"
      ticket-dag:
        output: "3 tickets executed: 01 done, 02 done, 03-e2e done"
      code-review:
        output: '{"vars_update": {"review_status": "passed"}}'
        update_vars:
          review_status: "passed"
      ship-pr:
        output: '{"vars_update": {"pr_url": "https://github.com/XzhiF/octopus/pull/57"}}'
        update_vars:
          pr_url: "https://github.com/XzhiF/octopus/pull/57"
    assertions:
      status: "completed"
      vars:
        batch_ok: "true"
        review_status: "passed"
        pr_url: "https://github.com/XzhiF/octopus/pull/57"
      node_trace:
        executed:
          - spec-resolve
          - ticket-dag
          - code-review
          - ship-pr
        skipped:
          - fail-fast

  # =============================================================
  # Scenario 2: 空转轮 — 批次里没有待执行票（票全 done/skip）
  #   spec-resolve 静态自检分流 → fail-fast；ticket-dag 绝不执行
  #   （2026-09-16 三单 r2 实证：planner 产 0 节点 DAG → 整轮空转「虚假完成」）
  # =============================================================
  - name: "dead round — all tickets done/skip, fail-fast before planning"
    inputs:
      batch_dir: ".scratch/20260905/llm-event-bus-1"
      is_final_phase: "false"
      task_artifacts_dir: "/Users/dev/.octopus/tasks/t-123/artifacts"
    mocks:
      spec-resolve:
        output: 'PRECHECK FAILED: no pending ticket under .scratch/20260905/llm-event-bus-1/issues/ (all 3 are done/skip) — 打回请走 task-fix 修复轮；规格级返工由 task-author 改 spec 后重新入队'
        update_vars:
          batch_ok: "false"
          batch_reason: "no pending ticket under .scratch/20260905/llm-event-bus-1/issues/ (all 3 are done/skip) - see fix-round routing"
      fail-fast:
        status: "failed"
        error: "matt-spec-dev cannot run: no pending ticket"
    assertions:
      status: "failed"
      vars:
        batch_ok: "false"
      node_trace:
        executed:
          - spec-resolve
          - fail-fast
        skipped:
          - ticket-dag
          - code-review
          - ship-pr

  # =============================================================
  # Scenario 3: 反例 — 批次目录未 seed（绑定/链路断）
  #   spec-resolve 分流 → fail-fast 触发 → 工作流 failed，ticket-dag 绝不执行
  # =============================================================
  - name: "precheck fail — batch dir missing (seed broken)"
    inputs:
      batch_dir: ".scratch/20260905/ghost-phase-9"
      is_final_phase: "false"
      task_artifacts_dir: "/Users/dev/.octopus/tasks/t-123/artifacts"
    mocks:
      spec-resolve:
        output: 'PRECHECK FAILED: batch dir not found in workspace: .scratch/20260905/ghost-phase-9 (seed 下行未落盘?)'
        update_vars:
          batch_ok: "false"
          batch_reason: "batch dir not found in workspace: .scratch/20260905/ghost-phase-9 (seed 下行未落盘?)"
      fail-fast:
        status: "failed"
        error: "matt-spec-dev cannot run: batch dir not found"
    assertions:
      status: "failed"
      vars:
        batch_ok: "false"
      node_trace:
        executed:
          - spec-resolve
          - fail-fast
        skipped:
          - ticket-dag
          - code-review
          - ship-pr

  # =============================================================
  # Scenario 4: 前序交接探测（AC3 — phase-handoff-chaining）— spec-resolve
  #   **真执行**（real_execution），fixture 批次 = .scratch/phase-handoff-chaining/sim/batch
  #   （spec.md + issues/ 在场）。prev_handoff_paths 混合：真实相对路径 + ghost +
  #   Windows 式反斜杠虚构路径 → vars.prev_handoffs 只含存在者（换行 JSON-safe）、
  #   count=1，缺失静默过滤不 fail。
  # =============================================================
  - name: "prev-handoff probe — real spec-resolve filters missing paths silently"
    real_execution:
      - spec-resolve
    inputs:
      batch_dir: ".scratch/phase-handoff-chaining/sim/batch"
      is_final_phase: "false"
      prev_handoff_paths: |-
        .scratch/phase-handoff-chaining/sim/prev-phase/ghost-handoff.md
        .scratch/phase-handoff-chaining/sim/prev-phase/handoff.md
        C:\Users\ghost\.octopus\tasks\t-ghost\specs\prev\handoff.md
        .scratch/phase-handoff-chaining/sim/prev-phase2/handoff.md
    mocks:
      ticket-dag:
        output: "1 ticket executed: 01 done"
      code-review:
        output: '{"vars_update": {"review_status": "passed"}}'
        update_vars:
          review_status: "passed"
      ship-pr:
        output: '{"vars_update": {"pr_url": "https://github.com/XzhiF/octopus/pull/58"}}'
        update_vars:
          pr_url: "https://github.com/XzhiF/octopus/pull/58"
    assertions:
      status: "completed"
      vars:
        batch_ok: "true"
        spec_file: ".scratch/phase-handoff-chaining/sim/batch/spec.md"
        # 存在子集保序（第 2/4 行），ghost 与 Windows 式反斜杠虚构路径静默过滤；
        # 多条经 JSON \n 转义换行连接
        prev_handoffs: |-
          .scratch/phase-handoff-chaining/sim/prev-phase/handoff.md
          .scratch/phase-handoff-chaining/sim/prev-phase2/handoff.md
        prev_handoff_count: "2"
      node_trace:
        executed:
          - spec-resolve
          - ticket-dag
          - ship-pr
        skipped:
          - fail-fast

  # =============================================================
  # Scenario 5: 回归（AC4）— 无 prev_handoff_paths 输入（首 phase/v3 式绑定）时
  #   spec-resolve 真执行行为与改前一致：precheck 照常 OK，prev_* 停在初始值
  #   （"" / "0"），不 fail、不引入路由变化。
  # =============================================================
  - name: "no prev input — spec-resolve behaves exactly as before (regression)"
    real_execution:
      - spec-resolve
    inputs:
      batch_dir: ".scratch/phase-handoff-chaining/sim/batch"
      is_final_phase: "false"
    mocks:
      ticket-dag:
        output: "1 ticket executed: 01 done"
      code-review:
        output: '{"vars_update": {"review_status": "passed"}}'
        update_vars:
          review_status: "passed"
      ship-pr:
        output: '{"vars_update": {"pr_url": "https://github.com/XzhiF/octopus/pull/59"}}'
        update_vars:
          pr_url: "https://github.com/XzhiF/octopus/pull/59"
    assertions:
      status: "completed"
      vars:
        batch_ok: "true"
        spec_file: ".scratch/phase-handoff-chaining/sim/batch/spec.md"
        prev_handoffs: ""
        prev_handoff_count: "0"
      node_trace:
        executed:
          - spec-resolve
          - ticket-dag
          - ship-pr
        skipped:
          - fail-fast
