<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S5 · 静默终端 TUI — Octopus</title>
<style>
/* ============ S5 TUI · Claude Code 流派 ============
   核心隐喻：一屏 = 一个会话。顶部分区标签，单栏信息流，底部键位行。
   无窗口、无浮层、无拖拽 —— 但比 v5 克制一百倍：暖黑 + 骨白 + 一点琥珀，
   没有雨没有辉光。他们仓库已有整站 TUI 换肤的前作，这条路心理门槛最低。 */
:root {
  --bg: #141210; --bg-2: #191714; --bg-3: #1e1c18;
  --ink: #e8e2d2; --muted: #a49d8b; --faint: #6b6555; --line: #2c2921;
  --amber: #e0a458; --amber-dim: #8a6a3c;
  --ok: #9ece6a; --warn: #e0af68; --danger: #f7768e; --info: #7dcfff;
  --mono: ui-monospace, "SF Mono", Menlo, "Cascadia Code", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font: 13px/1.75 var(--mono); background: var(--bg); color: var(--ink); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; border: 0; outline: none; background: none; width: 100%; }
::selection { background: #3a3527; }

.term { height: 100vh; display: flex; flex-direction: column; }

/* tab bar */
.tabbar { display: flex; align-items: center; background: var(--bg-2); border-bottom: 1px solid var(--line); padding: 0 10px; height: 34px; gap: 2px; flex: none; }
.tabbar .logo { color: var(--amber); margin-right: 12px; font-weight: 700; }
.tab { padding: 3px 13px; border-radius: 5px; color: var(--muted); font-size: 12px; display: flex; gap: 7px; align-items: center; }
.tab:hover { background: var(--bg-3); color: var(--ink); }
.tab.on { background: #292519; color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber-dim); }
.tab .n { color: var(--danger); font-size: 10px; }
.tabbar .right { margin-left: auto; color: var(--faint); font-size: 11px; padding-right: 6px; }

/* main scroll buffer */
.buf { flex: 1; overflow: auto; padding: 18px 22px 12px; }
.inner { max-width: 900px; }
.ln { white-space: pre-wrap; word-break: break-word; }
.dim { color: var(--muted); } .faint { color: var(--faint); }
.ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--danger); } .info { color: var(--info); }
.amb { color: var(--amber); }
.h { color: var(--amber); font-weight: 700; margin: 18px 0 6px; }
.h::before { content: "── "; color: var(--faint); font-weight: 400; }
.h::after { content: " ─────────────────────────────"; color: var(--line); }

.row { padding: 5px 8px; border-radius: 5px; cursor: pointer; display: block; width: 100%; text-align: left; }
.row:hover { background: var(--bg-3); }
.row.on { background: #232017; box-shadow: inset 2px 0 0 var(--amber); }
.row .caret { color: var(--amber); }

.bar { display: inline-block; width: 150px; color: var(--ok); }
.bar i { color: var(--faint); font-style: normal; }
.bar.w { color: var(--warn); }

/* card-in-stream (TUI bordered box) */
.box { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; }
.box .bh { padding: 6px 10px; border-bottom: 1px dashed var(--line); color: var(--muted); font-size: 12px; display: flex; gap: 10px; }
.box .bh b { color: var(--ink); }
.box .bb { padding: 9px 12px; }
.btn { border: 1px solid var(--amber-dim); color: var(--amber); border-radius: 4px; padding: 0 10px; font-size: 12px; }
.btn:hover { background: var(--amber); color: #17130a; }
.btn.q { border-color: var(--line); color: var(--muted); } .btn.q:hover { background: var(--bg-3); color: var(--ink); }
.btn.d { border-color: #6b3a42; color: var(--danger); } .btn.d:hover { background: var(--danger); color: #17130a; }

.kv { display: grid; grid-template-columns: 200px 1fr; gap: 2px 16px; }
.kv .k { color: var(--muted); }
.kv .v { color: var(--ink); }

/* status bar */
.statusbar { flex: none; border-top: 1px solid var(--line); background: #191510; padding: 5px 12px; display: flex; gap: 18px; font-size: 11px; color: var(--muted); }
.statusbar b { color: var(--amber); font-weight: 400; }
.statusbar .right { margin-left: auto; }

/* input line */
.inputline { flex: none; display: flex; gap: 9px; padding: 8px 14px 12px; align-items: baseline; }
.inputline .p { color: var(--amber); font-weight: 700; }
.inputline input { caret-color: var(--amber); }
.inputline input::placeholder { color: var(--faint); }

.blink { animation: bl 1.15s steps(1) infinite; color: var(--amber); }
@keyframes bl { 50% { opacity: 0; } }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #241f14; border: 1px solid var(--amber-dim); color: var(--amber); font-size: 12px; padding: 5px 16px; border-radius: 5px; opacity: 0; transition: .18s; z-index: 60; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="term">
  <nav class="tabbar" id="tabbar">
    <span class="logo">◆ octopus</span>
    <button class="tab on" data-v="today">今天</button>
    <button class="tab" data-v="tasks">任务<span class="n">·</span></button>
    <button class="tab" data-v="runs">运行<span class="n">3</span></button>
    <button class="tab" data-v="agent">agent</button>
    <button class="tab" data-v="wiki">wiki</button>
    <span class="right">open-octopus ▾ (⌥→)</span>
  </nav>

  <main class="buf" id="buf"></main>

  <div class="statusbar" id="statusbar">
    <span><b>NORMAL</b> — octopus</span><span class="dim" id="sbRun">3 running</span><span class="warn" id="sbWait">2 needs-you</span>
    <span class="right">$42.18 · <span id="clk"></span> · 1.0.0</span>
  </div>
  <div class="inputline"><span class="p">❯</span><input id="cmd" placeholder="输入 : 走命令，直接打字 = 问主 agent（:help 看键位）" autocomplete="off" /></div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* fake data */
const T = [
  { id: "T-01", t: "feat-desktop-shell", c: "run", p: 68, m: "build 3/6 · agent · $0.84" },
  { id: "T-02", t: "task-acceptance r2", c: "wait", p: 80, m: "4/5 探针 · 焦点顺序等你" },
  { id: "T-03", t: "nightly-compile", c: "queue", p: 0, m: "cron 0 2 * * * · 预算 $2" },
  { id: "T-04", t: "harness P0", c: "done", p: 100, m: "merged · 6 probes green" },
];
let V = "today";
const pbar = (p, w = 20, cls = "") => '<span class="bar ' + cls + '">' + "█".repeat(Math.round(p / 100 * w)) + '<i>' + "░".repeat(20 - Math.round(p / 100 * w)) + "</i></span> " + String(p).padStart(3) + "%";
const cls = { run: "ok", wait: "warn", queue: "info", done: "faint" };
const glyph = { run: "▶", wait: "⸻", queue: "◷", done: "✓" };

const VIEW = {
  today() {
    return '<div class="ln dim">┌ open-octopus · 2026-10-20 周一 · uptime 3d04h ─────────────────────────────┐</div>' +
      '<div class="ln">  系统状态   <span class="ok">● nominal</span>     今日花费 <span class="amb">$42.18</span>/55     7d 通过率 <span class="ok">96.4% ↑1.8</span></div>' +
      '<div class="ln dim">└──────────────────────────────────────────────────────────────────┘</div>' +
      '<div class="h">等你决定 (2)</div>' +
      '<div class="box"><div class="bh"><b>批准部署 → prod</b><span class="warn">⚠ 剩 40m 窗口</span><span style="margin-left:auto">harness guard</span></div><div class="bb"><button class="btn" data-a="approve T-01">y 批准</button>  <button class="btn d" data-a="reject">n 打回</button>  <button class="btn q" data-a="diff">diff +892 −14</button></div></div>' +
      '<div class="box"><div class="bh"><b>窗口模型选型</b><span class="info">agent 在等</span></div><div class="bb"><button class="btn" data-a="answer">a 去回答（1/2/3 单选）</button></div></div>' +
      '<div class="h">正在跑</div>' +
      T.filter((t) => t.c === "run" || t.c === "wait").map((t) => '<button class="row" data-open="' + t.id + '"><span class="' + cls[t.c] + '">' + glyph[t.c] + '</span> <span class="amb">' + t.id + '</span> ' + esc(t.t).padEnd(26) + pbar(t.p, 20, t.c === "wait" ? "w" : "") + '  <span class="faint">' + esc(t.m) + "</span></button>").join("") +
      '<div class="h">最近</div>' +
      '<div class="ln faint">  ✓ 17:40 clone·research-scout —— 4 findings → wiki/sources</div>' +
      '<div class="ln faint">  ✓ 15:02 #79 知识中心改版 merged (ADR-0033)</div>' +
      '<div class="ln dim">  … :tasks 看全部 · :runs 看日志 · ❯ 直接说</div>';
  },
  tasks() {
    return '<div class="ln dim">  [排队]            [进行中]          [验收]            [完成]</div>' +
      '<div class="ln">' +
      "  " + '<span class="info">◷ T-03</span> nightly   ' + "  " + '<span class="ok">▶ T-01</span> desktop ' + "  " + '<span class="warn">⸻ T-02</span> accept  ' + "  " + '<span class="faint">✓ T-04</span> harness' + "</div>" +
      '<div class="ln">  <span class="faint">  cron 02:00     </span>  ' + "  " + pbar(68) + "   " + "  " + pbar(80, 20, "w") + "      " + "  " + '<span class="faint">  merged        </span></div>' +
      '<div class="ln dim">  </span>◷ M-02 SEO audit     ▶ M-01 landing 68%   …                        ✓ #79 知识中心</div>' +
      '<div class="h">选中 · T-01 feat-desktop-shell</div>' +
      '<div class="kv">' +
      '<span class="k">phases</span><span class="v"><span class="ok">✓ plan</span> <span class="ok">✓ scaffold</span> <span class="amb">● build 68%</span> <span class="faint">○ test</span> <span class="faint">○ review</span> <span class="faint">○ approval</span></span>' +
      '<span class="k">acceptance</span><span class="v"><span class="ok">[x]</span> rail 直达 · <span class="ok">[x]</span> 看板联动 · <span class="ok">[x]</span> 吸附 · <span class="warn">[ ]</span> 主题持久化</span>' +
      '<span class="k">branch</span><span class="v">feat/desktop-v6 · worktree .worktrees/feat-desktop-v6</span></div>' +
      '<div class="ln" style="margin-top:8px"><button class="btn" data-a="run T-03">▶ 运行 T-03</button>  <button class="btn q" data-a="tab">↵ 打开完整面板</button>  <button class="btn q" data-a="new">+ 新任务 (n)</button></div>';
  },
  runs() {
    return '<div class="h">R-91 · feat-desktop-shell <span class="ok">● streaming</span></div>' +
      '<div class="ln dim">  [plan]<span class="ok">✓</span>──[scaffold]<span class="ok">✓</span>──<span class="amb">[build]●</span>──[test]○──[review]○──[approval]○</div>' +
      '<div class="box"><div class="bb" id="logstream" style="max-height:240px;overflow:auto">' +
      '<div class="ln dim">19:15:03 <span class="ok">ok</span>   node build 3/6 · wm smoke green</div>' +
      '<div class="ln dim">19:16:20 ──  write assets/app.css · 890 lines</div>' +
      '<div class="ln dim">19:17:02 <span class="warn">!!</span>   snap z-order conflict → fixed at layer 400</div>' +
      '<div class="ln dim">19:18:11 ──  chunk 4/9 · tokens 3.1k · cache hit 92.0%</div>' +
      '<div class="ln">19:18:40 <span class="ok">ok</span>   test scaffold green <span class="blink">▊</span></div></div></div>' +
      '<div class="h">账</div><div class="kv"><span class="k">tokens</span><span class="v">in 82k · out 128k · cached 1.4M (92.0%)</span><span class="k">cost</span><span class="v">$0.84 · 今日累计 $42.18/$55</span><span class="k">elapsed</span><span class="v">18m · node 3/6 · budget ok</span></div>' +
      '<div class="ln" style="margin-top:8px"><button class="btn d" data-a="abort">⏹ 中止 (x)</button>  <button class="btn q" data-a="pause">⏸ 暂停 (p)</button>  <button class="btn q" data-a="follow">⧉ 跟随尾部: <span class="ok">on</span></button></div>';
  },
  agent() {
    return '<div class="h">main · 跨任务常驻 · opus · ctx 42%</div>' +
      '<div class="ln"><span class="amb">你 ❯</span> 五种风格桌面感排序？</div>' +
      '<div class="ln dim">  <span class="info">[READ]</span> prototype/desktop-v6 → 对照五稿 ───────────── 2.1s <span class="ok">✓</span></div>' +
      '<div class="ln">  main ▸ 桌面感（空间纵深）：<span class="amb">S4 全景 &gt; S2 工作台 &gt; S5 本稿的"会话感" &gt; S1 聚光灯 &gt; S3 活动流</span>；</div>' +
      '<div class="ln">         上手门槛倒过来排。我的建议：拿 S2 当骨架，把 S4 那面墙做「今天」的总览页 —— 纵深和熟悉度都拿到。</div>' +
      '<div class="ln" style="margin-top:10px"><span class="amb">❯</span> <span class="faint">_ 说点什么（: 开头走命令）</span></div>';
  },
  wiki() {
    return '<div class="h">wiki · compiled knowledge</div>' +
      '<button class="row" data-open="win"><span class="amb">▸ window-model</span> <span class="faint">── 214 sources · 今天 09:12 · [ref:src-077]</span></button>' +
      '<div class="box"><div class="bb">' +
      '<div class="ln">窗口是<span class="amb">持久状态的视图</span>。关闭只释放视图 —— run 继续流，几何/滚动位置回到 localStorage。</div>' +
      '<div class="ln dim">open ──min──▸ shelf ──close──▸ closed ──⌘K/❯ open tasks──▸ open</div>' +
      '<div class="ln" style="margin-top:6px">▸ NEXUS 修正：v4 去掉 rail 后十步模块直达率 1→3；v5/v6 回归 ⌥N。</div>' +
      "</div></div>" +
      '<button class="row"><span class="faint">▸ workflow-engine</span> <span class="faint">── 7 executors</span></button>' +
      '<button class="row"><span class="faint">▸ harness-integration</span> <span class="warn"> ⚠ stale</span></button>' +
      '<button class="row"><span class="faint">▸ token-ledger</span></button>';
  },
};

function render() { $("#buf").innerHTML = '<div class="inner">' + VIEW[V]() + "</div>"; $("#buf").scrollTop = 0; syncTabs(); }
function syncTabs() { document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.v === V)); $("#statusbar b").textContent = V.toUpperCase(); }

let tt; const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800); };

document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-v]"); if (tab) { V = tab.dataset.v; render(); return; }
  const a = e.target.closest("[data-a]");
  if (a) { const act = a.dataset.a;
    if (act.startsWith("approve")) { toast("✓ 已批准 · 部署继续"); T[0].c = "done"; T[0].p = 100; $("#sbWait").textContent = "1 needs-you"; render(); }
    else if (act.startsWith("run")) { toast("▶ T-03 已提前运行 → :runs"); T[2].c = "run"; render(); }
    else if (act === "new") { const t = prompt("任务标题"); if (t) { T.push({ id: "T-0" + T.length + 1, t, c: "queue", p: 0, m: "from TUI" }); toast("+ " + t + " → 排队"); render(); } }
    else toast(a.textContent.trim() + "（演示）");
    return; }
  const o = e.target.closest("[data-open]");
  if (o) { V = "runs"; render(); return; }
});

/* :commands + natural language → agent */
const cmd = $("#cmd");
cmd.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const v = cmd.value.trim(); cmd.value = "";
  if (!v) return;
  if (v.startsWith(":")) {
    const c = v.slice(1).toLowerCase();
    if (["tasks", "runs", "today", "agent", "wiki"].includes(c)) { V = c; render(); }
    else if (c === "help") toast(":tasks :runs :agent :wiki :today · q/1-5 · y 批准 · x 中止 · n 新任务");
    else if (c === "q") toast("浏览器里就不退了 🙂");
    else toast("?: " + c + " —— :help 看键位");
  } else { toast("❯ 交给 main：" + v.slice(0, 30)); V = "agent"; render(); }
});
document.addEventListener("keydown", (e) => {
  if (document.activeElement === cmd) return;
  const map = { "1": "today", "2": "tasks", "3": "runs", "4": "agent", "5": "wiki" };
  if (map[e.key]) { V = map[e.key]; render(); }
  if (e.key === ":") { e.preventDefault(); cmd.focus(); }
  if (e.key === "i") { cmd.focus(); }
});

/* live: run log stream + progress */
const POOL = ["19:19:02 ──  review swarm 2/5 agents","19:19:31 <span class='ok'>ok</span>   typecheck pass · 0 errors","19:20:05 ──  css bundle 41kb","19:20:44 <span class='warn'>!!</span>   e2e probe focus-order retry 1/2"];
setInterval(() => { const lg = $("#logstream"); if (!lg) return;
  const d = document.createElement("div"); d.className = "ln"; d.style.opacity = 0; d.innerHTML = POOL[Math.floor(Date.now() / 3000) % POOL.length].replace(/^\d[\d:.]+/, new Date().toLocaleTimeString("en-GB"));
  lg.appendChild(d); requestAnimationFrame(() => { d.style.transition = "opacity .4s"; d.style.opacity = 1; }); lg.scrollTop = 1e6;
  if (V === "today" || V === "tasks") { const t = T[0]; if (t.p < 97) { t.p = Math.min(97, t.p + 1); } }
}, 3000);
setInterval(() => { $("#clk").textContent = new Date().toLocaleTimeString("en-GB"); }, 1000);
$("#clk").textContent = new Date().toLocaleTimeString("en-GB");
render();
})();
</script>
</body>
</html>
