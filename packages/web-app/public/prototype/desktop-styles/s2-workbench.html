<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S2 · 工作台 Workbench — Octopus</title>
<style>
/* ============ S2 Workbench · VS Code/Cursor 流派 ============
   核心隐喻：任务像文件一样开成"标签页"；左模块、中标签、右 Agent 常驻。
   程序员零学习成本 —— 这就是他们每天开着的那个东西。桌面感来自面板与标签，不来自浮窗。 */
:root {
  --bg: #f7f6f4; --side: #efeeea; --panel: #ffffff; --ink: #1e1d1b; --muted: #6a6862; --faint: #9d9b94;
  --line: #e4e2dc; --line-soft: #eceae4; --wash: #f2f0eb;
  --accent: #3f6ad8; --accent-wash: #edf1fb; --sel: #dbe4f6;
  --ok: #2e7d4f; --ok-wash: #eaf4ee; --warn: #96660f; --warn-wash: #f8f1df; --danger: #b93a3a;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font: 13px/1.6 var(--sans); background: var(--bg); color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; border: 0; outline: none; background: none; }
::selection { background: var(--sel); }
.mono { font-family: var(--mono); }

.app { display: grid; grid-template-rows: 40px 1fr 26px; height: 100vh; }

/* titlebar: workspace pills + command */
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--side); border-bottom: 1px solid var(--line); }
.tb-brand { display: flex; gap: 7px; align-items: center; font-weight: 650; }
.tb-brand svg { width: 14px; height: 14px; stroke: var(--accent); fill: none; stroke-width: 1.9; }
.ws-pills { display: flex; gap: 3px; margin-left: 14px; }
.ws { font-size: 12px; padding: 3px 11px; border-radius: 7px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.ws .wd { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.ws:hover { background: var(--wash); }
.ws.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.07); font-weight: 550; }
.ws.on .wd { background: var(--accent); }
.cmd { margin: 0 auto; display: flex; align-items: center; gap: 8px; width: min(360px, 34vw); justify-content: center; font-size: 12.5px; color: var(--faint); border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 12px; }
.cmd:hover { color: var(--muted); border-color: #d4d1c9; }
.cmd kbd { font: 10px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--faint); }
.tb-right { display: flex; gap: 6px; align-items: center; color: var(--faint); font-size: 12px; }

/* body: rail | main | agent */
.body { display: flex; min-height: 0; }
.rail { width: 52px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px; }
.rail button { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); position: relative; }
.rail button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.rail button:hover { background: var(--wash); color: var(--ink); }
.rail button.on { background: var(--panel); color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
.rail .badge { position: absolute; top: 4px; right: 4px; min-width: 14px; height: 14px; border-radius: 8px; background: var(--warn); color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; padding: 0 3px; }
.rail .tip { position: absolute; left: 46px; top: 50%; transform: translateY(-50%) translateX(-4px); background: #26241f; color: #f2efe8; font-size: 11px; padding: 3px 9px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: .12s; z-index: 60; }
.rail button:hover .tip { opacity: 1; transform: translateY(-50%); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
.tabs { display: flex; background: var(--side); border-bottom: 1px solid var(--line); min-height: 34px; overflow-x: auto; }
.tab { display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; color: var(--muted); border-right: 1px solid var(--line); white-space: nowrap; cursor: pointer; }
.tab .st { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.tab .st.live { background: var(--ok); } .tab .st.wait { background: var(--warn); }
.tab.on { background: var(--panel); color: var(--ink); font-weight: 550; box-shadow: inset 0 2px 0 var(--accent); }
.tab .x { border-radius: 5px; width: 16px; height: 16px; display: grid; place-items: center; font-size: 11px; color: var(--faint); }
.tab .x:hover { background: var(--wash); color: var(--ink); }

.panes { flex: 1; display: flex; min-height: 0; }
.pane-list { width: 270px; flex: none; border-right: 1px solid var(--line-soft); overflow: auto; background: var(--bg); }
.pl-cap { font-size: 10.5px; letter-spacing: .08em; color: var(--faint); font-weight: 700; padding: 10px 12px 4px; text-transform: uppercase; display: flex; }
.pl-cap .n { margin-left: auto; font-family: var(--mono); }
.item { padding: 8px 12px; border-radius: 8px; margin: 0 6px; cursor: pointer; }
.item:hover { background: var(--wash); }
.item.on { background: var(--accent-wash); box-shadow: inset 2px 0 0 var(--accent); }
.item .ti { font-size: 12.5px; font-weight: 550; display: flex; gap: 7px; align-items: center; }
.item .tm { font-size: 11px; color: var(--faint); display: flex; gap: 6px; margin-top: 1px; }
.item .mini { height: 3px; border-radius: 2px; background: var(--line); margin-top: 5px; overflow: hidden; }
.item .mini i { display: block; height: 100%; background: var(--accent); }
.dotk { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
.dotk.live { background: var(--ok); } .dotk.wait { background: var(--warn); } .dotk.done { background: var(--accent); }

.pane-detail { flex: 1; min-width: 0; overflow: auto; padding: 18px 22px 30px; }
.pd-head h2 { font-size: 17px; letter-spacing: -.01em; }
.pd-head .meta { color: var(--faint); font-size: 11.5px; margin: 2px 0 12px; display: flex; gap: 10px; font-family: var(--mono); }
.pd-acts { display: flex; gap: 6px; margin-bottom: 16px; }
.btn { font-size: 12px; padding: 4px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); }
.btn:hover { background: var(--wash); }
.btn.hot { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ok { color: var(--ok); border-color: #cfe2d6; background: var(--ok-wash); }
.btn.no { color: var(--danger); border-color: #e8cfcd; background: #faefee; }
.psplit { display: flex; gap: 18px; }
.psplit > div { flex: 1; min-width: 0; }
h4.sec { font-size: 11px; letter-spacing: .09em; color: var(--faint); text-transform: uppercase; margin-bottom: 8px; }
.ph { display: flex; gap: 9px; padding: 5px 0; font-size: 12.5px; border-bottom: 1px dashed var(--line-soft); }
.ph .g { width: 16px; text-align: center; }
.ph.d .g { color: var(--ok); } .ph.r .g { color: var(--accent); } .ph.n .g { color: var(--faint); }
.ph .pm { margin-left: auto; color: var(--faint); font-size: 11px; }
.chk { display: flex; gap: 8px; padding: 4px 0; font-size: 12.5px; }
.chk .c { font-family: var(--mono); color: var(--ok); }
.chk.no .c { color: var(--warn); } .chk.no { color: var(--muted); }
.term { font: 11.5px/1.85 var(--mono); background: #191817; color: #d6d1c6; border-radius: 9px; padding: 11px 13px; margin-top: 8px; height: 200px; overflow: auto; }
.term .ok { color: #8fd6a8; } .term .wn { color: #e6bd75; } .term .dim { color: #7c766a; }
.gflow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 10px; }
.gn { border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; font-size: 11.5px; color: var(--muted); background: var(--bg); }
.gn b { display: block; font-size: 10px; color: var(--faint); font-weight: 500; }
.gn.d { border-color: #bcd9c6; background: var(--ok-wash); color: var(--ok); }
.gn.r { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.gn.r::after { content: " ▊"; animation: blink 1s steps(1) infinite; }
.ar { color: var(--faint); font-size: 10px; }
@keyframes blink { 50% { opacity: 0; } }

/* agent column */
.agent { width: 340px; flex: none; border-left: 1px solid var(--line-soft); background: var(--bg); display: flex; flex-direction: column; }
.ag-head { padding: 9px 14px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
.ag-head .on { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.ag-head .ctx { margin-left: auto; font: 10.5px var(--mono); color: var(--faint); font-weight: 400; }
.ag-log { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 12.5px; }
.ag-u { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.ag-a { color: var(--ink); } .ag-a p { margin: 2px 0 6px; }
.ag-card { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; font-size: 11.5px; }
.ag-card .k { color: var(--faint); font-family: var(--mono); font-size: 10.5px; }
.ag-in { border-top: 1px solid var(--line-soft); padding: 9px 12px; display: flex; gap: 8px; align-items: center; }
.ag-in input { flex: 1; font-size: 12.5px; }
.ag-in .send { width: 24px; height: 24px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 12px; }

/* status bar */
.status { display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--ink); color: #cfc9bd; font: 11px var(--mono); }
.status .g { color: #8fd6a8; } .status .w { color: #e6bd75; }
.status .right { margin-left: auto; display: flex; gap: 16px; }
.status .it:hover { color: #fff; }

.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 7px 16px; border-radius: 8px; opacity: 0; transition: .2s; z-index: 99; }
.toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <span class="tb-brand"><svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9 9-9Z"/><circle cx="12" cy="12" r="2.2"/></svg>octopus</span>
    <div class="ws-pills" id="wsPills"></div>
    <button class="cmd"><span>搜索任务 / 运行 / 或说一句话…</span><kbd>⌘K</kbd></button>
    <div class="tb-right"><span class="mono" id="cost">$42.18</span> · <span>ZF</span></div>
  </div>

  <div class="body">
    <nav class="rail" id="rail"></nav>

    <div class="main">
      <div class="tabs" id="tabs"></div>
      <div class="panes">
        <div class="pane-list" id="list"></div>
        <div class="pane-detail" id="detail"></div>
      </div>
    </div>

    <aside class="agent">
      <div class="ag-head"><span class="on"></span>主 Agent<span class="ctx">opus · ctx 42%</span></div>
      <div class="ag-log" id="agLog"></div>
      <div class="ag-in"><input id="agI" placeholder="问它任何事…" /><button class="send" id="agS">↑</button></div>
    </aside>
  </div>

  <div class="status">
    <span class="it g">● 3 running</span><span class="it w">⚠ 2 needs-you</span><span class="it">✓ 96.4% 7d</span>
    <span class="right"><span class="it" id="clk">--:--:--</span><span class="it">⌘K</span><span class="it">esc 关标签</span><span class="it">octopus 1.0 · personal</span></span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const SP = { kanban: '<svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="5" height="16" rx="1.2"/><rect x="10.5" y="4" width="5" height="10" rx="1.2"/><rect x="17.5" y="4" width="3" height="13" rx="1.2"/></svg>',
  activity: '<svg viewBox="0 0 24 24"><path d="M3 12.5h4l2.5-7 4 13.5L16 12.5h5"/></svg>',
  home: '<svg viewBox="0 0 24 24"><path d="M4.5 17.5a8.5 8.5 0 1 1 15 0"/><path d="M12 14.5 15.5 9.5"/></svg>',
  bot: '<svg viewBox="0 0 24 24"><rect x="5" y="8.5" width="14" height="10" rx="2.5"/><path d="M12 4.5v4M10 13h.01M14 13h.01M10 16h4"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l2.8 2.2"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M12 6.3C10.3 4.8 8 4.2 4.5 4.2v14c3.5 0 5.8.6 7.5 2.1 1.7-1.5 4-2.1 7.5-2.1v-14c-3.5 0-5.8.6-7.5 2.1Z"/><path d="M12 6.3v14"/></svg>',
  layers: '<svg viewBox="0 0 24 24"><path d="m12 3 8 4.5-8 4.5L4 7.5 12 3Z"/><path d="m4 12 8 4.5L20 12"/><path d="m4 16.5 8 4.5 8-4.5"/></svg>',
  sliders: '<svg viewBox="0 0 24 24"><path d="M4 8h9M18.5 8H20M4 16h2M11 16h9"/><circle cx="15.5" cy="8" r="2.2"/><circle cx="8" cy="16" r="2.2"/></svg>' };

const TASKS = [
  { id: "T-01", t: "Desktop 重构 v6", st: "live", col: "进行中", p: 68, meta: "feat/desktop-v6 · $0.84",
    phases: [["d","plan","2.1s"],["d","scaffold","14s"],["r","build · 窗口几何回归","进行中"],["n","test"],["n","review (swarm)"],["n","approval"]],
    checks: [[1,"rail ⌥1-8 直达"],[1,"看板↔详情联动"],[1,"拖拽/缩放/吸附"],[0,"明暗主题持久化"]],
    logs: ["19:15 ok node 3/6 · wm smoke","19:16 — write app.css 890 lines","19:17 ! snap z conflict → fixed 400"] },
  { id: "T-02", t: "Task acceptance · r2", st: "wait", col: "验收", p: 80, meta: "4/5 探针 · 等你复验",
    phases: [["d","看板走查"],["d","Run 详情走查"],["r","键盘焦点顺序","等你"]],
    checks: [[1,"卡片→详情开窗"],[1,"切换不丢状态"],[0,"focus ring 顺序"]],
    logs: ["18:58 ! probe5 focus-order waiting 42m"] },
  { id: "T-03", t: "nightly-knowledge-compile", st: "", col: "排队", p: 0, meta: "cron 0 2 * * * · 预算 $2",
    phases: [["n","index"],["n","compile 214p"],["n","prune"]], checks: [[0,"预算内完成"]], logs: ["-- queued"] },
  { id: "T-04", t: "harness 接入 P0", st: "done", col: "完成", p: 100, meta: "6 probes green · merged",
    phases: [["d","forensics"]], checks: [[1,"结论入册"]], logs: ["17:40 ok done → wiki"] },
  { id: "M-02", t: "SEO 技术审计", st: "live", col: "进行中", p: 22, meta: "marketing · cwv", phases: [["r","audit"],["n","report"]], checks: [], logs: ["19:30 — parsing sitemap"] },
];
let tabOpen = ["T-01", "T-04"], tabOn = "T-01", filter = "";

/* rail */
const RAIL = [["home","今天",0],["kanban","任务",0],["activity","运行",0],["bot","Agent",3],["clock","调度",0],["book","Wiki",0],["layers","资源",0],["sliders","系统",0]];
$("#rail").innerHTML = RAIL.map(([k, l, b], i) => "<button data-rail='" + k + "' class='" + (k === "kanban" ? "on" : "") + "'>" + SP[k] + (b ? '<span class="badge">' + b + "</span>" : "") + '<span class="tip">' + l + " · " + (i + 1) + "</span></button>").join("");

/* workspace pills */
$("#wsPills").innerHTML = ["open-octopus", "marketing", "research"].map((s, i) => '<button class="ws ' + (i === 0 ? "on" : "") + '"><span class="wd"></span>' + s + "</button>").join("");

function renderList() {
  const groups = {};
  TASKS.forEach((t) => { if (!filter || (t.t + t.id).toLowerCase().includes(filter.toLowerCase())) (groups[t.col] = groups[t.col] || []).push(t); });
  $("#list").innerHTML = ["进行中", "验收", "排队", "完成"].map((g) => {
    const ts = groups[g] || [];
    return '<div class="pl-cap">' + g + '<span class="n">' + ts.length + "</span></div>" + ts.map((t) =>
      '<div class="item ' + (t.id === tabOn ? "on" : "") + '" data-task="' + t.id + '"><div class="ti"><span class="dotk ' + t.st + '"></span>' + esc(t.t) + "</div>" +
      '<div class="tm"><span class="mono">' + t.id + "</span><span>" + esc(t.meta) + "</span></div>" +
      (t.p ? '<div class="mini"><i style="width:' + t.p + '%"></i></div>' : "") + "</div>").join("");
  }).join("");
}
function renderTabs() {
  $("#tabs").innerHTML = tabOpen.map((id) => { const t = TASKS.find((x) => x.id === id);
    return '<div class="tab ' + (id === tabOn ? "on" : "") + '" data-task="' + id + '"><span class="st ' + t.st + '"></span>' + esc(t.t) + '<span class="x" data-close="' + id + '">✕</span></div>'; }).join("");
}
function renderDetail() {
  const t = TASKS.find((x) => x.id === tabOn);
  $("#detail").innerHTML = '<div class="pd-head"><h2>' + esc(t.t) + '</h2><div class="meta"><span>#' + t.id + "</span><span>" + t.col + ' · ' + t.p + '%</span><span>' + esc(t.meta) + "</span></div></div>" +
    '<div class="pd-acts">' + (t.col !== "完成" ? '<button class="btn hot" data-a="run">▶ ' + (t.col === "排队" ? "运行" : "重跑") + "</button>" : "") +
    (t.col === "验收" ? '<button class="btn ok" data-a="ok">验收通过</button><button class="btn no" data-a="no">打回</button>' : "") +
    '<button class="btn" data-a="log">终端</button><button class="btn" data-a="wiki">规格</button></div>' +
    '<div class="psplit"><div><h4 class="sec">阶段 Phases</h4>' +
    t.phases.map((p) => '<div class="ph ' + p[0] + '"><span class="g">' + (p[0] === "d" ? "✓" : p[0] === "r" ? "●" : "○") + "</span><span>" + esc(p[1]) + "</span>" + (p[2] ? '<span class="pm">' + esc(p[2]) + "</span>" : "") + "</div>").join("") +
    (t.checks.length ? "<h4 class='sec' style='margin-top:14px'>验收 Acceptance</h4>" + t.checks.map((c) => '<div class="chk ' + (c[0] ? "" : "no") + '"><span class="c">' + (c[0] ? "[x]" : "[ ]") + "</span><span>" + esc(c[1]) + "</span></div>").join("") : "") +
    '</div><div><h4 class="sec">执行节点</h4><div class="gflow">' +
    t.phases.slice(0, 4).map((p, i) => (i ? '<span class="ar">▸</span>' : "") + '<span class="gn ' + (p[0] === "d" ? "d" : p[0] === "r" ? "r" : "") + '"><b>' + (i + 1) + "</b>" + esc(p[1].split(" ")[0]) + "</span>").join("") + "</div>" +
    '<h4 class="sec">输出 Output</h4><div class="term" id="term">' + t.logs.map((l) => '<div class="' + (l.includes("ok") ? "ok" : l.includes("!") ? "wn" : "dim") + '">' + esc(l) + "</div>").join("") + "</div></div></div>";
}
const refreshAll = () => { renderList(); renderTabs(); renderDetail(); };
refreshAll();

let tt; const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800); };

document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-close]");
  if (c) { tabOpen = tabOpen.filter((x) => x !== c.dataset.close); if (tabOn === c.dataset.close) tabOn = tabOpen[0] || TASKS[0].id; refreshAll(); return; }
  const it = e.target.closest("[data-task]");
  if (it) { tabOn = it.dataset.task; if (!tabOpen.includes(tabOn)) tabOpen.push(tabOn); refreshAll(); return; }
  const a = e.target.closest("[data-a]");
  if (a) { const t = TASKS.find((x) => x.id === tabOn);
    if (a.dataset.a === "ok") { t.col = "完成"; t.st = "done"; toast("✓ " + t.id + " 已验收 → 完成"); refreshAll(); }
    if (a.dataset.a === "no") { t.col = "进行中"; t.st = "live"; toast("↩ " + t.id + " 打回 → 进行中"); refreshAll(); }
    if (a.dataset.a === "run") { toast("▶ " + t.id + " 已入队 · 看底部状态栏"); }
    if (a.dataset.a === "wiki" || a.dataset.a === "log") toast(a.textContent + "（演示）"); }
  const r = e.target.closest("[data-rail]");
  if (r) { $$("[data-rail]").forEach((x) => x.classList.remove("on")); r.classList.add("on"); toast("切换模块：" + r.querySelector(".tip").textContent.split(" · ")[0] + "（演示里聚焦在任务面）"); }
});
/* ⌘1-5 tab + ⌘K focus style; esc closes active tab */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && tabOpen.length) { const id = tabOn; tabOpen = tabOpen.filter((x) => x !== id); tabOn = tabOpen[0] || TASKS[0].id; refreshAll(); }
  if ((e.metaKey || e.ctrlKey) && /^[1-8]$/.test(e.code.slice(5))) { e.preventDefault(); $$("[data-rail]")[+e.code.slice(5) - 1]?.click(); }
});

/* agent column — always there, like Cursor */
const AG = [["u","五种风格各自的上手成本？"],["a","<p>按「不用学就会用」排：<b>工作台(S2) ≈ 聚光灯(S1) &lt; 活动流(S3) &lt; TUI(S5) &lt; 全景(S4)</b>。你现在看的就是 S2 —— 左边切模块、中间开任务、右边随时喊我，跟你每天的 IDE 是同一套空间感，只是把「文件」换成了「任务」。</p>",
  '<div class="ag-card"><span class="k">READ</span> prototype/desktop-v6 → 对比五稿 · 1.9s ✓</div>']];
function renderAg() { $("#agLog").innerHTML = AG.map((m) => m[0] === "u" ? '<div class="ag-u">❯ ' + esc(m[1]) + "</div>" : '<div class="ag-a">' + m[1] + (m[2] || "") + "</div>").join(""); $("#agLog").scrollTop = 1e6; }
renderAg();
const agSend = () => { const v = $("#agI").value.trim(); if (!v) return; AG.push(["u", v], ["a", "<p>收到，挂到 " + tabOn + " 的时间线上，跑完在状态栏提醒你。（原型演到这里）</p>"]); $("#agI").value = ""; renderAg(); };
$("#agS").onclick = agSend; $("#agI").addEventListener("keydown", (e) => { if (e.key === "Enter") agSend(); });

/* live status: logs stream + clock */
const POOL = ["19:18 — chunk 4/9 · tokens 3.1k","19:18 ok test scaffold green","19:19 — review swarm 2/5 agents"];
setInterval(() => { const term = $("#term"); if (term && TASKS.find((t) => t.id === tabOn)?.col === "进行中") { const d = document.createElement("div"); d.className = Math.random() > .7 ? "ok" : ""; d.textContent = POOL[Math.floor(Date.now() / 4000) % POOL.length]; term.appendChild(d); term.scrollTop = 1e6; } }, 3000);
setInterval(() => { $("#clk").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false }); }, 1000);
})();
</script>
