<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S4 · 全景 Panorama — Octopus</title>
<style>
/* ============ S4 Panorama · 空间墙流派（Figma/obsidian canvas 感） ============
   核心隐喻：所有工作是一面"房间墙"。远看态势，点进一个房间 = 全屏聚焦，Esc 回墙。
   桌面感五稿最强（空间纵深），但没有任何窗口管理：永远只有"墙"和"房间"两种状态。 */
:root {
  --room: #0c0e13; --room-2: #11141c;
  --card: #161a24; --card-2: #1b202c;
  --ink: #e6e9f2; --muted: #8b91a5; --faint: #5b6174;
  --line: #232937; --line-soft: #1c212d;
  --glow: rgba(110, 150, 255, .14);
  --accent: #6f97ff; --ok: #4ade9c; --warn: #ffb454; --danger: #ff6b6b; --violet: #a78bfa;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font: 14px/1.6 var(--sans); background: var(--room); color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(120% 80% at 50% -10%, #1a2135 0%, var(--room) 55%); pointer-events: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; border: 0; outline: none; background: none; }
.mono { font-family: var(--mono); }

.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 16px 26px; }
.hud svg { width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
.hud b { letter-spacing: .02em; }
.zones { display: flex; gap: 4px; margin-left: 12px; }
.zone { font-size: 12px; color: var(--muted); padding: 4px 12px; border-radius: 99px; border: 1px solid transparent; }
.zone:hover { color: var(--ink); }
.zone.on { color: var(--accent); border-color: rgba(111,151,255,.3); background: rgba(111,151,255,.08); }
.hud .right { margin-left: auto; font: 11.5px var(--mono); color: var(--faint); }
.hud .ask { color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 4px 14px; font-size: 12.5px; }
.hud .ask:hover { color: var(--ink); border-color: var(--faint); }

/* the wall */
.wall { position: absolute; inset: 64px 26px 70px; overflow: auto; scroll-behavior: smooth; }
.shelf { margin-bottom: 30px; }
.shelf h2 { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.shelf h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

.rm { position: relative; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(180deg, var(--card-2), var(--card)); padding: 16px 17px 14px; cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s; overflow: hidden; }
.rm:hover { transform: translateY(-3px); border-color: #34405c; box-shadow: 0 14px 40px rgba(0, 0, 0, .5), 0 0 30px var(--glow); }
.rm .state { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.rm.s-run .state { background: linear-gradient(90deg, var(--ok), transparent 70%); box-shadow: 0 0 14px var(--ok); }
.rm.s-wait .state { background: linear-gradient(90deg, var(--warn), transparent 70%); }
.rm.s-done .state { background: linear-gradient(90deg, var(--accent), transparent 70%); opacity: .6; }
.rm.s-queue .state { background: var(--line); }
.rm .t { font-weight: 650; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.rm .t .id { font: 10px var(--mono); color: var(--faint); }
.rm .m { font-size: 12px; color: var(--muted); margin: 3px 0 12px; }
.rm .live-line { font: 10.5px/1.7 var(--mono); color: var(--faint); background: rgba(0, 0, 0, .3); border-radius: 7px; padding: 5px 8px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rm .live-line .cur { color: var(--ok); }
.rm .bar { height: 5px; border-radius: 99px; background: #0d1017; overflow: hidden; }
.rm .bar i { display: block; height: 100%; border-radius: 99px; background: var(--ok); transition: width .9s; }
.rm.s-wait .bar i { background: var(--warn); } .rm.s-done .bar i { background: var(--accent); } .rm.s-queue .bar i { background: var(--faint); }
.rm .foot { display: flex; align-items: center; gap: 8px; margin-top: 9px; font: 10.5px var(--mono); color: var(--faint); }
.rm .pct { margin-left: auto; color: var(--muted); }
.rm .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(74,222,156,.5); animation: gp 2s infinite; }
.rm.s-wait .pulse { background: var(--warn); animation: gpw 1.6s infinite; }
@keyframes gp { 70% { box-shadow: 0 0 0 8px rgba(74,222,156,0); } }
@keyframes gpw { 70% { box-shadow: 0 0 0 8px rgba(255,180,84,0); } }
.rm .zoom-hint { position: absolute; right: 12px; bottom: 11px; font-size: 10px; color: var(--faint); opacity: 0; transition: .15s; }
.rm:hover .zoom-hint { opacity: 1; }
.rm.gone { display: none; }

/* agent as its own "room" on the wall */
.rm.agent { border-style: dashed; }
.rm.agent .msg { font-size: 12px; color: var(--muted); margin: 4px 0; }
.rm.agent .msg b { color: var(--ink); }

/* the ROOM view (zoom) */
.room { position: fixed; inset: 0; z-index: 60; background: rgba(8, 10, 15, .72); backdrop-filter: blur(6px); display: none; }
.room.on { display: block; }
.room-in { position: absolute; background: linear-gradient(180deg, #1a1f2b, #151922); border: 1px solid #34405c; border-radius: 18px; padding: 26px 30px; overflow: auto; top: 5vh; left: 50%; transform: translateX(-50%); width: min(920px, 92vw); height: 90vh; box-shadow: 0 40px 120px rgba(0,0,0,.7); transition: all .26s cubic-bezier(.2,.8,.2,1); }
.room .rt { font-size: 19px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 12px; }
.room .rt .id { font: 11px var(--mono); color: var(--faint); }
.room .rm-meta { color: var(--muted); font-size: 12.5px; margin: 3px 0 16px; }
.room .back { position: sticky; top: 0; float: right; font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 3px 12px; border-radius: 99px; background: #171b25; z-index: 5; }
.room .back:hover { color: var(--ink); }
.rgrid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 26px; }
h4.sect { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
.ph { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
.ph .g { width: 18px; text-align: center; }
.ph.d .g { color: var(--ok); } .ph.r .g { color: var(--accent); } .ph.n .g { color: var(--faint); }
.ph .pm { margin-left: auto; color: var(--faint); font-size: 11px; font-family: var(--mono); }
.chk { display: flex; gap: 9px; padding: 4px 0; font-size: 13px; }
.chk .c { color: var(--ok); font-family: var(--mono); }
.chk.no .c { color: var(--warn); } .chk.no { color: var(--muted); }
.tlog { font: 11.5px/1.9 var(--mono); background: #0b0e14; border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; height: 220px; overflow: auto; color: #97a0b5; }
.tlog .ok { color: var(--ok); } .tlog .wn { color: var(--warn); }
.racts { display: flex; gap: 8px; margin: 14px 0 18px; }
.btn { font-size: 12.5px; padding: 5px 15px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink); background: #1d222e; }
.btn:hover { border-color: var(--faint); }
.btn.hot { background: var(--accent); border-color: var(--accent); color: #0a0d14; font-weight: 650; }
.btn.no { color: var(--danger); border-color: rgba(255,107,107,.4); }
.btn.ghost { border-color: transparent; color: var(--muted); }

.dock { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; display: flex; align-items: center; gap: 14px; padding: 0 26px; border-top: 1px solid var(--line-soft); background: linear-gradient(180deg, transparent, var(--room) 40%); z-index: 15; }
.dock .say { flex: 1; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 15px; }
.dock .say:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(111,151,255,.15); }
.dock .say .p { color: var(--accent); font-family: var(--mono); font-weight: 700; }
.dock .say input { flex: 1; font-size: 13.5px; }
.dock .say kbd { font: 10px var(--mono); color: var(--faint); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; }

.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(8px); background: #e6e9f2; color: #10131a; font-size: 13px; font-weight: 550; padding: 8px 18px; border-radius: 9px; opacity: 0; transition: .2s; z-index: 99; }
.toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<header class="hud">
  <svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9 9-9Z"/><circle cx="12" cy="12" r="2.2"/></svg>
  <b>octopus</b>
  <nav class="zones"><button class="zone on">全景</button><button class="zone">进行中 3</button><button class="zone">等你 2</button><button class="zone">归档</button></nav>
  <button class="ask">问主 Agent ⌘J</button>
  <span class="right">3 running · 2 needs-you · $42.18 · ⌥1-3 切换分区</span>
</header>

<main class="wall" id="wall"></main>

<div class="room" id="room"><div class="room-in" id="roomIn"></div></div>

<footer class="dock"><div class="say"><span class="p">❯</span><input id="di" placeholder="从这面墙直接下令：新建任务 · 跑编译 · 查账… 点卡片进入房间" autofocus /><kbd>⏎</kbd></div></footer>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const TASKS = {
  "T-01": { t: "feat-desktop-shell", st: "s-run", col: "进行中", p: 68, m: "open-octopus · build 3/6 · agent", cost: "$0.84 · 18m",
    live: "write app.css — 890 lines",
    phases: [["d","plan","2.1s"],["d","scaffold","14s"],["r","build · 窗口回归","68%"],["n","test"],["n","review swarm"],["n","approval"]],
    checks: [[1,"rail 直达"],[1,"看板↔详情"],[1,"拖拽吸附"],[0,"主题持久化"]],
    logs: ["19:15 ok node 3/6 smoke green","19:16 — write app.css 890 lines","19:17 ! snap z conflict → fixed","19:18 ok test scaffold green"] },
  "T-02": { t: "task-acceptance · r2", st: "s-wait", col: "等你", p: 80, m: "4/5 探针 · 焦点顺序等你复验", cost: "$1.12 · 42m",
    live: "probe 5 waiting 42m …",
    phases: [["d","board 走查"],["d","run 走查"],["r","键盘焦点","等你"],["n","verdict"]],
    checks: [[1,"卡片联动"],[1,"状态保活"],[0,"focus order"]],
    logs: ["18:58 ! probe5 focus-order waiting"] },
  "A-1": { t: "批准部署 → production", st: "s-wait", col: "等你", p: 100, m: "harness guard · 40 分钟窗口", cost: "diff +892 −14", alert: true,
    phases: [["d","探针 5/5"],["r","等你批准","40m"],["n","deploy"]], checks: [[1,"回归全绿"]], logs: ["guard armed"] },
  "T-03": { t: "nightly-knowledge-compile", st: "s-queue", col: "进行中", p: 0, m: "cron 0 2 * * * · 预算 $2", cost: "in 7h",
    phases: [["n","index"],["n","compile 214p"],["n","prune"]], checks: [[0,"预算内"]], logs: ["queued"] },
  "T-04": { t: "harness 接入 P0", st: "s-done", col: "归档", p: 100, m: "6 probes green · merged", cost: "$3.9",
    phases: [["d","forensics"],["d","结论入册"]], checks: [[1,"入册"]], logs: ["17:40 ok done → wiki"] },
  "T-79": { t: "知识中心改版", st: "s-done", col: "归档", p: 100, m: "ADR-0033 · wiki 主场", cost: "merged", phases: [["d","shipped"]], checks: [[1,"live"]], logs: [] },
  "M-02": { t: "SEO 技术审计", st: "s-run", col: "进行中", p: 22, m: "marketing · cwv", cost: "$0.12", live: "parsing sitemap…", phases: [["r","audit"],["n","report"]], checks: [], logs: [] },
};
const COLS = [["等你", (t) => t.st === "s-wait"], ["进行中", (t) => t.st === "s-run" || t.st === "s-queue"], ["归档", (t) => t.st === "s-done"]];

function renderWall() {
  $("#wall").innerHTML = COLS.map(([name, fn]) => {
    const ts = Object.entries(TASKS).filter(([, t]) => t.col === name && fn(t));
    if (!ts.length) return "";
    return '<section class="shelf"><h2>' + name + " · " + ts.length + "</h2><div class='cards'>" + ts.map(([id, t]) =>
      '<article class="rm ' + t.st + '" data-room="' + id + '"><span class="state"></span>' +
      '<div class="t">' + (t.st !== "s-done" && t.st !== "s-queue" ? '<span class="pulse"></span>' : "") + esc(t.t) + ' <span class="id">' + id + "</span></div>" +
      '<div class="m">' + esc(t.m) + "</div>" +
      (t.live && t.st === "s-run" ? '<div class="live-line"><span class="cur">▊</span> ' + esc(t.live) + "</div>" : "") +
      '<div class="bar"><i style="width:' + t.p + '%"></i></div>' +
      '<div class="foot"><span>' + esc(t.cost) + "</span><span class='pct'>" + (t.p || "—") + (t.p ? "%" : "") + "</span></div>" +
      '<span class="zoom-hint">⏎ 进入</span></article>').join("") + "</div></section>";
  }).join("") +
  '<section class="shelf"><h2>值班</h2><div class="cards"><article class="rm agent s-run" data-room="__agent"><span class="state"></span><div class="t">主 Agent <span class="id">global</span></div><div class="msg"><b>你:</b> 五种风格哪个桌面感最强？</div><div class="msg"><b>main:</b> 这面墙 —— 空间感来自纵深，不来自管理。</div></article></div></section>';
}
renderWall();

/* zoom into room / back */
const room = $("#room"), roomIn = $("#roomIn");
let liveTimer;
function openRoom(id, fromEl) {
  clearInterval(liveTimer);
  if (id === "__agent") { roomIn.innerHTML = '<button class="back" data-back>← 回墙 (esc)</button><div class="rt">主 Agent</div><div class="rm-meta">跨任务常驻 · opus · ctx 42% · $0.31</div><div class="tlog" style="height:60vh">19:01 ❯ 五种风格哪个桌面感最强？<br><span class="ok">19:01 ▸ 这面墙。空间感来自纵深（远看→点进），而不是窗口管理。<br>19:02 ▸ 若日常是"多任务+盯验收"，建议 S2 骨架 + 这稿的全景作为「总览页」。</span><br><span style="color:var(--accent)">▊</span></div>'; room.classList.add("on"); return; }
  const t = TASKS[id];
  const glyph = { d: "✓", r: "●", n: "○" };
  roomIn.innerHTML = '<button class="back" data-back>← 回墙 (esc)</button>' +
    '<div class="rt">' + esc(t.t) + ' <span class="id">' + id + " · " + t.st.slice(2).toUpperCase() + "</span></div>" +
    '<div class="rm-meta">' + esc(t.m) + " · " + esc(t.cost) + "</div>" +
    '<div class="racts">' + (t.alert ? '<button class="btn hot" data-do="approve">批准部署</button><button class="btn no" data-do="reject">打回</button>' : "") +
    (t.st === "s-wait" && !t.alert ? '<button class="btn hot" data-do="verify">复验通过</button><button class="btn" data-do="replay">重放探针</button>' : "") +
    (t.st === "s-queue" ? '<button class="btn hot" data-do="run">提前跑一次</button>' : "") +
    (t.st === "s-run" ? '<button class="btn no" data-do="abort">中止</button>' : "") +
    '<button class="btn ghost" data-do="spec">规格 → wiki</button></div>' +
    '<div class="rgrid"><div><h4 class="sect">Phases</h4>' + t.phases.map((p) => '<div class="ph ' + p[0] + '"><span class="g">' + glyph[p[0]] + "</span><span>" + esc(p[1]) + "</span>" + (p[2] ? '<span class="pm">' + esc(p[2]) + "</span>" : "") + "</div>").join("") +
    (t.checks.length ? '<h4 class="sect" style="margin-top:16px">Acceptance</h4>' + t.checks.map((c) => '<div class="chk ' + (c[0] ? "" : "no") + '"><span class="c">' + (c[0] ? "[x]" : "[ ]") + "</span><span>" + esc(c[1]) + "</span></div>").join("") : "") +
    '</div><div><h4 class="sect">Live output</h4><div class="tlog" id="rl">' + t.logs.map((l) => '<div class="' + (l.includes("ok") ? "ok" : l.includes("!") ? "wn" : "") + '">' + esc(l) + "</div>").join("") + "</div></div></div>";
  /* fly-from-card feel: start small at card position */
  if (fromEl) { const r = fromEl.getBoundingClientRect();
    roomIn.style.transition = "none";
    Object.assign(roomIn.style, { top: r.top + "px", left: (r.left + r.width / 2) + "px", width: r.width + "px", height: r.height + "px", opacity: .4 });
    room.classList.add("on");
    requestAnimationFrame(() => requestAnimationFrame(() => { roomIn.style.transition = ""; Object.assign(roomIn.style, { top: "5vh", left: "50%", width: "min(920px, 92vw)", height: "90vh", opacity: 1 }); }));
  } else room.classList.add("on");
  /* live tail in room */
  if (t.st === "s-run") { const pool = ["— chunk 5/9 · 2.8k tok","ok lint clean","— compiling swarm verdicts","ok node 4/6 start"]; let i = 0;
    liveTimer = setInterval(() => { const box = $("#rl"); if (!box || !room.classList.contains("on")) return;
      const d = document.createElement("div"); d.className = pool[i] && pool[i].includes("ok") ? "ok" : ""; d.textContent = "19:2" + (i % 6) + ":0" + (i % 9) + " " + pool[i++ % pool.length]; box.appendChild(d); box.scrollTop = 1e6; }, 2000); }
}
const closeRoom = () => { room.classList.remove("on"); clearInterval(liveTimer); };

let tt; const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1900); };
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-back]")) return closeRoom();
  const doIt = e.target.closest("[data-do]");
  if (doIt) { const a = doIt.dataset.do;
    if (["approve","verify"].includes(a)) { toast("✓ 完成 · 退出到墙"); const id = roomIn.querySelector(".id").textContent.trim().split(" ")[0]; delete TASKS[id]; setTimeout(() => { closeRoom(); renderWall(); }, 500); }
    else if (a === "reject" || a === "abort") { toast("↩ 已" + (a === "abort" ? "中止" : "打回") + " · agent 接手重做"); }
    else toast("（演示）" + doIt.textContent);
    return; }
  const rm = e.target.closest("[data-room]");
  if (rm) openRoom(rm.dataset.room, rm);
  const z = e.target.closest(".zone");
  if (z) { document.querySelectorAll(".zone").forEach((x) => x.classList.remove("on")); z.classList.add("on");
    const map = { "全景": null, "进行中 3": 1, "等你 2": 0, "归档": 2 }; const idx = map[z.textContent.trim()];
    const shelves = document.querySelectorAll(".shelf");
    if (idx === null) $("#wall").scrollTop = 0; else if (shelves[idx]) $("#wall").scrollTo({ top: shelves[idx].offsetTop - 80, behavior: "smooth" }); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeRoom(); });
$("#di").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.value.trim()) { toast("❯ " + e.target.value.trim() + " → 交给主 Agent"); e.target.value = ""; } });

/* wall heartbeat */
setInterval(() => { const t = TASKS["T-01"]; if (!t || t.st !== "s-run") return; t.p = Math.min(97, t.p + 1);
  const bar = document.querySelector('[data-room="T-01"] .bar i'); if (bar) bar.style.width = t.p + "%";
  const pv = document.querySelector('[data-room="T-01"] .pct'); if (pv) pv.textContent = t.p + "%"; }, 4000);
})();
</script>
</body>
</html>
