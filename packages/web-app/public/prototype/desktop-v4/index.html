<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Octopus — Desktop v4</title>
  <meta name="description" content="Octopus desktop v4: spaces, windows, dock, command layer and a persistent main agent." />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" data-action="launcher" title="App launcher">
        <svg class="icon brand-mark" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
        <span>octopus</span>
      </button>
      <button class="space-switch" id="space-switch" data-action="space-menu" title="Switch space">
        <span class="space-dot" id="space-dot"></span>
        <span id="space-name">open-octopus</span>
        <svg class="icon chev" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </button>
      <button class="commandbar" data-action="palette">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <span>Search or ask anything…</span>
        <kbd>⌘K</kbd>
      </button>
      <div class="topbar-right">
        <button class="status" id="running-status" data-action="open-runs" title="Open runs">
          <span class="status-dot"></span>
          <span id="running-label">2 active</span>
        </button>
        <button class="ask-btn" data-action="agent" title="Ask main agent">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-message"/></svg>
          <span>Ask</span>
        </button>
        <button class="icon-btn" data-action="notifications" title="Notifications">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bell"/></svg>
          <span class="badge-dot"></span>
        </button>
        <button class="icon-btn" data-action="mission" title="Mission Control">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grid"/></svg>
        </button>
        <button class="icon-btn theme-btn" data-action="theme" title="Theme">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
        <button class="avatar" data-action="launcher" title="Apps">ZF</button>
      </div>
    </header>

    <main class="desktop" id="desktop" aria-label="Desktop canvas">
      <section class="space-layer" data-space="open-octopus"></section>
      <section class="space-layer" data-space="marketing-site" hidden></section>
      <section class="space-layer" data-space="research-scout" hidden></section>
      <section class="global-layer" id="global-layer" aria-label="Global windows"></section>
      <div class="snap-preview" id="snap-preview"></div>
      <div class="desktop-hint">⌘K command · ⌘J agent · ⌥T tile · ⌘⇧M mission control</div>
    </main>

    <footer class="dock" aria-label="Open windows">
      <button class="dock-launch" data-action="launcher" title="App launcher">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grid"/></svg>
      </button>
      <div class="dock-items" id="dock-items"></div>
      <div class="dock-actions">
        <button class="dock-action" data-action="mission" title="Mission Control">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grid"/></svg>
        </button>
        <button class="dock-action" data-action="space-menu" title="Spaces">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-folder"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <div class="overlay launcher-overlay" id="launcher" aria-hidden="true">
    <div class="launcher-panel" role="dialog" aria-label="App launcher">
      <header class="overlay-head">
        <div>
          <p class="kicker">Octopus</p>
          <h2>Apps</h2>
        </div>
        <button class="icon-btn" data-action="close-launcher" title="Close">×</button>
      </header>
      <div class="launcher-grid" id="launcher-grid"></div>
    </div>
  </div>

  <div class="overlay palette-overlay" id="palette" aria-hidden="true">
    <div class="palette-panel" role="dialog" aria-label="Command palette">
      <div class="palette-input">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="palette-input" placeholder="Open a window, switch space, or ask main…" autocomplete="off" spellcheck="false" />
        <kbd>esc</kbd>
      </div>
      <div class="palette-list" id="palette-list"></div>
    </div>
  </div>

  <div class="overlay mission-overlay" id="mission" aria-hidden="true">
    <div class="mission-panel" role="dialog" aria-label="Mission Control">
      <header class="overlay-head">
        <div>
          <p class="kicker">Mission Control</p>
          <h2>Everything stays alive.</h2>
        </div>
        <div class="mission-actions">
          <button class="secondary" data-action="tile">Tile</button>
          <button class="secondary" data-action="cascade">Cascade</button>
          <button class="primary" data-action="close-mission">Back to work</button>
        </div>
      </header>
      <div class="mission-grid" id="mission-grid"></div>
    </div>
  </div>

  <div class="panel space-menu" id="space-menu" hidden></div>
  <div class="panel notifications" id="notifications" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
