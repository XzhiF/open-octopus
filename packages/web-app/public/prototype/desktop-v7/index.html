<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Octopus Desktop — v7 综合体</title>
  <meta name="description" content="Octopus desktop v7: v1 的快捷直达 + v6 的安静皮肤 + 吸附分屏（边缘即对齐 · 分隔条调比例）+ 子窗口层叠。" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app">
    <!-- top bar: identity + space dropdown + search + vitals -->
    <header class="hud">
      <div class="hud-left">
        <button class="mark" data-action="palette" title="octopus">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
          <span class="mark-name">octopus</span>
        </button>
        <div class="switch-wrap">
          <button class="space-switch" data-action="space-menu" title="切换工作桌面 · ⌥←/→">
            <span class="ss-dot"></span>
            <span id="space-name">open-octopus</span>
            <span class="ss-chev"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chev-down"/></svg></span>
          </button>
          <div class="menu" id="space-menu" hidden></div>
        </div>
      </div>

      <button class="hud-search" data-action="palette" title="Command palette · ⌘K">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <span>Search or ask anything…</span>
        <kbd>⌘K</kbd>
      </button>

      <div class="hud-vitals" id="hud-vitals">
        <span class="vital" id="v-tokens" title="token throughput">◮ <b>0.0k</b> t/s</span>
        <button class="vital" id="v-runs" data-action="open-app" data-app="runs" title="Active runs">⟐ <b>0</b> RUN</button>
        <button class="vital v-alert" id="v-alert" data-action="open-app" data-app="inbox" title="Needs you">! <b>0</b> NEEDS-YOU</button>
      </div>

      <div class="hud-right">
        <button class="hud-btn theme-btn" data-action="theme-toggle" title="Light / Dark">
          <span class="t-sun"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun"/></svg></span><span class="t-moon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg></span>
        </button>
        <button class="hud-btn" data-action="help" title="Shortcuts · ?">?</button>
        <button class="hud-avatar" data-action="open-app" data-app="sys" title="System">ZF</button>
      </div>
    </header>

    <div class="mid">
      <!-- left rail: quick-jump shortcuts -->
      <nav class="rail" id="rail" aria-label="Quick jump"></nav>

      <!-- desktop: floating windows per space -->
      <main class="desktop" id="desktop" aria-label="Desktop canvas">
        <section class="space-layer" data-space="open-octopus"></section>
        <section class="space-layer" data-space="marketing-site" hidden></section>
        <section class="space-layer" data-space="research-scout" hidden></section>
        <div class="global-layer" id="global-layer" aria-label="Global windows"></div>

        <div class="snap-preview" id="snap-preview" hidden><span class="sp-lab"></span></div>

        <div class="desk-hint" id="desk-hint">
          rail <kbd>⌥1</kbd>…<kbd>⌥9</kbd> · 拖边缘 = <b>分屏</b> · 拖四边 = <b>调大小</b> · <kbd>Ctrl+Tab</kbd> 切窗 · <kbd>⌘⇧M</kbd> 多任务 · <kbd>⌥T</kbd> 整理 · <kbd>⌘K</kbd> 面板
        </div>
      </main>
    </div>

    <!-- bottom console bar: command line + minimized shelf + clock -->
    <footer class="consolebar">
      <div class="console-line">
        <button class="con-toggle" id="con-toggle" data-action="console-log" title="Scrollback">▴</button>
        <span class="con-prompt">octopus ❯</span>
        <input id="console" class="con-input" autocomplete="off" spellcheck="false"
               placeholder="command…  help · new <title> · run <task> · ask <text> · theme dark" />
        <nav class="taskbar" id="taskbar" aria-label="Window tabs" title="点切窗口 · Ctrl+Tab 循环"></nav>
        <button class="tb-btn" data-action="tile" title="一键整理窗口 · ⌥T">⌗ 整理</button>
        <div class="shelf" id="shelf" aria-label="Minimized windows"></div>
        <span class="con-clock mono" id="clock">--:--:--</span>
      </div>
      <div class="console-out" id="console-out" hidden></div>
    </footer>
  </div>

  <!-- command palette -->
  <div class="overlay" id="palette" hidden>
    <div class="palette-panel" role="dialog" aria-label="Command palette">
      <div class="palette-input">
        <span class="pal-k">❯</span>
        <input id="palette-input" autocomplete="off" spellcheck="false"
               placeholder="open · switch · run · or just ask main…" />
        <kbd>esc</kbd>
      </div>
      <div class="palette-list" id="palette-list"></div>
      <div class="palette-foot">
        <span><kbd>↑↓</kbd> select</span><span><kbd>⏎</kbd> run</span><span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- mission control -->
  <div class="overlay" id="mission" hidden>
    <div class="mission-head">
      <span class="kicker">Mission Control — 悬停卡片摆位 · 点卡片聚焦 · everything stays alive</span>
      <div class="mission-actions">
        <button class="cmd" data-action="tile">⌗ 整理</button>
        <button class="cmd" data-action="cascade">层叠</button>
        <button class="cmd cmd-hot" data-action="close-mission">返回</button>
      </div>
    </div>
    <div class="mission-grid" id="mission-grid"></div>
  </div>

  <!-- shortcut sheet -->
  <div class="overlay" id="help" hidden>
    <div class="help-panel" role="dialog" aria-label="Shortcuts">
      <div class="help-title">Keyboard</div>
      <div class="help-grid" id="help-grid"></div>
      <div class="help-foot"><span>Tip: press <kbd>⌘K</kbd> and type to ask the main agent</span><button class="cmd cmd-hot" data-action="close-help">Close</button></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
