appId: com.octopus.desktop
productName: Octopus
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/runtime
    to: runtime
  - from: resources/web
    to: web
  - from: resources/server
    to: server
  # electron-builder 的 copy filter 会无条件跳过 extraResources 源目录根级的
  # node_modules（util/filter.js: relative === "node_modules" → false）。
  # 依赖树必须保留 node_modules 原名（ESM 裸模块解析不认 NODE_PATH），
  # 所以单独映射一次：此时源根就是这个目录本身，不受那条规则影响。
  - from: resources/server/node_modules
    to: server/node_modules
  - from: resources/packages/core-pack
    to: packages/core-pack
  # 托盘图标：由 prepare-resources 从 build/tray 拷进 resources/，
  # 运行时从 process.resourcesPath/tray 读。
  - from: resources/tray
    to: tray
  # M4 远程拉起：安装器与控制脚本（设置页一键启用时以管理员调用）。
  - from: resources/remote
    to: remote
asar: true
npmRebuild: false
publish: null
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dir
      arch:
        - arm64
win:
  target:
    - target: dir
linux:
  target:
    - target: dir
