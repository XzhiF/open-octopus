name: Package Desktop

# 桌面端出包（Windows x64）：Actions → Package Desktop → Run workflow；打 v* tag 也会自动出包。
# 产物在同一次运行的 Artifacts 里，14 天后过期。
#
# 与 `pnpm desktop:pack` 完全同一条链（build-main → prepare-resources → electron-builder --dir），
# sidecar 的 Node runtime、better-sqlite3 原生模块、web dist、core-pack 都由脚本就地生成。
#
# 为什么没有 macOS：GitHub 免费计划的公开仓不支持 arm64 macOS runner —— 该 job 会被秒取消
# （annotation: configuration 'macos-14-arm64-us-default' is not supported）。macOS arm64 包
# 继续在本机跑 `pnpm desktop:pack`（见 packages/desktop/README.md）；要用 CI 出 mac 包，
# 需要付费计划或在这台 Mac 上挂 self-hosted runner。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10 # 与 ci.yml 同口径：lockfile 的 overrides 是 pnpm 10 格式
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm desktop:pack

      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path packages/desktop/release/win-unpacked/* -DestinationPath Octopus-desktop-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: octopus-desktop-windows-x64
          path: Octopus-desktop-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
